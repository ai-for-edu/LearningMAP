[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openail"
version = "0.1.0"
description = "AI Education Assistant Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.42.0",
    "instructor>=1.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "jinja2>=3.1.0",
    "sse-starlette>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=2.30.0",
    "python-pptx>=1.0.2",
    "matplotlib>=3.10.8",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/manual", ".git", ".venv", "__pycache__"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "run*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
]
