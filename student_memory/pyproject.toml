[project]
name = "student-memory"
version = "0.1.0"
description = "Local student memory system — FastAPI service for recency-aware semantic retrieval of learning records."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "hnswlib>=0.8.0",
    "numpy>=1.26.0,<3.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ml: tests that require the real sentence-transformers model (slow, needs torch)",
]
addopts = "-m 'not ml'"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
