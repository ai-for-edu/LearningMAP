<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenAILearning - Lesson</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } } }
</script>
<style>
:root {
  --bg: #FAF9F7; --bg-sidebar: #F0EDE8; --bg-doc: #FDFCFA;
  --border: #EAE6E0; --border-input: #E0DDD8;
  --accent: #CF6833; --accent-light: #FFF3EC; --accent-border: #F5D5BF; --accent-dark: #9E4A2A;
  --text: #1a1a1a; --text-2: #4a4a4a; --text-3: #888; --text-4: #B0A898;
  --error: #DC2626; --success: #059669;
}
* { box-sizing: border-box; }
body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); margin: 0; }

/* ── Sidebar ── */
#sidebar {
  width: 210px; height: 100vh; position: fixed; left: 0; top: 0;
  background: var(--bg-sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; z-index: 40;
}
.sidebar-logo { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin-bottom: 8px; }
.sidebar-logo-icon {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  display: flex; align-items: center; justify-content: center;
  color: white;
}
.sidebar-logo-text { font-size: 13px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
.new-session-btn {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border: 1.5px dashed #D4CFC8; border-radius: 8px; background: transparent;
  font-size: 13px; font-weight: 500; color: var(--text-3); cursor: pointer;
  margin-bottom: 12px; width: 100%;
}
.new-session-btn:hover { background: white; }
.session-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; font-size: 13px; color: var(--text-3); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-item:hover { background: #E8E4DE; }
.session-item.active { background: white; color: var(--text); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.07); }

/* ── Top Nav ── */
#topNav {
  height: 50px; position: fixed; top: 0; left: 210px; right: 0; z-index: 30;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
}
.topnav-left { display: flex; align-items: center; gap: 8px; }
.topnav-title { font-size: 14px; font-weight: 600; color: var(--text); }
.topnav-skill-pill {
  display: flex; align-items: center; gap: 5px;
  background: var(--accent-light); border: 1px solid var(--accent-border);
  color: var(--accent-dark); font-size: 11px; font-weight: 600;
  padding: 4px 10px; border-radius: 99px; cursor: pointer;
}
.topnav-actions { display: flex; align-items: center; gap: 8px; }
.topnav-ghost-btn {
  display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500;
  color: var(--text-3); background: transparent; border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 99px; cursor: pointer; text-decoration: none;
}
.topnav-ghost-btn:hover { background: white; color: var(--text-2); }
.topnav-ghost-btn .material-symbols-outlined { font-size: 15px; }

/* ── Step Nav ── */
#stepNav {
  height: 44px; position: fixed; top: 50px; left: 210px; right: 0; z-index: 29;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 0;
}
.step-item {
  display: flex; align-items: center; gap: 6px; padding: 0 8px; height: 44px;
  font-size: 13px; font-weight: 500; color: var(--text-4); cursor: default;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.step-item.done { color: var(--accent); }
.step-item.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
.step-num {
  width: 20px; height: 20px; border-radius: 50%; background: #E8E4DE; color: var(--text-4);
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600;
}
.step-item.done .step-num { background: var(--accent); color: white; }
.step-item.active .step-num { background: var(--accent); color: white; }
.step-sep { color: #D4CFC8; font-size: 14px; padding: 0 4px; }

/* ── Three-column layout ── */
#mainContent {
  margin-left: 210px; margin-top: 94px; height: calc(100vh - 94px);
  display: flex; overflow: hidden;
}

/* TOC column */
#tocPanel {
  width: 190px; flex-shrink: 0; background: var(--bg-doc);
  border-right: 1px solid var(--border); overflow-y: auto;
  padding: 16px 0 80px;
}
.toc-header { font-size: 10px; font-weight: 600; color: var(--text-4); text-transform: uppercase; letter-spacing: .06em; padding: 0 16px; margin-bottom: 8px; }
.toc-item {
  padding: 6px 16px; font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer;
  transition: all .1s; border-left: 3px solid transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.toc-item.h3 {
  padding: 4px 16px 4px 26px; font-size: 12px; font-weight: 400; color: var(--text-3);
}
.toc-item.h4 {
  padding: 3px 16px 3px 36px; font-size: 11px; font-weight: 400; color: var(--text-4);
}
.toc-item:hover { color: var(--text-2); background: #F0EDE8; }
.toc-item.active { color: var(--accent); background: var(--accent-light); border-left-color: var(--accent); font-weight: 500; }
.toc-weak-box { margin: 12px 10px 0; background: var(--accent-light); border: 1px solid var(--accent-border); border-radius: 8px; padding: 10px 12px; }
.toc-weak-label { font-size: 10px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.toc-weak-item { font-size: 11px; color: var(--accent-dark); line-height: 1.5; }

/* Main document column */
#docPanel { flex: 1; overflow-y: auto; padding: 24px 32px 120px; position: relative; }

/* Right panel */
#rightPanel {
  width: 200px; flex-shrink: 0; background: var(--bg-doc);
  border-left: 1px solid var(--border); overflow-y: auto;
  padding: 16px 0 80px;
}
.right-panel-section { padding: 0 12px; margin-bottom: 20px; }
.right-panel-title { font-size: 10px; font-weight: 600; color: var(--text-4); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; display: block; }
.ks-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.ks-toggle { width: 32px; height: 18px; border-radius: 9px; background: #D4CFC8; position: relative; cursor: pointer; transition: background .2s; border: none; flex-shrink: 0; }
.ks-toggle.on { background: var(--accent); }
.ks-toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: white; transition: left .2s; }
.ks-toggle.on::after { left: 16px; }
.ks-card { background: white; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border); }
.ks-card summary { padding: 8px 10px; font-size: 12px; font-weight: 600; color: var(--text-2); cursor: pointer; display: flex; align-items: center; gap: 6px; list-style: none; }
.ks-card summary::marker, .ks-card summary::-webkit-details-marker { display: none; }
.ks-card-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
.ks-card-body { padding: 0 10px 10px; font-size: 11px; color: var(--text-3); line-height: 1.5; }
#lessonGraph { height: 220px; background: #FAFAF9; border-radius: 8px; border: 1px solid var(--border); }
.graph-legend-row { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
.graph-legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-4); }
.graph-legend-dot { width: 7px; height: 7px; border-radius: 50%; }

/* ── Lesson document typography ── */
.lesson-title { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
.lesson-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-4); margin-bottom: 20px; flex-wrap: wrap; }
.lesson-skill-tag { background: var(--accent-light); border: 1px solid var(--accent-border); color: var(--accent-dark); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.lesson-section { scroll-margin-top: 110px; }
.lesson-section h2 { font-weight: 700; font-size: 14px; color: var(--text); margin: 20px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.lesson-section h3 { font-weight: 700; font-size: 13px; color: var(--accent-dark); margin: 16px 0 8px; }
.lesson-section h4 { font-weight: 600; font-size: 13px; color: var(--text-2); margin: 12px 0 6px; }
.lesson-section p { line-height: 1.75; margin: 8px 0; color: var(--text-2); font-size: 13px; }
.lesson-section ul, .lesson-section ol { margin: 8px 0; padding-left: 1.5rem; color: var(--text-2); font-size: 13px; }
.lesson-section li { margin: 4px 0; line-height: 1.7; }
.lesson-section strong { color: var(--text); font-weight: 600; }
.lesson-section blockquote { border-left: 3px solid var(--accent); background: var(--accent-light); padding: 10px 14px; margin: 12px 0; border-radius: 0 8px 8px 0; }
.lesson-section blockquote p { color: var(--text-2); margin: 0; }
.lesson-section code { background: var(--bg-sidebar); padding: .1rem .35rem; border-radius: .25rem; font-size: .85em; color: var(--accent-dark); }
.lesson-section pre { background: #1e293b; color: #e2e8f0; padding: 1.25rem; border-radius: 8px; overflow-x: auto; margin: 12px 0; }
.lesson-section pre code { background: none; color: inherit; padding: 0; }
.lesson-section table { width: 100%; border-collapse: collapse; margin: 12px 0; }
.lesson-section th { background: var(--bg-sidebar); font-weight: 700; text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--border); font-size: 12px; }
.lesson-section td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
.lesson-section hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

/* Inline knowledge skill cards (inserted before each h2 by JS) */
.inline-ks-card { background: #F0FDF4; border: 1.5px dashed #86EFAC; border-radius: 8px; margin-bottom: 10px; }
.inline-ks-card summary { padding: 10px 14px; font-size: 12px; font-weight: 600; color: #15803D; cursor: pointer; display: flex; align-items: center; gap: 6px; list-style: none; }
.inline-ks-card summary::marker, .inline-ks-card summary::-webkit-details-marker { display: none; }
.inline-ks-card-body { padding: 0 14px 12px; font-size: 11px; color: #166534; line-height: 1.55; }

.kc-skill-card {
  margin: 12px 0;
  border: 1px solid #C7D4E8;
  border-radius: 8px;
  background: #F1F5FB;
  overflow: hidden;
}
.kc-skill-card summary {
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  color: #3B5A8A;
  cursor: pointer;
  list-style: none;
}
.kc-skill-card summary::-webkit-details-marker { display: none; }
.kc-skill-card summary::before {
  content: '▸';
  display: inline-block;
  margin-right: 6px;
  transition: transform 0.15s;
}
.kc-skill-card[open] summary::before { transform: rotate(90deg); }
.kc-skill-card-body {
  padding: 10px 14px 14px 26px;
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.6;
  background: white;
}
.kc-skill-card-body p { margin: 4px 0; }
.kc-skill-card-body strong { color: #3B5A8A; }

/* Pedagogy skill card */
.pedagogy-skill-card { background: var(--accent-light); border: 1.5px solid var(--accent-border); border-radius: 10px; margin-bottom: 16px; }
.pedagogy-skill-card summary { padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--accent-dark); cursor: pointer; display: flex; align-items: center; gap: 8px; list-style: none; }
.pedagogy-skill-card summary::marker, .pedagogy-skill-card summary::-webkit-details-marker { display: none; }
.pedagogy-skill-card-body { padding: 0 16px 14px; font-size: 12px; color: var(--accent-dark); line-height: 1.55; }

/* Selection toolbar */
#selectionToolbar { display: none; position: absolute; z-index: 60; animation: fadeIn .12s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.noted-text { background: #FFF9C4; border-bottom: 2px solid #F59E0B; cursor: pointer; }
.noted-text.selected-note { background: #FDE68A; }

/* Finish / slides nav buttons */
.lesson-finish-btn {
  background: var(--accent); color: white; font-size: 13px; font-weight: 600;
  padding: 10px 24px; border-radius: 99px; border: none; cursor: pointer; transition: background .15s;
}
.lesson-finish-btn:hover { background: var(--accent-dark); }
.lesson-slides-btn {
  background: transparent; color: var(--text-3); font-size: 13px; font-weight: 500;
  padding: 10px 20px; border-radius: 99px; border: 1px solid var(--border); cursor: pointer; transition: all .15s;
}
.lesson-slides-btn:hover { background: white; color: var(--text-2); }

/* Lesson nav — flex layout when revealed by JS */
#lessonNav { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }

/* Bottom chat input */
#lessonBottomBar {
  position: fixed; bottom: 0; left: 210px; right: 0; z-index: 28;
  padding: 10px 14px; background: var(--bg); border-top: 1px solid var(--border);
  display: none; align-items: center; gap: 8px;
}
#lessonChatInput {
  flex: 1; font-size: 13px; font-family: 'Inter', sans-serif; color: var(--text);
  border: 1.5px solid var(--border-input); border-radius: 10px; outline: none;
  padding: 8px 12px; background: white;
}
#lessonChatInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(207,104,51,.1); }
.lesson-send-btn { width: 34px; height: 34px; background: var(--accent); border-radius: 8px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; }
.lesson-send-btn:hover { background: var(--accent-dark); }

/* Note annotation card in margin */
.note-annotation {
  position: absolute;
  right: 0;
  width: 200px;
  background: var(--accent-light);
  border: 1px solid var(--accent-border);
  border-radius: 12px;
  padding: 8px 10px;
  font-size: 12px;
  color: var(--accent-dark);
  font-family: 'Inter', sans-serif;
  cursor: default;
  transition: all 0.15s;
  z-index: 5;
}
.note-annotation:hover {
  background: var(--accent-border);
}
.note-annotation .note-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.note-annotation .note-header span:first-child {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-3);
}
.note-annotation .note-delete {
  font-size: 14px;
  color: var(--text-3);
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  line-height: 1;
}
.note-annotation .note-delete:hover { color: var(--error); }
.note-annotation .note-quoted {
  font-size: 11px;
  color: var(--text-2);
  font-style: italic;
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.note-annotation .note-body {
  font-size: 12px;
  color: var(--accent-dark);
  line-height: 1.4;
}
.note-annotation::before {
  content: '';
  position: absolute;
  left: -20px;
  top: 14px;
  width: 20px;
  height: 1px;
  background: var(--accent-border);
}

/* Note input box */
#noteInputBox {
  display: none;
  position: absolute;
  z-index: 60;
  animation: fadeIn 0.12s ease-out;
}
</style>
</head>
<body>

<!-- Left sidebar (session list) -->
<aside id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon"><span class="material-symbols-outlined" style="font-size:18px;">school</span></div>
    <span class="sidebar-logo-text">OpenAILearning</span>
  </div>
  <button class="new-session-btn" onclick="window.location.href='index.html'">
    <span class="material-symbols-outlined" style="font-size:16px;">add</span>
    新对话
  </button>
  <div style="flex:1;overflow-y:auto;" id="session-list"></div>
</aside>

<!-- Top Nav -->
<nav id="topNav">
  <div class="topnav-left">
    <span class="topnav-title" id="lessonTitle">课程</span>
    <span id="topNavSkillPill" class="topnav-skill-pill" style="display:none;">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;"></span>
      <span id="topNavSkillName"></span>
    </span>
  </div>
  <div class="topnav-actions">
    <button id="navStopBtn" onclick="stopLesson()" class="topnav-ghost-btn" style="display:none;">
      <span class="material-symbols-outlined" style="font-size:15px;">stop_circle</span>停止
    </button>
    <button id="navRegenBtn" onclick="retryLesson()" class="topnav-ghost-btn" style="display:none;">
      <span class="material-symbols-outlined" style="font-size:15px;">refresh</span>重试
    </button>
    <button id="navSlidesBtn" onclick="goToSlides()" class="topnav-ghost-btn" style="display:none;">
      <span class="material-symbols-outlined" style="font-size:15px;">slideshow</span>转为 PPT
    </button>
    <a id="backLink" href="index.html" class="topnav-ghost-btn">
      <span class="material-symbols-outlined" style="font-size:15px;">close</span>
    </a>
  </div>
</nav>

<!-- Step Nav -->
<div id="stepNav">
  <div class="step-item done"><span class="step-num">✓</span>话题</div>
  <span class="step-sep">›</span>
  <div class="step-item done"><span class="step-num">✓</span>知识图谱</div>
  <span class="step-sep">›</span>
  <div class="step-item done"><span class="step-num">✓</span>诊断</div>
  <span class="step-sep">›</span>
  <div class="step-item active"><span class="step-num">4</span>课程</div>
</div>

<!-- Three-column main content -->
<div id="mainContent">

  <!-- TOC Column -->
  <div id="tocPanel">
    <div class="toc-header">目录</div>
    <nav id="tocList"></nav>
    <div id="weakPointBox" class="toc-weak-box" style="display:none;">
      <div class="toc-weak-label">📌 薄弱点</div>
      <div id="weakPointList" class="toc-weak-item"></div>
    </div>
  </div>

  <!-- Main Document Column -->
  <div id="docPanel">
    <div id="lessonContent">
    </div>
    <div id="lessonNav" style="display:none;padding-top:16px;border-top:1px solid var(--border);margin-top:32px;align-items:center;justify-content:flex-end;gap:12px;">
      <button class="lesson-slides-btn" id="slidesBtn" onclick="goToSlides()" style="display:none;">转为 PPT</button>
      <button class="lesson-finish-btn" id="finishLearningBtn" onclick="finishLearning()" style="display:none;">完成学习 →</button>
    </div>
  </div>

  <!-- Right Panel -->
  <div id="rightPanel">
    <div class="right-panel-section" id="knowledgeSkillsSection">
      <div class="ks-toggle-row">
        <span class="right-panel-title">💡 知识点技能</span>
        <button class="ks-toggle" id="ksToggleBtn" onclick="toggleKnowledgeSkills()"></button>
      </div>
      <div id="knowledgeSkillsPanel"></div>
    </div>
    <div class="right-panel-section">
      <span class="right-panel-title">📊 薄弱点图谱</span>
      <div id="lessonGraph"></div>
      <div class="graph-legend-row">
        <div class="graph-legend-item"><div class="graph-legend-dot" style="background:#FECACA;border:1px solid #DC2626;"></div>薄弱</div>
        <div class="graph-legend-item"><div class="graph-legend-dot" style="background:var(--accent);"></div>核心</div>
      </div>
    </div>
  </div>

</div><!-- /mainContent -->

<!-- Sticky bottom chat -->
<div id="lessonBottomBar">
  <input type="text" id="lessonChatInput" placeholder="有问题？输入提问…"
    onkeydown="if(event.key==='Enter') sendLessonChat()"/>
  <button class="lesson-send-btn" onclick="sendLessonChat()">
    <span class="material-symbols-outlined" style="font-size:18px;">arrow_upward</span>
  </button>
</div>

<script src="api.js?v=7"></script>
<script src="sidebar.js?v=2"></script>
<script>
(async function() {
  const sessionId = getSessionId();
  if (!sessionId) { window.location.href = '/'; return; }

  // Set exit link immediately
  document.getElementById('backLink').href = 'index.html?session_id=' + sessionId;

  // Update back link
  document.getElementById('backLink').href = 'index.html?session_id=' + sessionId + '&show=results';

  const forceRegen = new URLSearchParams(window.location.search).has('regen');
  let state = await getSessionState(sessionId);
  const topic = state.topic || '';
  let lessonContent = forceRegen ? null : state.lesson_content;

  // If no lesson yet, trigger background generation + poll
  if (!lessonContent) {
    const isRunning = state.lesson_task_status === 'running';

    document.getElementById('lessonContent').innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;" id="lessonLoading">
        <svg style="animation:spin 1s linear infinite;width:40px;height:40px;color:var(--accent);margin-bottom:20px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
          <circle style="opacity:.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path style="opacity:.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <p style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;">正在生成课程</p>
        <p style="font-size:13px;color:var(--text-3);" id="generationProgress">AI 正在根据诊断结果生成个性化教案…</p>
      </div>`;

    // Show stop button in nav during generation
    document.getElementById('navStopBtn').style.display = '';
    document.getElementById('navStopBtn').onclick = function() {
      cancelGeneration(sessionId, 'lesson').catch(function(){});
      window.location.href = 'index.html?session_id=' + sessionId;
    };

    // Trigger generation if not already running
    if (!isRunning) {
      try { await startGeneration(sessionId, 'lesson'); } catch(e) {}
    }

    // Poll until done
    await new Promise((resolve) => {
      pollStatus(sessionId, 'lesson',
        function onUpdate(s) {
          var el = document.getElementById('generationProgress');
          if (!el || !s.progress) return;
          if (s.progress === 'retrieving skills') {
            el.textContent = '正在检索教学技能...';
          } else if (s.progress && s.progress.indexOf('/') !== -1) {
            var parts = s.progress.split('/');
            el.textContent = '正在生成内容（' + parts[0] + '/' + parts[1] + ' 个知识点）...';
          } else {
            el.textContent = '正在生成教案...';
          }
        },
        async function onDone(s) {
          if (s.status === 'done') {
            state = await getSessionState(sessionId);
            lessonContent = state.lesson_content || '';
          } else if (s.status === 'error') {
            document.getElementById('lessonContent').innerHTML = `
              <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;">
                <span class="material-symbols-outlined" style="font-size:40px;color:var(--error);margin-bottom:16px;">error</span>
                <p style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px;">生成失败</p>
                <button onclick="window.location.reload()" style="font-size:13px;color:var(--accent);font-weight:600;background:none;border:none;cursor:pointer;">重试</button>
              </div>`;
          }
          resolve();
        },
        2000
      );
    });

    if (!lessonContent) return;
  }

  // Show Finish Learning button + regenerate
  document.getElementById('finishLearningBtn').style.display = '';
  document.getElementById('slidesBtn').style.display = '';
  document.getElementById('lessonNav').style.removeProperty('display');
  const bottomBar = document.getElementById('lessonBottomBar');
  if (bottomBar) bottomBar.style.display = 'flex';
  document.getElementById('navStopBtn').style.display = 'none';
  document.getElementById('navRegenBtn').style.display = '';
  document.getElementById('navSlidesBtn').style.display = '';
  document.getElementById('navRegenBtn').onclick = async function() {
    try { await cancelGeneration(sessionId, 'lesson'); } catch(e) {}
    window.location.href = 'lesson.html?session_id=' + sessionId + '&regen=1';
  };

  // Render lesson as plain text (LLM returns markdown-like text)
  const weakPoints = state.diagnosis_result?.breakdown?.filter(b => b.status === 'weak').map(b => b.name) || [];
  const weakDesc = weakPoints.map(n => '<strong style="color:var(--error);">' + escapeHtml(n) + '</strong>').join(' 和 ');

  // Show weak points in TOC panel
  if (weakPoints.length > 0) {
    document.getElementById('weakPointBox').style.display = '';
    document.getElementById('weakPointList').innerHTML = weakPoints.map(n => escapeHtml(n)).join('<br>');
  }

  // Update lesson title in top nav
  if (topic) {
    document.getElementById('lessonTitle').textContent = topic + ' · 课程';
  }

  // Build pedagogy skill card for header (collapsible)
  const skillName = state.active_skill_display_name || '';
  const skillLessonSection = state.active_skill_lesson_section || '';
  let pedagogyCardHtml = '';
  if (skillName) {
    pedagogyCardHtml = `<details class="pedagogy-skill-card">
      <summary>
        <span class="material-symbols-outlined" style="font-size:16px;color:var(--accent);">psychology</span>
        教学法：${escapeHtml(skillName)}
      </summary>
      <div class="pedagogy-skill-card-body">${skillLessonSection ? safeMarkdown(skillLessonSection) : ''}</div>
    </details>`;
    // Show skill pill in top nav
    const pill = document.getElementById('topNavSkillPill');
    if (pill) {
      pill.style.display = '';
      document.getElementById('topNavSkillName').textContent = skillName;
    }
  }

  const lessonContentEl = document.getElementById('lessonContent');
  lessonContentEl.innerHTML =
    '<div id="annotationMargin" style="position:absolute;top:0;right:-230px;width:210px;pointer-events:auto;"></div>' +
    '<div id="lessonHeader">' +
    '<div class="lesson-title">' + escapeHtml(topic) + '：薄弱知识点</div>' +
    '<div class="lesson-meta">' +
    '<span>个性化教案</span>' +
    (skillName ? '<span class="lesson-skill-tag">' + escapeHtml(skillName) + '</span>' : '') +
    '</div>' +
    '<p style="font-size:13px;color:var(--text-3);margin-bottom:16px;">本教案根据诊断结果生成，重点讲解 ' + (weakDesc || '相关知识点') + '。</p>' +
    pedagogyCardHtml +
    '</div>' +
    '<hr style="border:none;border-top:1px solid var(--border);margin:16px 0 20px;">' +
    '<div id="lessonSections"></div>';

  // Parse markdown to HTML
  const parsedHtml = DOMPurify.sanitize(marked.parse(lessonContent));

  document.getElementById('lessonSections').innerHTML =
    '<section class="lesson-section" id="section-1">' + parsedHtml + '</section>';

  // Inject knowledge point skill cards before each h2 heading
  const ks = state.knowledge_skills || {};
  if (Object.keys(ks).length > 0) {
    const sectionEl2 = document.getElementById('section-1');
    const h2s = sectionEl2.querySelectorAll('h2');
    h2s.forEach(function(h2) {
      const headingText = h2.textContent.trim();
      // Match heading to knowledge point name
      const matchedKey = Object.keys(ks).find(function(k) {
        return headingText.indexOf(k) !== -1 || k.indexOf(headingText) !== -1;
      });
      if (matchedKey) {
        const ksName = matchedKey;
        const ksContent = ks[matchedKey];
        const card = document.createElement('div');
        card.innerHTML =
          '<details class="inline-ks-card">' +
            '<summary>💡 知识点技能：' + escapeHtml(ksName) + '</summary>' +
            '<div class="inline-ks-card-body">' + safeMarkdown(ksContent) + '</div>' +
          '</details>';
        h2.parentNode.insertBefore(card, h2.nextSibling);
      }
    });
  }

  // --- KC skill cards (from state.kc_skills, independent of pedagogy knowledge_skills) ---
  const kcSkills = state.kc_skills || {};
  if (Object.keys(kcSkills).length > 0) {
    const sectionElKc = document.getElementById('section-1');
    const h2sKc = sectionElKc.querySelectorAll('h2');
    h2sKc.forEach(function(h2) {
      const headingText = h2.textContent.trim();
      const matchedKey = Object.keys(kcSkills).find(function(k) {
        return headingText.indexOf(k) !== -1 || k.indexOf(headingText) !== -1;
      });
      if (!matchedKey) return;
      const kc = kcSkills[matchedKey] || {};
      const card = document.createElement('div');
      card.innerHTML =
        '<details class="kc-skill-card">' +
          '<summary>📘 出题考察提示：' + escapeHtml(matchedKey) + '</summary>' +
          '<div class="kc-skill-card-body">' +
            '<p><strong>考察重点：</strong>' + escapeHtml(kc['考察重点'] || '') + '</p>' +
            '<p><strong>常见易错点：</strong>' + escapeHtml(kc['易错点'] || '') + '</p>' +
            '<p><strong>难度提示：</strong>' + escapeHtml(kc['难度提示'] || '') + '</p>' +
          '</div>' +
        '</details>';
      // Insert after any existing inline-ks-card that's already a sibling
      let insertAfter = h2;
      let next = h2.nextSibling;
      while (next && next.nodeType === 1 && next.querySelector && next.querySelector('.inline-ks-card')) {
        insertAfter = next;
        next = next.nextSibling;
      }
      insertAfter.parentNode.insertBefore(card, insertAfter.nextSibling);
    });
  }

  // Build TOC from rendered headings
  const sectionEl = document.getElementById('section-1');
  const headings = sectionEl.querySelectorAll('h2, h3, h4');
  let tocHtml = '';
  headings.forEach((h, i) => {
    const id = 'heading-' + i;
    h.id = id;
    const levelClass = h.tagName === 'H4' ? ' h4' : h.tagName === 'H3' ? ' h3' : '';
    tocHtml += '<div class="toc-item' + levelClass + '" data-section="' + id + '" onclick="document.getElementById(\'' + id + '\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">' +
      escapeHtml(h.textContent) + '</div>';
  });
  if (!tocHtml) {
    tocHtml = '<div class="toc-item active" data-section="section-1" onclick="document.getElementById(\'section-1\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">教案内容</div>';
  }
  document.getElementById('tocList').innerHTML = tocHtml;

  // Knowledge Skills sidebar (right panel)
  const ksToggleBtn = document.getElementById('ksToggleBtn');
  const knowledgeSkills = state.knowledge_skills;
  let ksEnabled = state.use_knowledge_skills !== false;

  if (knowledgeSkills && Object.keys(knowledgeSkills).length > 0) {
    document.getElementById('knowledgeSkillsPanel').innerHTML = Object.entries(knowledgeSkills).map(function(entry) {
      const name = entry[0], content = entry[1];
      return '<details class="ks-card">' +
        '<summary><span class="ks-card-dot"></span>' + escapeHtml(name) + '</summary>' +
        '<div class="ks-card-body">' + safeMarkdown(content) + '</div>' +
        '</details>';
    }).join('');
  }

  // Set initial toggle state
  if (ksToggleBtn) {
    ksToggleBtn.classList.toggle('on', ksEnabled);
  }

  // Toggle knowledge skills function (called by onclick on ksToggleBtn)
  window.toggleKnowledgeSkills = async function() {
    ksEnabled = !ksEnabled;
    const btn = document.getElementById('ksToggleBtn');
    if (btn) btn.classList.toggle('on', ksEnabled);
    try {
      await fetch('/api/chat/' + sessionId + '/toggle-knowledge-skills', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled: ksEnabled}),
      });
    } catch(err) { /* ignore */ }
  };

  // Top-level nav action stubs
  window.stopLesson = function() {
    cancelGeneration(sessionId, 'lesson').catch(function(){});
    window.location.href = 'index.html?session_id=' + sessionId;
  };
  window.retryLesson = async function() {
    try { await cancelGeneration(sessionId, 'lesson'); } catch(e) {}
    window.location.href = 'lesson.html?session_id=' + sessionId + '&regen=1';
  };
  window.goToSlides = function() {
    window.location.href = 'slides.html?session_id=' + sessionId;
  };
  window.finishLearning = function() {
    window.location.href = 'index.html?session_id=' + sessionId + '&show=lesson';
  };
  window.sendLessonChat = function() {
    const input = document.getElementById('lessonChatInput');
    if (!input || !input.value.trim()) return;
    // Chat with lesson context — placeholder for future implementation
    input.value = '';
  };

  // Graph sidebar — vis.js interactive graph
  const graphContainer = document.getElementById('lessonGraph');
  if (graphContainer && typeof vis !== 'undefined' && state.graph) {
    const allNodes = state.graph.nodes || [];
    const allEdges = state.graph.edges || [];
    const weakSet = new Set(weakPoints);

    const visNodes = new vis.DataSet(allNodes.map(n => {
      const isWeak = weakSet.has(n.name);
      const isCore = n.level === 'core';
      return {
        id: n.id,
        label: n.name,
        title: n.description || n.name,
        size: isCore ? 22 : 16,
        shape: 'dot',
        color: {
          background: isWeak ? '#FECACA' : (isCore ? '#CF6833' : '#F5D5BF'),
          border: isWeak ? '#DC2626' : (isCore ? '#9E4A2A' : '#CF6833'),
        },
        font: { color: '#1a1a1a', size: 11, face: 'Inter, sans-serif' },
        borderWidth: isWeak ? 3 : 2,
      };
    }));

    const visEdges = new vis.DataSet(allEdges.map(e => ({
      from: e.source, to: e.target,
      arrows: { to: { enabled: true, scaleFactor: 0.5 } },
      color: { color: '#c1c7d3' },
      width: 1.5,
      smooth: { type: 'continuous' },
    })));

    const network = new vis.Network(graphContainer, { nodes: visNodes, edges: visEdges }, {
      physics: { barnesHut: { gravitationalConstant: -1500, springLength: 100 }, stabilization: { iterations: 80 } },
      interaction: { hover: true, tooltipDelay: 200, zoomView: true, dragView: true, zoomSpeed: 0.3, minZoom: 0.3, maxZoom: 2.5 },
      layout: { improvedLayout: true },
    });
    network.on('stabilizationIterationsDone', function() { network.fit(); });
  }
})();

// Highlight active TOC item on scroll
(function() {
  const scrollEl = document.getElementById('docPanel');
  if (!scrollEl) return;

  scrollEl.addEventListener('scroll', function() {
    var active = null;

    // Check all headings with IDs
    var allHeadings = document.querySelectorAll('h2[id], h3[id], section[id]');
    allHeadings.forEach(function(h) {
      var rect = h.getBoundingClientRect();
      var containerRect = scrollEl.getBoundingClientRect();
      if (rect.top - containerRect.top < containerRect.height * 0.4) {
        active = h.id;
      }
    });

    document.querySelectorAll('#tocList .toc-item').forEach(function(item) {
      var section = item.getAttribute('data-section');
      if (section === active) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });
  });
})();
</script>


<!-- Selection Toolbar -->
<div id="selectionToolbar">
  <button id="noteBtn" style="display:flex;align-items:center;gap:6px;background:white;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.12);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--accent-dark);cursor:pointer;">
    <span class="material-symbols-outlined" style="font-size:14px;">edit_note</span>
    Note
  </button>
</div>

<!-- Note Input Box -->
<div id="noteInputBox">
  <div style="background:white;border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.12);border-radius:10px;padding:12px;width:240px;">
    <p style="font-size:10px;font-weight:700;color:var(--text-4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">添加笔记</p>
    <input type="text" id="noteInput" style="width:100%;background:var(--bg);border:1.5px solid var(--border-input);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;outline:none;" placeholder="输入笔记，按 Enter 保存…"/>
  </div>
</div>

<script>
(function() {
  const toolbar = document.getElementById('selectionToolbar');
  const noteBtn = document.getElementById('noteBtn');
  const noteInputBox = document.getElementById('noteInputBox');
  const noteInput = document.getElementById('noteInput');
  const lessonArea = document.getElementById('lessonContent');
  let savedRange = null;
  let savedText = '';

  // Show toolbar on text selection within lesson content
  lessonArea.addEventListener('mouseup', function(e) {
    setTimeout(function() {
      const sel = window.getSelection();
      const text = sel.toString().trim();

      if (text.length > 0 && lessonArea.contains(sel.anchorNode)) {
        savedRange = sel.getRangeAt(0).cloneRange();
        savedText = text;

        const rect = savedRange.getBoundingClientRect();
        const scrollEl = document.getElementById('docPanel');
        const scrollRect = scrollEl.getBoundingClientRect();

        toolbar.style.display = 'block';
        toolbar.style.top = (rect.bottom - scrollRect.top + scrollEl.scrollTop + 6) + 'px';
        toolbar.style.left = (rect.left - scrollRect.left + rect.width / 2 - 40) + 'px';

        // Position relative to scroll container
        if (!toolbar.parentElement || toolbar.parentElement !== scrollEl) {
          scrollEl.style.position = 'relative';
          scrollEl.appendChild(toolbar);
        }
      } else if (!toolbar.contains(e.target)) {
        toolbar.style.display = 'none';
      }
    }, 10);
  });

  // Hide toolbar when clicking outside
  document.addEventListener('mousedown', function(e) {
    if (!toolbar.contains(e.target) && !noteInputBox.contains(e.target)) {
      toolbar.style.display = 'none';
      noteInputBox.style.display = 'none';
    }
  });

  // Note button click — show input
  noteBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    toolbar.style.display = 'none';

    if (!savedRange) return;

    const rect = savedRange.getBoundingClientRect();
    const scrollEl = document.getElementById('docPanel');
    const scrollRect = scrollEl.getBoundingClientRect();

    noteInputBox.style.display = 'block';
    noteInputBox.style.top = (rect.bottom - scrollRect.top + scrollEl.scrollTop + 6) + 'px';
    noteInputBox.style.left = (rect.left - scrollRect.left) + 'px';

    if (!noteInputBox.parentElement || noteInputBox.parentElement !== scrollEl) {
      scrollEl.style.position = 'relative';
      scrollEl.appendChild(noteInputBox);
    }

    noteInput.value = '';
    noteInput.focus();
  });

  // Save note on Enter
  noteInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && noteInput.value.trim()) {
      e.preventDefault();
      const noteText = noteInput.value.trim();
      noteInputBox.style.display = 'none';

      if (!savedRange) return;

      const marginContainer = document.getElementById('annotationMargin');
      const contentWrapper = marginContainer.parentElement;
      let highlight = null;

      // Wrap selected text with highlight
      try {
        highlight = document.createElement('span');
        highlight.className = 'noted-text';
        highlight.dataset.noteId = 'note-' + Date.now();
        savedRange.surroundContents(highlight);
      } catch (err) {
        // Cross-element selection: wrap end node
        highlight = document.createElement('span');
        highlight.className = 'noted-text';
        highlight.dataset.noteId = 'note-' + Date.now();
        const endContainer = savedRange.endContainer;
        const textNode = endContainer.nodeType === 3 ? endContainer : endContainer.firstChild;
        if (textNode) {
          const wrapper = document.createElement('span');
          wrapper.className = 'noted-text';
          wrapper.dataset.noteId = highlight.dataset.noteId;
          textNode.parentNode.insertBefore(wrapper, textNode);
          wrapper.appendChild(textNode);
          highlight = wrapper;
        }
      }

      // Calculate position relative to content wrapper
      const highlightRect = highlight.getBoundingClientRect();
      const wrapperRect = contentWrapper.getBoundingClientRect();
      const scrollEl = document.getElementById('docPanel');
      const topPos = highlightRect.top - wrapperRect.top + scrollEl.scrollTop;

      // Create annotation card in margin
      const annotation = document.createElement('div');
      annotation.className = 'note-annotation';
      annotation.style.top = topPos + 'px';
      annotation.dataset.noteId = highlight.dataset.noteId;
      annotation.innerHTML =
        '<div class="note-header">' +
        '  <span>Note</span>' +
        '  <button class="note-delete material-symbols-outlined">close</button>' +
        '</div>' +
        '<div class="note-quoted">"' + escapeHtml(savedText.substring(0, 40)) + (savedText.length > 40 ? '...' : '') + '"</div>' +
        '<div class="note-body">' + escapeHtml(noteText) + '</div>';

      // Delete handler
      annotation.querySelector('.note-delete').addEventListener('click', function() {
        const noteId = annotation.dataset.noteId;
        const hl = document.querySelector('.noted-text[data-note-id="' + noteId + '"]');
        if (hl) {
          const parent = hl.parentNode;
          while (hl.firstChild) {
            parent.insertBefore(hl.firstChild, hl);
          }
          parent.removeChild(hl);
        }
        annotation.remove();
      });

      // Click highlight to scroll annotation into view
      highlight.addEventListener('click', function() {
        annotation.style.background = 'var(--accent-border)';
        setTimeout(function() { annotation.style.background = 'var(--accent-light)'; }, 800);
      });

      marginContainer.appendChild(annotation);

      // Clear selection
      window.getSelection().removeAllRanges();
      savedRange = null;
    }
  });

  // Escape to cancel note input
  noteInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      noteInputBox.style.display = 'none';
    }
  });

})();
</script>
</body>
</html>
