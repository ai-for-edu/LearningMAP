<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenAILearning - Lesson</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "secondary": "#3c692b",
          "error": "#ba1a1a",
          "on-surface-variant": "#414751",
          "surface-container-low": "#f2f4f6",
          "surface-container": "#eceef0",
          "primary": "#005da7",
          "surface": "#f7f9fb",
          "on-primary": "#ffffff",
          "on-surface": "#191c1e",
          "outline": "#717783",
          "primary-fixed": "#d4e3ff",
          "primary-container": "#2976c7",
          "surface-container-lowest": "#ffffff",
        },
        fontFamily: {
          "headline": ["Manrope"],
          "body": ["Inter"],
          "label": ["Inter"]
        },
      },
    },
  }
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .lesson-section { scroll-margin-top: 100px; }
  .nav-link { transition: all 0.15s ease-in-out; }
  .nav-link:hover, .nav-link.active { color: #005da7; border-left-color: #005da7; }

  /* Selection toolbar */
  #selectionToolbar {
    display: none;
    position: absolute;
    z-index: 60;
    animation: fadeIn 0.12s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Highlighted text with note */
  .noted-text {
    background-color: #d4e3ff;
    border-bottom: 2px solid #005da7;
    cursor: pointer;
    border-radius: 2px;
    position: relative;
  }
  .noted-text:hover { background-color: #a4c9ff; }

  /* Note annotation card in margin */
  .note-annotation {
    position: absolute;
    right: 0;
    width: 200px;
    background: #f0f6ff;
    border: 1px solid #d4e3ff;
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 12px;
    color: #005da7;
    font-family: 'Inter', sans-serif;
    cursor: default;
    transition: all 0.15s;
    z-index: 5;
  }
  .note-annotation:hover {
    background: #d4e3ff;
    border-color: #a4c9ff;
  }
  .note-annotation .note-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .note-annotation .note-header span:first-child {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #717783;
  }
  .note-annotation .note-delete {
    font-size: 14px;
    color: #717783;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    line-height: 1;
  }
  .note-annotation .note-delete:hover { color: #ba1a1a; }
  .note-annotation .note-quoted {
    font-size: 11px;
    color: #414751;
    font-style: italic;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .note-annotation .note-body {
    font-size: 12px;
    color: #005da7;
    line-height: 1.4;
  }
  /* Connector line from highlight to annotation */
  .note-annotation::before {
    content: '';
    position: absolute;
    left: -20px;
    top: 14px;
    width: 20px;
    height: 1px;
    background: #d4e3ff;
  }

  /* Note input box */
  #noteInputBox {
    display: none;
    position: absolute;
    z-index: 60;
    animation: fadeIn 0.12s ease-out;
  }

  /* Outline sidebar */
  #outlineSidebar {
    transition: all 0.3s ease;
  }
  #outlineSidebar.collapsed {
    margin-left: -240px;
  }
  .outline-item {
    transition: all 0.15s;
    border-left: 2px solid transparent;
  }
  .outline-item:hover {
    color: #005da7;
    border-left-color: #005da7;
    background-color: #f2f4f6;
  }
  .outline-item.active {
    color: #005da7;
    border-left-color: #005da7;
    font-weight: 600;
  }
  .outline-item.sub {
    padding-left: 28px;
    font-size: 12px;
  }
</style>
</head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-fixed">

<!-- Top Navigation Bar -->
<nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 flex justify-between items-center px-6 py-3">
  <div class="flex items-center gap-4">
    <span class="text-xl font-extrabold tracking-tighter text-blue-800">OpenAILearning</span>
    <span class="text-slate-300">|</span>
    <span class="font-headline font-bold text-sm text-on-surface-variant">Lesson Mode</span>
  </div>
  <a href="results.html" class="flex items-center gap-1 text-sm text-slate-500 hover:text-primary transition-colors">
    <span class="material-symbols-outlined text-lg">arrow_back</span>
    <span class="font-label font-medium">Back to Chat</span>
  </a>
</nav>

<!-- Main Split Layout -->
<main class="pt-[70px] min-h-screen flex">

  <!-- Left: Outline Sidebar -->
  <div id="outlineSidebar" class="w-[240px] border-r border-slate-100 bg-white flex flex-col relative" style="height: calc(100vh - 70px); position: sticky; top: 70px; flex-shrink: 0;">
    <div class="p-5 border-b border-slate-100">
      <p class="font-headline font-bold text-xs text-on-surface-variant uppercase tracking-widest">Outline</p>
    </div>
    <div class="flex-grow overflow-y-auto py-3" id="outlineList"></div>
    <!-- Collapse handle -->
    <button onclick="toggleOutline()" class="absolute top-1/2 -translate-y-1/2 -right-4 w-8 h-16 bg-white border border-slate-200 rounded-r-lg flex items-center justify-center shadow-sm hover:bg-slate-50 transition-colors z-50">
      <span class="material-symbols-outlined text-sm text-slate-400" id="outlineCollapseIcon">chevron_left</span>
    </button>
  </div>

  <!-- Center: Lesson Content -->
  <div class="flex-1 overflow-y-auto px-10 py-10" style="max-height: calc(100vh - 70px);" id="lessonScroll">
    <div class="relative mx-auto" style="max-width: 680px; margin-right: 240px; margin-left: auto;">
      <!-- Annotation margin zone (right side) -->
      <div id="annotationMargin" style="position: absolute; top: 0; right: -230px; width: 210px; pointer-events: auto;"></div>

      <div id="lessonHeader"></div>
      <div id="lessonSections"></div>

      <!-- Finish Button -->
      <div class="text-center py-10">
        <a href="index.html" class="inline-flex items-center gap-2 bg-secondary text-white py-4 px-10 rounded-2xl font-headline font-bold text-sm shadow-md hover:shadow-lg transition-all">
          <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          Finish Learning
        </a>
      </div>

    </div>
  </div>

  <!-- Right: Knowledge Graph Sidebar -->
  <div class="w-[340px] border-l border-slate-100 bg-white flex flex-col" style="height: calc(100vh - 70px); position: sticky; top: 70px;">
    <div class="p-6 border-b border-slate-100">
      <p class="font-headline font-bold text-xs text-on-surface-variant uppercase tracking-widest">Knowledge Map</p>
      <p class="font-body text-xs text-on-surface-variant mt-1">薄弱知识点高亮</p>
    </div>
    <div class="flex-grow flex items-center justify-center p-6 relative" id="lessonGraph"></div>
    <div class="p-6 border-t border-slate-100">
      <p class="font-headline font-bold text-xs text-on-surface-variant uppercase tracking-widest mb-3">学习进度</p>
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <span class="font-body text-xs text-on-surface-variant" id="lessonProgressLabel"></span>
          <span class="font-label text-xs font-semibold text-on-surface-variant" id="lessonProgressNum">第 1/1 节</span>
        </div>
        <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
          <div class="h-full bg-primary rounded-full" style="width: 0%" id="lessonProgressBar"></div>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="session-data.js"></script>
<script>
(function() {
  const data = getSessionData();
  const L = data.lesson;
  const name = getCurrentSessionName();

  // Header
  document.getElementById('lessonHeader').innerHTML =
    '<div class="mb-10"><p class="font-headline text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2">个性化教案</p>' +
    '<h1 class="font-headline text-3xl font-extrabold text-on-surface tracking-tight mb-3">' + L.title + '</h1>' +
    '<p class="font-body text-on-surface-variant leading-relaxed">' + L.desc + '</p></div><hr class="border-slate-100 mb-10"/>';

  // Sections
  document.getElementById('lessonSections').innerHTML = L.sections.map(function(s, i) {
    var sep = i < L.sections.length - 1 ? '<hr class="border-slate-100 mb-10"/>' : '';
    return '<section class="lesson-section mb-12" id="' + s.id + '">' +
      '<div class="flex items-center gap-2 mb-6"><span class="w-3 h-3 rounded-full bg-error"></span>' +
      '<h2 class="font-headline text-xl font-bold text-on-surface">' + s.name + '</h2></div>' +
      '<div class="space-y-5 font-body text-on-surface leading-relaxed">' + s.content + '</div></section>' + sep;
  }).join('');

  // Graph sidebar
  var graphHtml = '<svg class="absolute inset-0 w-full h-full pointer-events-none opacity-15" xmlns="http://www.w3.org/2000/svg"><line stroke="#ba1a1a" stroke-width="1.5" x1="50%" x2="65%" y1="45%" y2="25%"/><line stroke="#ba1a1a" stroke-width="1.5" x1="50%" x2="35%" y1="45%" y2="70%"/></svg>';
  graphHtml += '<div class="relative z-10 w-full h-full"><div class="absolute top-[40%] left-1/2 -translate-x-1/2 text-center"><span class="font-headline font-extrabold text-xs tracking-widest text-slate-300">' + name + '</span></div>';
  L.graphNodes.forEach(function(n) {
    graphHtml += '<div class="absolute ' + n.pos + '"><a href="#' + n.id + '" class="flex items-center gap-1.5 group"><span class="w-3 h-3 rounded-full bg-error ring-4 ring-error/20 group-hover:ring-error/40 transition-all"></span><span class="font-headline font-bold text-xs tracking-wider text-error">' + n.name + '</span></a></div>';
  });
  graphHtml += '</div>';
  document.getElementById('lessonGraph').innerHTML = graphHtml;

  // Progress label
  var sectionNames = L.sections.map(function(s) { return s.name; }).join(' / ');
  document.getElementById('lessonProgressLabel').textContent = sectionNames;
  document.getElementById('lessonProgressNum').textContent = '第 1/' + L.sections.length + ' 节';

  // Build outline from rendered sections
  var outlineHtml = '';
  L.sections.forEach(function(s) {
    // Section heading (h2 level)
    outlineHtml += '<a href="#' + s.id + '" class="outline-item block px-5 py-2 text-sm text-on-surface-variant font-headline font-semibold rounded-r-lg" data-section="' + s.id + '">' +
      '<span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-error flex-shrink-0"></span>' + s.name + '</span></a>';

    // Extract h3 sub-headings from content
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = s.content;
    var h3s = tempDiv.querySelectorAll('h3');
    h3s.forEach(function(h3, idx) {
      var subId = s.id + '-sub-' + idx;
      // Find actual h3 in rendered DOM and add id
      var renderedSection = document.getElementById(s.id);
      if (renderedSection) {
        var renderedH3s = renderedSection.querySelectorAll('h3');
        if (renderedH3s[idx]) {
          renderedH3s[idx].id = subId;
        }
      }
      outlineHtml += '<a href="#' + subId + '" class="outline-item sub block px-5 py-1.5 text-on-surface-variant font-body rounded-r-lg">' + h3.textContent + '</a>';
    });
  });
  document.getElementById('outlineList').innerHTML = outlineHtml;

  // Smooth scroll for outline links
  document.querySelectorAll('#outlineList a').forEach(function(link) {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      var target = document.querySelector(this.getAttribute('href'));
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });
})();

// Outline toggle
let outlineOpen = true;
function toggleOutline() {
  outlineOpen = !outlineOpen;
  const sidebar = document.getElementById('outlineSidebar');
  const icon = document.getElementById('outlineCollapseIcon');
  if (outlineOpen) {
    sidebar.classList.remove('collapsed');
    icon.textContent = 'chevron_left';
  } else {
    sidebar.classList.add('collapsed');
    icon.textContent = 'chevron_right';
  }
}

// Highlight active outline item on scroll
(function() {
  const scrollEl = document.getElementById('lessonScroll');
  const outlineLinks = document.querySelectorAll('#outlineList a');

  scrollEl.addEventListener('scroll', function() {
    var scrollTop = scrollEl.scrollTop;
    var active = null;

    // Check all headings with IDs
    var allHeadings = scrollEl.querySelectorAll('h2[id], h3[id], section[id]');
    allHeadings.forEach(function(h) {
      var rect = h.getBoundingClientRect();
      var containerRect = scrollEl.getBoundingClientRect();
      if (rect.top - containerRect.top < containerRect.height * 0.4) {
        active = h.id;
      }
    });

    outlineLinks.forEach(function(link) {
      var href = link.getAttribute('href');
      if (href === '#' + active) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
  });
})();
</script>

<script>
const scrollContainer = document.getElementById('lessonScroll');
const sections = document.querySelectorAll('.lesson-section');
const progressBar = document.getElementById('lessonProgressBar');
const progressLabel = document.getElementById('lessonProgressNum');

scrollContainer.addEventListener('scroll', updateProgress);
window.addEventListener('load', updateProgress);

function updateProgress() {
  const scrollTop = scrollContainer.scrollTop;
  const scrollHeight = scrollContainer.scrollHeight - scrollContainer.clientHeight;

  if (scrollHeight <= 0) return;

  const percent = Math.min(Math.round((scrollTop / scrollHeight) * 100), 100);
  progressBar.style.width = percent + '%';

  // Determine which section is in view
  let currentSection = 0;
  sections.forEach((section, i) => {
    const rect = section.getBoundingClientRect();
    const containerRect = scrollContainer.getBoundingClientRect();
    if (rect.top - containerRect.top < containerRect.height * 0.5) {
      currentSection = i;
    }
  });

  progressLabel.textContent = '第 ' + (currentSection + 1) + '/' + sections.length + ' 节';
}
</script>

<!-- Selection Toolbar -->
<div id="selectionToolbar">
  <button id="noteBtn" class="flex items-center gap-1.5 bg-white border border-slate-200 shadow-lg rounded-xl px-3 py-2 text-xs font-headline font-bold text-primary hover:bg-primary-fixed transition-colors">
    <span class="material-symbols-outlined text-sm">edit_note</span>
    Note
  </button>
</div>

<!-- Note Input Box -->
<div id="noteInputBox">
  <div class="bg-white border border-slate-200 shadow-xl rounded-2xl p-3 w-64">
    <p class="font-headline font-bold text-xs text-on-surface-variant mb-2 uppercase tracking-widest">Add Note</p>
    <input type="text" id="noteInput" class="w-full bg-surface-container-low border border-slate-200 rounded-lg px-3 py-2 text-sm font-body text-on-surface focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none" placeholder="Type your note, press Enter..."/>
  </div>
</div>

<script>
(function() {
  const toolbar = document.getElementById('selectionToolbar');
  const noteBtn = document.getElementById('noteBtn');
  const noteInputBox = document.getElementById('noteInputBox');
  const noteInput = document.getElementById('noteInput');
  const lessonArea = document.getElementById('lessonSections');
  let savedRange = null;
  let savedText = '';

  // Show toolbar on text selection within lesson content
  lessonArea.addEventListener('mouseup', function(e) {
    setTimeout(function() {
      const sel = window.getSelection();
      const text = sel.toString().trim();

      if (text.length > 0 && lessonArea.contains(sel.anchorNode)) {
        savedRange = sel.getRangeAt(0).cloneRange();
        savedText = text;

        const rect = savedRange.getBoundingClientRect();
        const scrollEl = lessonArea.closest('.overflow-y-auto');
        const scrollRect = scrollEl.getBoundingClientRect();

        toolbar.style.display = 'block';
        toolbar.style.top = (rect.bottom - scrollRect.top + scrollEl.scrollTop + 6) + 'px';
        toolbar.style.left = (rect.left - scrollRect.left + rect.width / 2 - 40) + 'px';

        // Position relative to scroll container
        if (!toolbar.parentElement || toolbar.parentElement !== scrollEl) {
          scrollEl.style.position = 'relative';
          scrollEl.appendChild(toolbar);
        }
      } else if (!toolbar.contains(e.target)) {
        toolbar.style.display = 'none';
      }
    }, 10);
  });

  // Hide toolbar when clicking outside
  document.addEventListener('mousedown', function(e) {
    if (!toolbar.contains(e.target) && !noteInputBox.contains(e.target)) {
      toolbar.style.display = 'none';
      noteInputBox.style.display = 'none';
    }
  });

  // Note button click — show input
  noteBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    toolbar.style.display = 'none';

    if (!savedRange) return;

    const rect = savedRange.getBoundingClientRect();
    const scrollEl = lessonArea.closest('.overflow-y-auto');
    const scrollRect = scrollEl.getBoundingClientRect();

    noteInputBox.style.display = 'block';
    noteInputBox.style.top = (rect.bottom - scrollRect.top + scrollEl.scrollTop + 6) + 'px';
    noteInputBox.style.left = (rect.left - scrollRect.left) + 'px';

    if (!noteInputBox.parentElement || noteInputBox.parentElement !== scrollEl) {
      scrollEl.style.position = 'relative';
      scrollEl.appendChild(noteInputBox);
    }

    noteInput.value = '';
    noteInput.focus();
  });

  // Save note on Enter
  noteInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && noteInput.value.trim()) {
      e.preventDefault();
      const noteText = noteInput.value.trim();
      noteInputBox.style.display = 'none';

      if (!savedRange) return;

      const marginContainer = document.getElementById('annotationMargin');
      const contentWrapper = marginContainer.parentElement;
      let highlight = null;

      // Wrap selected text with highlight
      try {
        highlight = document.createElement('span');
        highlight.className = 'noted-text';
        highlight.dataset.noteId = 'note-' + Date.now();
        savedRange.surroundContents(highlight);
      } catch (err) {
        // Cross-element selection: wrap end node
        highlight = document.createElement('span');
        highlight.className = 'noted-text';
        highlight.dataset.noteId = 'note-' + Date.now();
        const endContainer = savedRange.endContainer;
        const textNode = endContainer.nodeType === 3 ? endContainer : endContainer.firstChild;
        if (textNode) {
          const wrapper = document.createElement('span');
          wrapper.className = 'noted-text';
          wrapper.dataset.noteId = highlight.dataset.noteId;
          textNode.parentNode.insertBefore(wrapper, textNode);
          wrapper.appendChild(textNode);
          highlight = wrapper;
        }
      }

      // Calculate position relative to content wrapper
      const highlightRect = highlight.getBoundingClientRect();
      const wrapperRect = contentWrapper.getBoundingClientRect();
      const scrollEl = document.getElementById('lessonScroll');
      const topPos = highlightRect.top - wrapperRect.top + scrollEl.scrollTop;

      // Create annotation card in margin
      const annotation = document.createElement('div');
      annotation.className = 'note-annotation';
      annotation.style.top = topPos + 'px';
      annotation.dataset.noteId = highlight.dataset.noteId;
      annotation.innerHTML =
        '<div class="note-header">' +
        '  <span>Note</span>' +
        '  <button class="note-delete material-symbols-outlined">close</button>' +
        '</div>' +
        '<div class="note-quoted">"' + escapeHtml(savedText.substring(0, 40)) + (savedText.length > 40 ? '...' : '') + '"</div>' +
        '<div class="note-body">' + escapeHtml(noteText) + '</div>';

      // Delete handler
      annotation.querySelector('.note-delete').addEventListener('click', function() {
        const noteId = annotation.dataset.noteId;
        const hl = document.querySelector('.noted-text[data-note-id="' + noteId + '"]');
        if (hl) {
          const parent = hl.parentNode;
          while (hl.firstChild) {
            parent.insertBefore(hl.firstChild, hl);
          }
          parent.removeChild(hl);
        }
        annotation.remove();
      });

      // Click highlight to scroll annotation into view
      highlight.addEventListener('click', function() {
        annotation.style.background = '#d4e3ff';
        setTimeout(function() { annotation.style.background = '#f0f6ff'; }, 800);
      });

      marginContainer.appendChild(annotation);

      // Clear selection
      window.getSelection().removeAllRanges();
      savedRange = null;
    }
  });

  // Escape to cancel note input
  noteInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      noteInputBox.style.display = 'none';
    }
  });

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
})();
</script>
</body>
</html>
