<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenAILearning - Scholar Minimal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'] },
    },
  },
}
</script>
<style>
:root {
  --bg: #FAF9F7;
  --bg-sidebar: #F0EDE8;
  --border: #EAE6E0;
  --border-input: #E0DDD8;
  --accent: #CF6833;
  --accent-light: #FFF3EC;
  --accent-border: #F5D5BF;
  --accent-dark: #9E4A2A;
  --text: #1a1a1a;
  --text-2: #4a4a4a;
  --text-3: #888;
  --text-4: #B0A898;
  --user-bubble: #EDE9E3;
  --error: #DC2626;
  --success: #059669;
}
* { box-sizing: border-box; }
body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); margin: 0; }

/* ── Sidebar ── */
#sidebar {
  width: 210px; height: 100vh; position: fixed; left: 0; top: 0;
  background: var(--bg-sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 16px 12px; gap: 4px;
  z-index: 40; transition: width 0.2s;
}
#sidebar.collapsed { width: 0; padding: 0; overflow: hidden; }
.sidebar-logo { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin-bottom: 8px; }
.sidebar-logo-icon {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 15px; font-weight: 800;
}
.sidebar-logo-text { font-size: 14px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
.new-session-btn {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border: 1.5px dashed #D4CFC8; border-radius: 8px; background: transparent;
  font-size: 13px; font-weight: 500; color: var(--text-3); cursor: pointer;
  margin-bottom: 12px; transition: all .15s; width: 100%;
}
.new-session-btn:hover { background: white; border-color: #bbb; }
.sidebar-section-label {
  font-size: 10px; font-weight: 600; color: var(--text-4);
  letter-spacing: .06em; text-transform: uppercase;
  padding: 0 8px; margin: 8px 0 4px;
}
.session-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-radius: 7px; font-size: 13px; color: var(--text-3); cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .1s;
}
.session-item:hover { background: #E8E4DE; }
.session-item.active {
  background: white; color: var(--text); font-weight: 500;
  box-shadow: 0 1px 3px rgba(0,0,0,.07);
}
.session-dot { width: 6px; height: 6px; border-radius: 50%; background: #D4CFC8; flex-shrink: 0; }
.session-dot.orange { background: var(--accent); }
.sidebar-status-tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--accent-light); border: 1px solid var(--accent-border);
  color: var(--accent-dark); font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 99px; margin-left: auto; flex-shrink: 0;
}

/* ── Top Nav ── */
#topNav {
  height: 50px; position: fixed; top: 0; left: 210px; right: 0; z-index: 30;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  transition: left 0.2s;
}
#sidebar.collapsed ~ #topNav { left: 0; }
.topnav-left { display: flex; align-items: center; gap: 8px; }
.topnav-title { font-size: 14px; font-weight: 600; color: var(--text); }
.topnav-skill-pill {
  display: flex; align-items: center; gap: 5px;
  background: var(--accent-light); border: 1px solid var(--accent-border);
  color: var(--accent-dark); font-size: 11px; font-weight: 600;
  padding: 4px 10px; border-radius: 99px; cursor: pointer;
}
.topnav-skill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* ── Main Content ── */
#mainContent {
  margin-left: 210px; padding-top: 50px; min-height: 100vh;
  display: flex; flex-direction: column; transition: margin-left 0.2s;
}
#sidebar.collapsed ~ #mainContent { margin-left: 0; }

/* ── Chat Area ── */
#chatArea { flex: 1; padding: 24px 32px 120px; display: flex; flex-direction: column; gap: 20px; max-width: 760px; width: 100%; margin: 0 auto; }
.user-msg { display: flex; justify-content: flex-end; }
.user-bubble {
  background: var(--user-bubble); border-radius: 18px 18px 4px 18px;
  padding: 10px 16px; max-width: 70%; font-size: 13.5px; color: var(--text-2); line-height: 1.55;
}
.ai-msg { display: flex; gap: 12px; }
.ai-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 13px; font-weight: 700;
}
.ai-content { flex: 1; }
.ai-name { font-size: 11px; font-weight: 600; color: var(--text-4); margin-bottom: 5px; letter-spacing: .03em; text-transform: uppercase; }
.ai-text { font-size: 13.5px; color: var(--text-2); line-height: 1.65; }
.ai-text strong { color: var(--text); font-weight: 600; }

/* Knowledge graph card */
.kg-card { background: white; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-top: 8px; }
.kg-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.kg-title { font-size: 13px; font-weight: 600; color: var(--text); }
.kg-badge { font-size: 11px; color: var(--accent); background: var(--accent-light); padding: 2px 8px; border-radius: 99px; font-weight: 600; border: 1px solid var(--accent-border); }
.kg-footer { padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
.kg-legend { display: flex; gap: 12px; }
.kg-legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-3); }
.kg-legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.kg-start-btn {
  background: var(--accent); color: white;
  font-size: 12px; font-weight: 600; padding: 6px 16px;
  border-radius: 99px; border: none; cursor: pointer; transition: background .15s;
}
.kg-start-btn:hover { background: var(--accent-dark); }

/* ── Input Bar ── */
#bottomBar {
  position: fixed; bottom: 0; left: 210px; right: 0; z-index: 30;
  padding: 12px 20px 16px; background: var(--bg);
  border-top: 1px solid var(--border); transition: left 0.2s;
}
#sidebar.collapsed ~ #bottomBar { left: 0; }
.input-outer { max-width: 720px; margin: 0 auto; position: relative; }
.input-wrap {
  background: white; border: 1.5px solid var(--border-input); border-radius: 14px;
  padding: 10px 14px; display: flex; align-items: flex-end; gap: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}
.input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(207,104,51,.1); }
#chatInput {
  flex: 1; font-size: 13px; color: var(--text); font-family: 'Inter', sans-serif;
  border: none; outline: none; resize: none; background: transparent; min-height: 34px; max-height: 160px;
}
#chatInput::placeholder { color: var(--text-4); }
.send-btn {
  width: 34px; height: 34px; background: var(--accent); border-radius: 10px; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; color: white; transition: background .15s;
}
.send-btn:hover { background: var(--accent-dark); }
.hint-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; max-width: 720px; margin-left: auto; margin-right: auto; }

/* ── Skill popup ── */
.skill-popup {
  position: absolute; bottom: 100%; left: 0; right: 0; margin-bottom: 8px;
  max-height: 360px; overflow-y: auto; background: white;
  border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,.1); z-index: 200;
}
.skill-item { padding: 12px 16px; display: flex; align-items: flex-start; gap: 10px; }
.skill-item:hover { background: #F7F5F2; }
.skill-item:not(:last-child) { border-bottom: 1px solid var(--border); }
.skill-item-main { flex: 1; cursor: pointer; }
.skill-item-actions { display: flex; gap: 2px; flex-shrink: 0; padding-top: 2px; }
.skill-action-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: none; background: transparent; cursor: pointer; color: var(--text-4); transition: all .15s; }
.skill-action-btn:hover { background: var(--border); color: var(--text-3); }

/* ── Skill modal ── */
.skill-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; z-index: 300; }
.skill-modal { background: white; border-radius: 14px; padding: 0; max-width: 560px; width: 90%; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.skill-modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.skill-modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; color: var(--text-2); }

/* ── Prose / Markdown ── */
.prose h3 { font-weight: 700; margin: 1rem 0 0.5rem; color: var(--text); }
.prose p { margin: 0.5rem 0; }
.prose ul, .prose ol { padding-left: 1.5rem; margin: 0.5rem 0; }
.prose li { margin: 0.25rem 0; }
.prose strong { color: var(--text); }
.prose code { background: var(--bg-sidebar); padding: .1rem .35rem; border-radius: .25rem; font-size: .85em; }
.prose blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; color: var(--text-3); margin: .5rem 0; }

/* ── Message actions ── */
.msg-actions { display: flex; gap: 4px; margin-top: 6px; opacity: 0; transition: opacity .15s; }
.msg-wrapper:hover .msg-actions { opacity: 1; }
.msg-action { border: none; background: transparent; cursor: pointer; padding: 4px; color: var(--text-4); transition: color .15s; }
.msg-action:hover { color: var(--text-3); }

/* ── Streaming cursor ── */
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.stream-cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); margin-left: 2px; vertical-align: text-bottom; animation: blink .8s step-end infinite; }

/* ── Sidebar collapse button ── */
#collapseBtn {
  position: absolute; top: 50%; transform: translateY(-50%); right: -12px;
  width: 24px; height: 48px; background: white; border: 1px solid var(--border);
  border-radius: 0 6px 6px 0; display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 50; box-shadow: 1px 0 4px rgba(0,0,0,.06);
}
#collapseBtn:hover { background: var(--bg-sidebar); }

/* ── no-scrollbar ── */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

/* ── Skill badge ── */
.skill-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-light); border: 1px solid var(--accent-border); color: var(--accent-dark); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; cursor: pointer; transition: background .15s; }
.skill-badge:hover { background: var(--accent-border); }

/* ── Hint chips ── */
.hint-chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--border); background: white; font-size: 12px; color: var(--text-3); cursor: pointer; transition: all .15s; white-space: nowrap; }
.hint-chip:hover { background: var(--bg-sidebar); border-color: var(--accent-border); color: var(--text-2); }
</style>
</head>
<body>
<nav id="topNav">
  <div class="topnav-left">
    <span class="topnav-title" id="topNavTitle">EduAI</span>
    <span id="topNavSkillPill" class="topnav-skill-pill" style="display:none;" onclick="showSkillModal(_activeSkillInfo?.name)">
      <span class="topnav-skill-dot"></span>
      <span id="topNavSkillName"></span>
    </span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;" id="topNavActions"></div>
</nav>
<aside id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">E</div>
    <span class="sidebar-logo-text">EduAI</span>
  </div>
  <button class="new-session-btn" onclick="createNewSession()">
    <span class="material-symbols-outlined" style="font-size:16px;">add</span>
    新对话
  </button>
  <div style="flex:1;overflow-y:auto;" id="session-list"></div>
  <button onclick="toggleSidebar()" id="collapseBtn">
    <span class="material-symbols-outlined" style="font-size:14px;color:var(--text-4);" id="collapseIcon">chevron_left</span>
  </button>
</aside>
<script src="sidebar.js?v=2"></script>
<script src="api.js?v=6"></script>
<main id="mainContent">
  <div id="chatArea">
    <div id="chatHistory"></div>
  </div>
</main>
<div id="bottomBar">
  <div class="input-outer">
    <div class="input-wrap">
      <textarea id="chatInput" onkeydown="handleInputKeydown(event)" oninput="handleInputChange(event)" rows="1"
        placeholder="输入学习主题，或 /skill 选择教学方法…"></textarea>
      <div id="skillPopup" class="skill-popup" style="display:none;"></div>
      <button class="send-btn" onclick="handleSend()">
        <span class="material-symbols-outlined" style="font-size:18px;">arrow_upward</span>
      </button>
    </div>
  </div>
  <div class="hint-row no-scrollbar" id="suggestBtns"></div>
</div>
<script>
let currentSessionId = getSessionId();
let messageCount = 0;
let _cachedSkills = null;
let _activeSkillInfo = null; // {name, display_name, body, current_section}
let _knowledgeSkills = null; // {knowledge_point_name: skill_text}

// Input handler: detect /skill and show popup
function handleInputKeydown(e) {
  const popup = document.getElementById('skillPopup');
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (popup.style.display !== 'none') return;
    handleSend();
  } else if (e.key === 'Escape') {
    popup.style.display = 'none';
  }
  // Auto-resize textarea
  requestAnimationFrame(() => {
    const el = e.target;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  });
}

async function handleInputChange(e) {
  // Auto-resize textarea
  const el = e.target;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';

  const val = e.target.value;
  const popup = document.getElementById('skillPopup');

  if (val.trim() === '/skill' || val.trim() === '/skill ') {
    if (!_cachedSkills) _cachedSkills = await fetchSkills();
    if (_cachedSkills.length === 0) {
      popup.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--text-3);">暂无可用的教学方法</div>';
    } else {
      popup.innerHTML = _cachedSkills.map((s, i) => `
        <div class="skill-item">
          <div class="skill-item-main" data-skill-idx="${i}">
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="material-symbols-outlined" style="color:var(--accent);font-size:16px;">psychology</span>
              <span style="font-size:13px;font-weight:700;color:var(--text);">${escapeHtml(s.display_name)}</span>
            </div>
            <p style="font-size:11px;color:var(--text-3);margin-top:4px;">${escapeHtml(s.description)}</p>
          </div>
          <div class="skill-item-actions">
            <button class="skill-action-btn" data-info-idx="${i}" title="查看详情">
              <span class="material-symbols-outlined" style="font-size:16px;">info</span>
            </button>
            <button class="skill-action-btn" data-delete-idx="${i}" title="删除">
              <span class="material-symbols-outlined" style="font-size:16px;">delete</span>
            </button>
          </div>
        </div>
      `).join('') + `
        <div class="skill-item" style="border-top:1px solid var(--border);">
          <div class="skill-item-main" data-clear-skill="1">
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="material-symbols-outlined" style="font-size:16px;color:var(--text-4);">close</span>
              <span style="font-size:13px;color:var(--text-3);">清除教学方法（恢复默认）</span>
            </div>
          </div>
        </div>`;
    }
    // Bind events via delegation (no inline onclick — avoids XSS)
    popup.onclick = function(e) {
      const main = e.target.closest('[data-skill-idx]');
      const info = e.target.closest('[data-info-idx]');
      const del = e.target.closest('[data-delete-idx]');
      const clr = e.target.closest('[data-clear-skill]');
      if (info) { e.stopPropagation(); showSkillModal(_cachedSkills[+info.dataset.infoIdx]); return; }
      if (del) { e.stopPropagation(); deleteSkillFile(_cachedSkills[+del.dataset.deleteIdx].name); return; }
      if (clr) { clearSkill(); return; }
      if (main) { selectSkill(_cachedSkills[+main.dataset.skillIdx].name); return; }
    };
    popup.style.display = 'block';
  } else {
    popup.style.display = 'none';
  }
}

function formatSkillBody(body, activeSection) {
  // Pre-process: mark active section header, then render as markdown
  const processed = body.split('\n').map(line => {
    const hm = line.match(/^## (.+)/);
    if (hm && activeSection && hm[1].trim().toLowerCase().replace(/\s+/g, '_') === activeSection) {
      return `## 🔵 ${hm[1]}`;
    }
    return line;
  }).join('\n');
  return safeMarkdown(processed);
}

function showSkillModal(nameOrInfo, highlightSection) {
  let skill;
  if (typeof nameOrInfo === 'string') {
    skill = (_cachedSkills || []).find(s => s.name === nameOrInfo);
  } else {
    skill = nameOrInfo;
  }
  if (!skill) return;

  // Remove any existing modal (prevent stacking)
  document.querySelector('.skill-modal-overlay')?.remove();

  const body = formatSkillBody(skill.body || '', highlightSection || null);
  const overlay = document.createElement('div');
  overlay.className = 'skill-modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.innerHTML = `
    <div class="skill-modal">
      <div class="skill-modal-header">
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="material-symbols-outlined" style="color:var(--accent);font-size:20px;">psychology</span>
            <span style="font-size:16px;font-weight:700;color:var(--text);">${escapeHtml(skill.display_name || skill.name)}</span>
          </div>
          <p style="font-size:11px;color:var(--text-3);margin-top:4px;">${escapeHtml(skill.description || '')}</p>
        </div>
        <button class="skill-modal-close" style="padding:4px;cursor:pointer;border:none;background:transparent;border-radius:6px;">
          <span class="material-symbols-outlined" style="color:var(--text-4);">close</span>
        </button>
      </div>
      <div class="skill-modal-body prose">${body}</div>
    </div>`;

  // Close handlers
  const closeModal = () => { overlay.remove(); document.removeEventListener('keydown', escHandler); };
  const escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  overlay.querySelector('.skill-modal-close').addEventListener('click', closeModal);
  document.addEventListener('keydown', escHandler);
  document.body.appendChild(overlay);
}

function showModal(title, bodyHtml) {
  document.querySelector('.skill-modal-overlay')?.remove();
  const overlay = document.createElement('div');
  overlay.className = 'skill-modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.innerHTML = `
    <div class="skill-modal">
      <div class="skill-modal-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="material-symbols-outlined" style="color:var(--accent);font-size:20px;">lightbulb</span>
          <span style="font-size:16px;font-weight:700;color:var(--text);">${escapeHtml(title)}</span>
        </div>
        <button class="skill-modal-close" style="padding:4px;cursor:pointer;border:none;background:transparent;border-radius:6px;">
          <span class="material-symbols-outlined" style="color:var(--text-4);">close</span>
        </button>
      </div>
      <div class="skill-modal-body prose">${bodyHtml}</div>
    </div>`;
  const closeModal = () => { overlay.remove(); document.removeEventListener('keydown', escHandler); };
  const escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  overlay.querySelector('.skill-modal-close').addEventListener('click', closeModal);
  document.addEventListener('keydown', escHandler);
  document.body.appendChild(overlay);
}

function deleteSkillFile(name) {
  // Skills are file-based, cannot delete via API in MVP
  alert(`Skill "${name}" 是文件系统中的 SKILL.md，请在服务器上手动删除 skills/${name}/SKILL.md`);
}

async function selectSkill(name) {
  const popup = document.getElementById('skillPopup');
  const input = document.getElementById('chatInput');
  popup.style.display = 'none';

  _activeSkillInfo = (_cachedSkills || []).find(s => s.name === name) || null;
  input.value = `/skill ${name} `;
  input.focus();
}

async function clearSkill() {
  const popup = document.getElementById('skillPopup');
  const input = document.getElementById('chatInput');
  popup.style.display = 'none';
  input.value = '';

  if (currentSessionId) {
    try { await setSkill(currentSessionId, null); } catch (err) { /* ignore */ }
  }
  _activeSkillInfo = null;
  input.focus();
}

function buildSkillBadge(skillInfo) {

  // Store skill info in a global registry keyed by index to avoid inline JS

async function handleSend(text) {
  const input = document.getElementById('chatInput');
  const rawMessage = text || input.value.trim();
  if (!rawMessage) return;
  input.value = '';
  input.style.height = 'auto'; // reset to single line

  // Handle /skill <name> prefix: extract skill, set it, send the rest as message
  let message = rawMessage;
  const skillMatch = rawMessage.match(/^\/skill\s+(\S+)\s+([\s\S]+)$/);
  if (skillMatch) {
    const skillName = skillMatch[1];
    message = skillMatch[2].trim();

    // Ensure session exists for set-skill
    if (!currentSessionId) {
      currentSessionId = crypto.randomUUID();
      setSessionId(currentSessionId);
    }

    try {
      const skillResp = await setSkill(currentSessionId, skillName);
      if (!_cachedSkills) _cachedSkills = await fetchSkills();
      _activeSkillInfo = (_cachedSkills || []).find(s => s.name === skillName) || null;
      // Auto-resume: if a topic was pending, send it as the message
      if (skillResp && skillResp.auto_resume && skillResp.topic) {
        message = `我想学习${skillResp.topic}`;
      }
    } catch (err) {
      // Skill set failed, continue without skill
    }
    }

  const chatHistory = document.getElementById('chatHistory');

  // Show user message as-is (no skill badge — skill info only on AI replies)
  const userBubbleContent = escapeHtml(rawMessage);

  chatHistory.innerHTML += `
    <div class="user-msg">
      <div class="user-bubble">${userBubbleContent}</div>
    </div>`;

  // Show loading
  chatHistory.innerHTML += `
    <div class="ai-msg" id="loading">
      <div class="ai-avatar">A</div>
      <div class="ai-content">
        <div class="ai-name">EduAI</div>
        <div class="ai-text" style="color:var(--text-4);">思考中…</div>
      </div>
    </div>`;
  chatHistory.scrollIntoView({ behavior: 'smooth', block: 'end' });

  try {
    messageCount++;
    document.getElementById('loading')?.remove();

    // Prepare streaming response container
    const responseId = 'stream-resp-' + Date.now();
    let streamText = '';
    let streamBadge = '';
    let streamMode = 'chat';

    chatHistory.innerHTML += `
      <div class="ai-msg msg-wrapper" id="${responseId}">
        <div class="ai-avatar">A</div>
        <div class="ai-content">
          <div class="ai-name">EduAI</div>
          <div class="stream-badge"></div>
          <div class="stream-content ai-text prose">
            <span class="stream-cursor"></span>
          </div>
        </div>
      </div>`;

    const respEl = document.getElementById(responseId);
    const contentEl = respEl.querySelector('.stream-content');
    const badgeEl = respEl.querySelector('.stream-badge');

    const body = { message };
    if (currentSessionId) body.session_id = currentSessionId;

    await streamSSE(`${API_BASE}/chat/stream`, body, {
      skill(d) {
        _activeSkillInfo = d;
        if (!_cachedSkills) _cachedSkills = [];
        if (!_cachedSkills.find(s => s.name === d.name)) _cachedSkills.push(d);
        badgeEl.innerHTML = buildSkillBadge(d);
      },
      start(d) {
        if (d.session_id) {
          currentSessionId = d.session_id;
          setSessionId(currentSessionId);
        }
      },
      token(d) {
        streamText += d.content;
        contentEl.innerHTML = safeMarkdown(streamText) + '<span class="stream-cursor"></span>';
        chatHistory.scrollIntoView({ behavior: 'smooth', block: 'end' });
      },
      done(d) {
        if (d.session_id) {
          currentSessionId = d.session_id;
          setSessionId(currentSessionId);
        }
        // Final render (remove cursor)
        contentEl.innerHTML = safeMarkdown(streamText);
        // Add message actions below text, inside the flex-grow container
        const msgIdx = _msgStore.length;
        _msgStore.push({ text: streamText, raw: message });
        contentEl.insertAdjacentHTML('afterend', `
          <div class="msg-actions">
            <button class="msg-action" data-copy-idx="${msgIdx}" title="Copy">
              <span class="material-symbols-outlined" style="font-size:18px;">content_copy</span>
            </button>
            <button class="msg-action" data-regen-idx="${msgIdx}" title="Regenerate">
              <span class="material-symbols-outlined" style="font-size:18px;">refresh</span>
            </button>
          </div>`);
      },
      complete(d) {
        // Non-chat mode (graph, quiz, etc.) — full response at once
        streamMode = d.mode || 'chat';
        respEl.remove();
        if (d.mode === 'graph' && d.data?.graph) {
          currentSessionId = d.session_id;
          setSessionId(currentSessionId);
          renderKnowledgeGraph({ data: d.data, message: d.message, session_id: d.session_id, active_skill: _activeSkillInfo });
          setTimeout(initAllGraphs, 100);
          // Auto-rename session with topic
          if (d.data.graph.topic && typeof renameCurrentSession === 'function') {
            renameCurrentSession(d.data.graph.topic);
          }
        } else {
          chatHistory.innerHTML += `
            <div class="ai-msg">
              <div class="ai-avatar">A</div>
              <div class="ai-content">
                <div class="ai-name">EduAI</div>
                <div class="ai-text prose">${safeMarkdown(d.message || '')}</div>
              </div>
            </div>`;
        }
      },
      error(d) {
        contentEl.innerHTML = `<span style="color:var(--error);">${escapeHtml(d.message || '请求失败')}</span>`;
      },
    });

    // Sync sidebar
    const sessions = JSON.parse(localStorage.getItem('openail_sessions') || '[]');
    const currentKey = localStorage.getItem('openail_current_session');
    const existing = sessions.find(s => s.id === currentKey || s.id === currentSessionId);
    if (!existing) {
      sessions.unshift({ id: currentSessionId, name: '未命名' });
      localStorage.setItem('openail_sessions', JSON.stringify(sessions));
    } else if (existing.id !== currentSessionId) {
      existing.id = currentSessionId;
      localStorage.setItem('openail_sessions', JSON.stringify(sessions));
    }
    localStorage.setItem('openail_current_session', currentSessionId);

    if (typeof renameCurrentSession === 'function') {
      const sessionStillUnnamed = existing ? existing.name === '未命名' : true;
      if (sessionStillUnnamed && messageCount >= 3) {
        renameCurrentSession(message.substring(0, 15));
      }
    }
  } catch (err) {
    document.getElementById('loading')?.remove();
    chatHistory.innerHTML += `<div style="color:var(--error);font-size:13px;padding:12px;">请求失败: ${escapeHtml(err.message)}</div>`;
  }
}

function renderKnowledgeGraph(data) {

  const containerId = 'kg-container-' + (++_graphCounter);

  const levelStyles = {
    core:         { bg: '#CF6833', border: '#9E4A2A', size: 28 },
    prerequisite: { bg: '#F5D5BF', border: '#E8B897', size: 20 },
    extension:    { bg: '#EDE9E3', border: '#D4CFC8', size: 18 },
  };

  const nodeCount = graphNodes.length;
  chatHistory.innerHTML += `
    <div class="ai-msg">
      <div class="ai-avatar">A</div>
      <div class="ai-content">
        <div class="ai-name">EduAI</div>
        ${buildSkillBadge(data.active_skill || _activeSkillInfo)}

              <div class="kg-legend-item"><div class="kg-legend-dot" style="background:var(--accent);"></div>核心</div>
              <div class="kg-legend-item"><div class="kg-legend-dot" style="background:var(--accent-border);"></div>前置</div>
              <div class="kg-legend-item"><div class="kg-legend-dot" style="background:var(--user-bubble);"></div>拓展</div>
            </div>
            <button class="kg-start-btn" onclick="startDiagnosis('${currentSessionId}')">开始诊断 →</button>
          </div>
        </div>
      </div>
    </div>`;

  // Queue vis.js initialization — actual init happens via initAllGraphs() or
  // explicit setTimeout after all innerHTML operations are done
  _pendingGraphInits.push({ containerId, graphNodes, graphEdges, levelStyles });
}

const _pendingGraphInits = [];

function initGraph(containerId, graphNodes, graphEdges, levelStyles) {
    const container = document.getElementById(containerId);
    if (!container || typeof vis === 'undefined') return;
    container.innerHTML = ''; // Clear any stale content before re-init

    const visNodes = new vis.DataSet(graphNodes.map(n => {
      const style = levelStyles[n.level] || levelStyles.prerequisite;
      const isCore = n.level === 'core';
      return {
        id: n.id,
        label: n.name,
        title: n.description || n.name,
        size: style.size,
        shape: 'dot',
        color: {
          background: style.bg,
          border: style.border,
          highlight: { background: '#CF6833', border: '#9E4A2A' },
          hover: { background: '#CF6833', border: '#9E4A2A' },
        },
        font: {
          color: '#1a1a1a',
          size: isCore ? 14 : 12,
          face: 'Inter, sans-serif',
          bold: { color: '#1a1a1a', size: 14, face: 'Inter, sans-serif' },
        },
        borderWidth: isCore ? 3 : 2,
        shadow: { enabled: true, size: 8, color: 'rgba(0,0,0,0.1)' },
      };
    }));

    const visEdges = new vis.DataSet(graphEdges.map(e => ({
      from: e.source,
      to: e.target,
      arrows: { to: { enabled: true, scaleFactor: 0.6 } },
      color: { color: '#D4CFC8', highlight: '#CF6833', hover: '#CF6833' },
      width: 1.5,
      smooth: { type: 'continuous' },
    })));

    new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
      physics: {
        barnesHut: { gravitationalConstant: -2500, springLength: 150, springConstant: 0.04 },
        stabilization: { iterations: 100 },
      },
      interaction: {
        hover: true,
        tooltipDelay: 200,
        zoomView: true,
        dragView: true,
        zoomSpeed: 0.3,
        minZoom: 0.4,
        maxZoom: 2.5,
      },
      layout: { improvedLayout: true },
    });
}

function initAllGraphs() {
  for (const g of _pendingGraphInits) {
    initGraph(g.containerId, g.graphNodes, g.graphEdges, g.levelStyles);
  }
}

    // User message with skill badge if active
    chatHistory.innerHTML += `
      <div class="user-msg">
        <div class="user-bubble">我想学习${escapeHtml(state.topic)}</div>
      </div>`;

    if (state.graph) {
      renderKnowledgeGraph({ data: { graph: state.graph }, message: `我已经为你梳理了「${state.topic}」的知识图谱。`, session_id: sid });
    }
  }

  if (state.diagnosis_result) {
    renderDiagnosisResults(state.diagnosis_result, sid);
  }

  // No lesson card — Start Learning button on diagnosis card handles both formats

  // Render remaining chat messages
  if (state.messages && state.messages.length > 0) {
    let startIdx = 0;
    for (let i = state.messages.length - 1; i >= 0; i--) {
      const msg = state.messages[i];
      if (msg.role === 'ai') {
        const content = msg.content || '';
        if (content.includes('知识图谱') || content.includes('开始作答') ||
            content.includes('诊断完成') || content.includes('已掌握') ||
            content.length > 1000) {
          startIdx = i + 1;
          break;
        }
      }
    }

    for (let i = startIdx; i < state.messages.length; i++) {
      const msg = state.messages[i];
      if (msg.role === 'user') {
        chatHistory.innerHTML += `
          <div class="user-msg">
            <div class="user-bubble">${escapeHtml(msg.content)}</div>
          </div>`;
      } else if (msg.role === 'ai') {
        const badge = buildSkillBadge(_activeSkillInfo ? {..._activeSkillInfo, current_section: 'chat'} : null);
        const msgIdx = _msgStore.length;
        _msgStore.push({ text: msg.content, raw: null });
        chatHistory.innerHTML += `
          <div class="ai-msg msg-wrapper">
            <div class="ai-avatar">A</div>
            <div class="ai-content">
              <div class="ai-name">EduAI</div>
              ${badge}
              <div class="ai-text prose">${safeMarkdown(msg.content)}</div>
              <div class="msg-actions">
                <button class="msg-action" data-copy-idx="${msgIdx}" title="Copy">
                  <span class="material-symbols-outlined" style="font-size:18px;">content_copy</span>
                </button>
              </div>
            </div>
          </div>`;
      }
    }
  }

  // Initialize all knowledge graph vis.js instances AFTER all innerHTML is done
  // Use setTimeout to ensure DOM has fully updated after innerHTML operations
  // 500ms ensures all async state fetches and DOM updates are complete
  setTimeout(initAllGraphs, 500);
})();
</script>

<script>
// Message store for copy/regenerate
const _msgStore = [];

// Copy + regenerate handlers (delegated)
document.addEventListener('click', function(e) {
  const copyBtn = e.target.closest('[data-copy-idx]');
  if (copyBtn) {
    const msg = _msgStore[+copyBtn.dataset.copyIdx];
    if (msg) {
      navigator.clipboard.writeText(msg.text).then(() => {
        const icon = copyBtn.querySelector('.material-symbols-outlined');
        icon.textContent = 'check';
        setTimeout(() => { icon.textContent = 'content_copy'; }, 1500);
      });
    }
    return;
  }
  const regenBtn = e.target.closest('[data-regen-idx]');
  if (regenBtn) {
    const idx = +regenBtn.dataset.regenIdx;
    const msg = _msgStore[idx];
    if (!msg || !msg.raw) return;

    // Find the content element in the same message wrapper
    const wrapper = regenBtn.closest('.msg-wrapper');
    const contentEl = wrapper.querySelector('.prose');
    if (!contentEl) return;

    // Clear and re-stream in place
    contentEl.innerHTML = '<span class="stream-cursor"></span>';
    let newText = '';

    const body = { message: msg.raw };
    if (currentSessionId) body.session_id = currentSessionId;

    streamSSE(`${API_BASE}/chat/stream`, body, {
      token(d) {
        newText += d.content;
        contentEl.innerHTML = safeMarkdown(newText) + '<span class="stream-cursor"></span>';
      },
      done(d) {
        contentEl.innerHTML = safeMarkdown(newText);
        _msgStore[idx].text = newText;
      },
      complete(d) {
        if (d.message) {
          contentEl.innerHTML = safeMarkdown(d.message);
          _msgStore[idx].text = d.message;
        }
      },
      error(d) {
        contentEl.innerHTML = `<span style="color:var(--error);">${escapeHtml(d.message || 'Regeneration failed')}</span>`;
      },
      skill() {},
      start() {},
    });
    return;
  }
});

// Close skill popup when clicking outside
document.addEventListener('click', function(e) {
  const popup = document.getElementById('skillPopup');
  const input = document.getElementById('chatInput');
  if (popup && !popup.contains(e.target) && e.target !== input) {
    popup.style.display = 'none';
  }
});

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const icon = document.getElementById('collapseIcon');
  sidebar.classList.toggle('collapsed');
  icon.textContent = sidebar.classList.contains('collapsed') ? 'chevron_right' : 'chevron_left';
}
</script>
</body></html>
