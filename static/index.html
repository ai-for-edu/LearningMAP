<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenAILearning - Scholar Minimal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary": "#3c692b",
              "error": "#ba1a1a",
              "outline-variant": "#c1c7d3",
              "secondary-fixed": "#bdf1a3",
              "on-surface-variant": "#414751",
              "on-primary-fixed": "#001c39",
              "surface-container-low": "#f2f4f6",
              "on-error": "#ffffff",
              "surface-container": "#eceef0",
              "secondary-fixed-dim": "#a1d489",
              "surface-container-high": "#e6e8ea",
              "surface-dim": "#d8dadc",
              "primary": "#005da7",
              "tertiary-fixed-dim": "#adcbda",
              "on-secondary-fixed": "#052100",
              "primary-fixed-dim": "#a4c9ff",
              "surface": "#f7f9fb",
              "surface-container-highest": "#e0e3e5",
              "tertiary-fixed": "#c9e7f7",
              "on-primary": "#ffffff",
              "surface-variant": "#e0e3e5",
              "on-tertiary-container": "#fbfdff",
              "surface-tint": "#0060ac",
              "on-tertiary": "#ffffff",
              "primary-container": "#2976c7",
              "surface-container-lowest": "#ffffff",
              "inverse-on-surface": "#eff1f3",
              "tertiary-container": "#5c7987",
              "on-secondary-fixed-variant": "#255015",
              "error-container": "#ffdad6",
              "on-surface": "#191c1e",
              "on-tertiary-fixed-variant": "#2e4b57",
              "outline": "#717783",
              "secondary-container": "#baeea0",
              "on-tertiary-fixed": "#001f2a",
              "inverse-surface": "#2d3133",
              "on-secondary-container": "#406d2f",
              "inverse-primary": "#a4c9ff",
              "tertiary": "#43606d",
              "on-error-container": "#93000a",
              "on-background": "#191c1e",
              "surface-bright": "#f7f9fb",
              "background": "#f7f9fb",
              "on-primary-container": "#fdfcff",
              "on-primary-fixed-variant": "#004883"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .knowledge-label {
            transition: all 0.2s ease-in-out;
        }
        .knowledge-label:hover {
            color: #005da7;
            transform: translateY(-1px);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Chat markdown */
        .prose h3 { font-weight: 700; margin: 1rem 0 0.5rem; color: #191c1e; }
        .prose p { margin: 0.5rem 0; }
        .prose ul, .prose ol { padding-left: 1.5rem; margin: 0.5rem 0; }
        .prose li { margin: 0.25rem 0; }
        .prose strong { color: #191c1e; }
        .prose code { background: #eceef0; padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 0.85em; }
        .prose blockquote { border-left: 3px solid #005da7; padding-left: 1rem; color: #414751; margin: 0.5rem 0; }
        /* Skill popup list */
        .skill-popup { position: absolute; bottom: 100%; left: 0; right: 0; margin-bottom: 8px; max-height: 360px; overflow-y: auto; background: white; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); z-index: 200; }
        .skill-item { padding: 12px 16px; display: flex; align-items: flex-start; gap: 10px; transition: background 0.15s; }
        .skill-item:hover { background: #f1f5f9; }
        .skill-item:not(:last-child) { border-bottom: 1px solid #f1f5f9; }
        .skill-item-main { flex: 1; cursor: pointer; }
        .skill-item-actions { display: flex; gap: 2px; flex-shrink: 0; padding-top: 2px; }
        .skill-action-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: none; background: transparent; cursor: pointer; color: #94a3b8; transition: all 0.15s; }
        .skill-action-btn:hover { background: #e2e8f0; color: #475569; }
        /* Skill badge on AI messages */
        .skill-badge { display: inline-flex; align-items: center; gap: 4px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; cursor: pointer; transition: background 0.15s; }
        .skill-badge:hover { background: #dbeafe; }
        /* Skill detail modal */
        .skill-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; z-index: 300; }
        .skill-modal { background: white; border-radius: 20px; padding: 0; max-width: 560px; width: 90%; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .skill-modal-header { padding: 20px 24px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; }
        .skill-modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; color: #334155; }
        /* Message action buttons — ChatGPT style */
        .msg-actions { display: flex; gap: 4px; margin-top: 6px; opacity: 0; transition: opacity 0.15s; }
        .msg-wrapper:hover .msg-actions { opacity: 1; }
        .msg-action { border: none; background: transparent; cursor: pointer; padding: 4px; color: #b0b8c4; transition: color 0.15s; }
        .msg-action:hover { color: #475569; }
        /* Streaming cursor */
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
        .stream-cursor { display: inline-block; width: 2px; height: 1em; background: #005da7; margin-left: 2px; vertical-align: text-bottom; animation: blink 0.8s step-end infinite; }
    </style>
</head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-fixed">
<!-- Top Navigation Bar -->
<nav class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-100 dark:border-slate-800 flex justify-between items-center px-6 py-3">
<div class="flex items-center gap-8">
<span class="text-xl font-extrabold tracking-tighter text-blue-800 dark:text-blue-300">OpenAILearning</span>
</div>
<div class="flex items-center gap-4"></div>
</nav>
<!-- Permanent Side Navigation -->
<aside id="sidebar" class="h-screen w-64 fixed left-0 top-0 pt-20 bg-white dark:bg-slate-950 flex flex-col p-4 border-r border-slate-100 dark:border-slate-800 z-40 transition-all duration-300">
<button onclick="createNewSession()" class="w-full flex items-center justify-center gap-2 bg-primary text-white py-3 px-4 rounded-xl font-headline font-bold text-sm shadow-sm hover:shadow-md hover:bg-primary-container transition-all mb-4">
<span class="material-symbols-outlined text-lg">add</span>
<span>New Session</span>
</button>
<div class="flex-grow overflow-y-auto space-y-1" id="session-list"></div>
<!-- Collapse handle -->
<button onclick="toggleSidebar()" id="collapseBtn" class="absolute top-1/2 -translate-y-1/2 -right-4 w-8 h-16 bg-white border border-slate-200 rounded-r-lg flex items-center justify-center shadow-sm hover:bg-slate-50 transition-colors z-50">
  <span class="material-symbols-outlined text-sm text-slate-400" id="collapseIcon">chevron_left</span>
</button>
</aside>
<script src="sidebar.js?v=2"></script>
<script src="api.js?v=6"></script>
<!-- Main Content -->
<main id="mainContent" class="ml-64 pt-24 pb-32 px-6 min-h-screen flex flex-col transition-all duration-300">
<div class="max-w-4xl mx-auto w-full">
<!-- Chat History (dynamic) -->
<div class="flex flex-col gap-12" id="chatHistory"></div>
</main>
<!-- Chat Input Fixed Bottom -->
<div id="bottomBar" class="fixed bottom-0 left-64 right-0 p-6 bg-surface/80 backdrop-blur-xl border-t border-slate-100 dark:border-slate-800 transition-all duration-300">
<div class="max-w-[720px] mx-auto relative">
<textarea id="chatInput" onkeydown="handleInputKeydown(event)" oninput="handleInputChange(event)" rows="1" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl py-4 px-6 pr-14 focus:ring-2 focus:ring-primary/10 focus:border-primary outline-none transition-all placeholder:text-slate-400 font-body text-on-surface shadow-sm resize-none overflow-hidden" placeholder="输入学习主题，例如：我想学习勾股定理 · 输入 /skill 选择教学方法" style="min-height:56px;max-height:160px;"></textarea>
<div id="skillPopup" class="skill-popup" style="display:none;"></div>
<button onclick="handleSend()" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 bg-primary text-white rounded-xl shadow-sm hover:shadow-md hover:bg-primary-container transition-all">
<span class="material-symbols-outlined text-xl">arrow_upward</span>
</button>
</div>
<div class="max-w-[720px] mx-auto mt-3 flex gap-3 overflow-x-auto no-scrollbar pb-1" id="suggestBtns"></div>
</div>
<script>
let currentSessionId = getSessionId();
let messageCount = 0;
let _cachedSkills = null;
let _activeSkillInfo = null; // {name, display_name, body, current_section}

// Input handler: detect /skill and show popup
function handleInputKeydown(e) {
  const popup = document.getElementById('skillPopup');
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (popup.style.display !== 'none') return;
    handleSend();
  } else if (e.key === 'Escape') {
    popup.style.display = 'none';
  }
  // Auto-resize textarea
  requestAnimationFrame(() => {
    const el = e.target;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  });
}

async function handleInputChange(e) {
  // Auto-resize textarea
  const el = e.target;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';

  const val = e.target.value;
  const popup = document.getElementById('skillPopup');

  if (val.trim() === '/skill' || val.trim() === '/skill ') {
    if (!_cachedSkills) _cachedSkills = await fetchSkills();
    if (_cachedSkills.length === 0) {
      popup.innerHTML = '<div class="p-4 text-sm text-slate-400">暂无可用的教学方法</div>';
    } else {
      popup.innerHTML = _cachedSkills.map((s, i) => `
        <div class="skill-item">
          <div class="skill-item-main" data-skill-idx="${i}">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-primary text-base">psychology</span>
              <span class="font-headline font-bold text-sm text-on-surface">${escapeHtml(s.display_name)}</span>
            </div>
            <p class="text-xs text-on-surface-variant mt-1 line-clamp-2">${escapeHtml(s.description)}</p>
          </div>
          <div class="skill-item-actions">
            <button class="skill-action-btn" data-info-idx="${i}" title="查看详情">
              <span class="material-symbols-outlined" style="font-size:16px;">info</span>
            </button>
            <button class="skill-action-btn" data-delete-idx="${i}" title="删除">
              <span class="material-symbols-outlined" style="font-size:16px;">delete</span>
            </button>
          </div>
        </div>
      `).join('') + `
        <div class="skill-item" style="border-top:1px solid #e2e8f0;">
          <div class="skill-item-main" data-clear-skill="1">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-slate-400 text-base">close</span>
              <span class="font-body text-sm text-slate-500">清除教学方法（恢复默认）</span>
            </div>
          </div>
        </div>`;
    }
    // Bind events via delegation (no inline onclick — avoids XSS)
    popup.onclick = function(e) {
      const main = e.target.closest('[data-skill-idx]');
      const info = e.target.closest('[data-info-idx]');
      const del = e.target.closest('[data-delete-idx]');
      const clr = e.target.closest('[data-clear-skill]');
      if (info) { e.stopPropagation(); showSkillModal(_cachedSkills[+info.dataset.infoIdx]); return; }
      if (del) { e.stopPropagation(); deleteSkillFile(_cachedSkills[+del.dataset.deleteIdx].name); return; }
      if (clr) { clearSkill(); return; }
      if (main) { selectSkill(_cachedSkills[+main.dataset.skillIdx].name); return; }
    };
    popup.style.display = 'block';
  } else {
    popup.style.display = 'none';
  }
}

function formatSkillBody(body, activeSection) {
  // Pre-process: mark active section header, then render as markdown
  const processed = body.split('\n').map(line => {
    const hm = line.match(/^## (.+)/);
    if (hm && activeSection && hm[1].trim().toLowerCase().replace(/\s+/g, '_') === activeSection) {
      return `## 🔵 ${hm[1]}`;
    }
    return line;
  }).join('\n');
  return safeMarkdown(processed);
}

function showSkillModal(nameOrInfo, highlightSection) {
  let skill;
  if (typeof nameOrInfo === 'string') {
    skill = (_cachedSkills || []).find(s => s.name === nameOrInfo);
  } else {
    skill = nameOrInfo;
  }
  if (!skill) return;

  // Remove any existing modal (prevent stacking)
  document.querySelector('.skill-modal-overlay')?.remove();

  const body = formatSkillBody(skill.body || '', highlightSection || null);
  const overlay = document.createElement('div');
  overlay.className = 'skill-modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.innerHTML = `
    <div class="skill-modal">
      <div class="skill-modal-header">
        <div>
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">psychology</span>
            <span class="font-headline font-bold text-lg text-on-surface">${escapeHtml(skill.display_name || skill.name)}</span>
          </div>
          <p class="text-xs text-on-surface-variant mt-1">${escapeHtml(skill.description || '')}</p>
        </div>
        <button class="skill-modal-close p-1 rounded-lg hover:bg-slate-100 transition-colors">
          <span class="material-symbols-outlined text-slate-400">close</span>
        </button>
      </div>
      <div class="skill-modal-body prose prose-slate max-w-none">${body}</div>
    </div>`;

  // Close handlers
  const closeModal = () => { overlay.remove(); document.removeEventListener('keydown', escHandler); };
  const escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  overlay.querySelector('.skill-modal-close').addEventListener('click', closeModal);
  document.addEventListener('keydown', escHandler);
  document.body.appendChild(overlay);
}

function deleteSkillFile(name) {
  // Skills are file-based, cannot delete via API in MVP
  alert(`Skill "${name}" 是文件系统中的 SKILL.md，请在服务器上手动删除 skills/${name}/SKILL.md`);
}

async function selectSkill(name) {
  const popup = document.getElementById('skillPopup');
  const input = document.getElementById('chatInput');
  popup.style.display = 'none';

  _activeSkillInfo = (_cachedSkills || []).find(s => s.name === name) || null;
  input.value = `/skill ${name} `;
  input.focus();
}

async function clearSkill() {
  const popup = document.getElementById('skillPopup');
  const input = document.getElementById('chatInput');
  popup.style.display = 'none';
  input.value = '';

  if (currentSessionId) {
    try { await setSkill(currentSessionId, null); } catch (err) { /* ignore */ }
  }
  _activeSkillInfo = null;
  input.focus();
}

function buildSkillBadge(skillInfo) {
  if (!skillInfo) return '';
  const displayName = skillInfo.display_name || skillInfo.name || '';
  if (!displayName) return '';
  // Store skill info in a global registry keyed by index to avoid inline JS
  const idx = _badgeSkillStore.length;
  _badgeSkillStore.push({...skillInfo});
  return `
    <div class="skill-badge" data-badge-idx="${idx}" style="margin-bottom:8px;">
      <span class="material-symbols-outlined" style="font-size:14px;">psychology</span>
      ${escapeHtml(displayName)}
    </div>`;
}

const _badgeSkillStore = [];

// Delegate all badge clicks at document level
document.addEventListener('click', function(e) {
  const badge = e.target.closest('[data-badge-idx]');
  if (badge) {
    const info = _badgeSkillStore[+badge.dataset.badgeIdx];
    if (info) showSkillModal(info, info.current_section || null);
  }
});

async function handleSend(text) {
  const input = document.getElementById('chatInput');
  const rawMessage = text || input.value.trim();
  if (!rawMessage) return;
  input.value = '';
  input.style.height = '56px'; // reset to single line

  // Handle /skill <name> prefix: extract skill, set it, send the rest as message
  let message = rawMessage;
  const skillMatch = rawMessage.match(/^\/skill\s+(\S+)\s+([\s\S]+)$/);
  if (skillMatch) {
    const skillName = skillMatch[1];
    message = skillMatch[2].trim();

    // Ensure session exists for set-skill
    if (!currentSessionId) {
      currentSessionId = crypto.randomUUID();
      setSessionId(currentSessionId);
    }

    try {
      await setSkill(currentSessionId, skillName);
      if (!_cachedSkills) _cachedSkills = await fetchSkills();
      _activeSkillInfo = (_cachedSkills || []).find(s => s.name === skillName) || null;
    } catch (err) {
      // Skill set failed, continue without skill
    }
    }

  const chatHistory = document.getElementById('chatHistory');

  // Show user message (display full text including /skill prefix)
  let userBubbleContent;
  if (rawMessage !== message && _activeSkillInfo) {
    const badgeHtml = buildSkillBadge({..._activeSkillInfo, current_section: null});
    userBubbleContent = `<span style="vertical-align:middle;margin-right:4px;">${badgeHtml}</span>${escapeHtml(message)}`;
  } else {
    userBubbleContent = escapeHtml(rawMessage);
  }

  chatHistory.innerHTML += `
    <div class="flex justify-end">
      <div class="bg-surface-container-low px-6 py-4 rounded-3xl rounded-tr-none max-w-[85%] text-on-surface shadow-sm">
        <p class="font-body leading-relaxed">${userBubbleContent}</p>
      </div>
    </div>`;

  // Show loading
  chatHistory.innerHTML += `
    <div class="flex gap-4" id="loading">
      <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center shrink-0">
        <span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
      </div>
      <div class="flex-grow"><p class="font-body text-on-surface-variant animate-pulse">思考中...</p></div>
    </div>`;
  chatHistory.scrollIntoView({ behavior: 'smooth', block: 'end' });

  try {
    messageCount++;
    document.getElementById('loading')?.remove();

    // Prepare streaming response container
    const responseId = 'stream-resp-' + Date.now();
    let streamText = '';
    let streamBadge = '';
    let streamMode = 'chat';

    chatHistory.innerHTML += `
      <div class="flex gap-4 msg-wrapper" id="${responseId}">
        <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
        </div>
        <div class="flex-grow">
          <div class="stream-badge"></div>
          <div class="stream-content prose prose-slate max-w-none font-body text-on-surface-variant leading-relaxed">
            <span class="stream-cursor"></span>
          </div>
        </div>
      </div>`;

    const respEl = document.getElementById(responseId);
    const contentEl = respEl.querySelector('.stream-content');
    const badgeEl = respEl.querySelector('.stream-badge');

    const body = { message };
    if (currentSessionId) body.session_id = currentSessionId;

    await streamSSE(`${API_BASE}/chat/stream`, body, {
      skill(d) {
        _activeSkillInfo = d;
        if (!_cachedSkills) _cachedSkills = [];
        if (!_cachedSkills.find(s => s.name === d.name)) _cachedSkills.push(d);
        badgeEl.innerHTML = buildSkillBadge(d);
      },
      start(d) {
        if (d.session_id) {
          currentSessionId = d.session_id;
          setSessionId(currentSessionId);
        }
      },
      token(d) {
        streamText += d.content;
        contentEl.innerHTML = safeMarkdown(streamText) + '<span class="stream-cursor"></span>';
        chatHistory.scrollIntoView({ behavior: 'smooth', block: 'end' });
      },
      done(d) {
        if (d.session_id) {
          currentSessionId = d.session_id;
          setSessionId(currentSessionId);
        }
        // Final render (remove cursor)
        contentEl.innerHTML = safeMarkdown(streamText);
        // Add message actions below text, inside the flex-grow container
        const msgIdx = _msgStore.length;
        _msgStore.push({ text: streamText, raw: message });
        contentEl.insertAdjacentHTML('afterend', `
          <div class="msg-actions">
            <button class="msg-action" data-copy-idx="${msgIdx}" title="Copy">
              <span class="material-symbols-outlined" style="font-size:18px;">content_copy</span>
            </button>
            <button class="msg-action" data-regen-idx="${msgIdx}" title="Regenerate">
              <span class="material-symbols-outlined" style="font-size:18px;">refresh</span>
            </button>
          </div>`);
      },
      complete(d) {
        // Non-chat mode (graph, quiz, etc.) — full response at once
        streamMode = d.mode || 'chat';
        respEl.remove();
        if (d.mode === 'graph' && d.data?.graph) {
          currentSessionId = d.session_id;
          setSessionId(currentSessionId);
          renderKnowledgeGraph({ data: d.data, message: d.message, session_id: d.session_id, active_skill: _activeSkillInfo });
          setTimeout(initAllGraphs, 100);
          // Auto-rename session with topic
          if (d.data.graph.topic && typeof renameCurrentSession === 'function') {
            renameCurrentSession(d.data.graph.topic);
          }
        } else {
          chatHistory.innerHTML += `
            <div class="flex gap-4">
              <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center shrink-0">
                <span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
              </div>
              <div class="flex-grow prose prose-slate max-w-none font-body text-on-surface-variant leading-relaxed">${safeMarkdown(d.message || '')}</div>
            </div>`;
        }
      },
      error(d) {
        contentEl.innerHTML = `<span class="text-error">${escapeHtml(d.message || '请求失败')}</span>`;
      },
    });

    // Sync sidebar
    const sessions = JSON.parse(localStorage.getItem('openail_sessions') || '[]');
    const currentKey = localStorage.getItem('openail_current_session');
    const existing = sessions.find(s => s.id === currentKey || s.id === currentSessionId);
    if (!existing) {
      sessions.unshift({ id: currentSessionId, name: '未命名' });
      localStorage.setItem('openail_sessions', JSON.stringify(sessions));
    } else if (existing.id !== currentSessionId) {
      existing.id = currentSessionId;
      localStorage.setItem('openail_sessions', JSON.stringify(sessions));
    }
    localStorage.setItem('openail_current_session', currentSessionId);

    if (typeof renameCurrentSession === 'function') {
      const sessionStillUnnamed = existing ? existing.name === '未命名' : true;
      if (sessionStillUnnamed && messageCount >= 3) {
        renameCurrentSession(message.substring(0, 15));
      }
    }
  } catch (err) {
    document.getElementById('loading')?.remove();
    chatHistory.innerHTML += `<div class="text-error text-sm p-4">请求失败: ${escapeHtml(err.message)}</div>`;
  }
}

let _graphCounter = 0;

function renderKnowledgeGraph(data) {
  const graph = data.data.graph;

  const graphEdges = graph.edges || [];
  const containerId = 'kg-container-' + (++_graphCounter);

  // Color palette by level — all labels dark for readability
  const levelStyles = {
    core:         { bg: '#005da7', border: '#004883', size: 28 },
    prerequisite: { bg: '#a4c9ff', border: '#6ba3e8', size: 20 },
    extension:    { bg: '#86efac', border: '#4ade80', size: 18 },
  };

  chatHistory.innerHTML += `
    <div class="flex gap-4">
      <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center shrink-0">
        <span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
      </div>
      <div class="flex-grow space-y-6">
        ${buildSkillBadge(data.active_skill || _activeSkillInfo)}
        <div class="prose prose-slate max-w-none">
          <p class="font-headline text-2xl font-bold tracking-tight text-primary">${escapeHtml(graph.topic)} 知识图谱</p>
          <p class="font-body text-on-surface-variant leading-relaxed">${escapeHtml(data.message)}</p>
        </div>
        <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden" style="padding: 0;">
          <div id="${containerId}" style="height: 420px; width: 100%;"></div>
          <div class="flex items-center justify-center gap-6 py-3 border-t border-slate-100">
            <span class="flex items-center gap-1.5 text-xs text-on-surface-variant"><span class="w-3 h-3 rounded-full" style="background:#005da7;"></span>核心知识点</span>
            <span class="flex items-center gap-1.5 text-xs text-on-surface-variant"><span class="w-3 h-3 rounded-full" style="background:#a4c9ff;"></span>前置知识</span>
            <span class="flex items-center gap-1.5 text-xs text-on-surface-variant"><span class="w-3 h-3 rounded-full" style="background:#86efac;"></span>拓展知识</span>
          </div>
          <div class="text-center pb-4">
            <a href="diagnosis.html?session_id=${currentSessionId}" class="inline-block bg-secondary text-white py-3 px-8 rounded-full font-headline font-bold tracking-wide shadow-md hover:bg-secondary/90 transition-all text-sm">Start Diagnosis</a>
          </div>
        </div>
      </div>
    </div>`;

  // Queue vis.js initialization — actual init happens via initAllGraphs() or
  // explicit setTimeout after all innerHTML operations are done
  _pendingGraphInits.push({ containerId, graphNodes, graphEdges, levelStyles });
}

const _pendingGraphInits = [];

function initGraph(containerId, graphNodes, graphEdges, levelStyles) {
    const container = document.getElementById(containerId);
    if (!container || typeof vis === 'undefined') return;
    container.innerHTML = ''; // Clear any stale content before re-init

    const visNodes = new vis.DataSet(graphNodes.map(n => {
      const style = levelStyles[n.level] || levelStyles.prerequisite;
      const isCore = n.level === 'core';
      return {
        id: n.id,
        label: n.name,
        title: n.description || n.name,
        size: style.size,
        shape: 'dot',
        color: {
          background: style.bg,
          border: style.border,
          highlight: { background: '#005da7', border: '#004883' },
          hover: { background: '#005da7', border: '#004883' },
        },
        font: {
          color: '#191c1e',
          size: isCore ? 14 : 12,
          face: 'Manrope, sans-serif',
          bold: { color: '#191c1e', size: 14, face: 'Manrope, sans-serif' },
        },
        borderWidth: isCore ? 3 : 2,
        shadow: { enabled: true, size: 8, color: 'rgba(0,0,0,0.1)' },
      };
    }));

    const visEdges = new vis.DataSet(graphEdges.map(e => ({
      from: e.source,
      to: e.target,
      arrows: { to: { enabled: true, scaleFactor: 0.6 } },
      color: { color: '#c1c7d3', highlight: '#005da7', hover: '#005da7' },
      width: 1.5,
      smooth: { type: 'continuous' },
    })));

    new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
      physics: {
        barnesHut: { gravitationalConstant: -2500, springLength: 150, springConstant: 0.04 },
        stabilization: { iterations: 100 },
      },
      interaction: {
        hover: true,
        tooltipDelay: 200,
        zoomView: true,
        dragView: true,
        zoomSpeed: 0.3,
        minZoom: 0.4,
        maxZoom: 2.5,
      },
      layout: { improvedLayout: true },
    });
}

function initAllGraphs() {
  for (const g of _pendingGraphInits) {
    initGraph(g.containerId, g.graphNodes, g.graphEdges, g.levelStyles);
  }
}

              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center">

                <span class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest">Accuracy</span>
              </div>
            </div>
            <div class="flex-grow space-y-3">
              <div class="flex items-center justify-between"><span class="font-body text-sm text-on-surface-variant">Total</span><span class="font-headline font-bold text-on-surface">${r.total}</span></div>
              <div class="flex items-center justify-between"><span class="font-body text-sm text-on-surface-variant">Correct</span><span class="font-headline font-bold text-secondary">${r.correct}</span></div>

// renderLessonButton removed — Start Learning button on diagnosis card is the single entry point

async function showLessonFormatChoice(sid) {
  document.querySelector('.lesson-format-overlay')?.remove();

  // Fetch current status
  let lessonStatus = null, slidesStatus = null;
  try {
    const state = await getSessionState(sid);
    lessonStatus = state.lesson_task_status;
    slidesStatus = state.slides_task_status;
    // Content exists = done, regardless of task status
    if (state.lesson_content) lessonStatus = 'done';
    if (state.slide_contents && state.slide_contents.length > 0 &&
        state.slide_contents.every(s => s !== null)) slidesStatus = 'done';
  } catch(e) {}

  function statusBadge(s) {
    if (s === 'done') return '<span class="text-xs text-green-600 font-medium flex items-center gap-1"><span class="material-symbols-outlined" style="font-size:14px;font-variation-settings:\'FILL\' 1;">check_circle</span>Ready</span>';
    if (s === 'running') return '<span class="text-xs text-blue-600 font-medium flex items-center gap-1 animate-pulse"><span class="material-symbols-outlined" style="font-size:14px;">sync</span>Generating...</span>';
    if (s === 'error') return '<span class="text-xs text-red-600 font-medium flex items-center gap-1"><span class="material-symbols-outlined" style="font-size:14px;">error</span>Failed — click to retry</span>';
    return '<span class="text-xs text-slate-400">Click to generate</span>';
  }

  const overlay = document.createElement('div');
  overlay.className = 'lesson-format-overlay fixed inset-0 bg-black/30 flex items-center justify-center z-[100]';
  overlay.innerHTML = `
    <div class="bg-white rounded-3xl p-8 max-w-md mx-4 shadow-xl">
      <h3 class="font-headline font-bold text-lg text-on-surface mb-2">Choose Format</h3>
      <p class="font-body text-sm text-on-surface-variant mb-6">Select a lesson format. You can generate both!</p>
      <div class="flex gap-4">
        <button id="chooseMarkdown" class="flex-1 flex flex-col items-center gap-3 p-6 rounded-2xl border-2 ${lessonStatus === 'done' ? 'border-green-300 bg-green-50' : 'border-slate-200 hover:border-primary hover:bg-primary/5'} transition-all cursor-pointer">
          <span class="material-symbols-outlined text-3xl text-primary">article</span>
          <span class="font-headline font-bold text-sm">Markdown</span>
          ${statusBadge(lessonStatus)}
        </button>
        <button id="chooseSlides" class="flex-1 flex flex-col items-center gap-3 p-6 rounded-2xl border-2 ${slidesStatus === 'done' ? 'border-green-300 bg-green-50' : 'border-slate-200 hover:border-primary hover:bg-primary/5'} transition-all cursor-pointer">
          <span class="material-symbols-outlined text-3xl text-primary">slideshow</span>
          <span class="font-headline font-bold text-sm">PPT Slides</span>
          ${statusBadge(slidesStatus)}
        </button>
      </div>
      <button id="cancelFormatChoice" class="w-full mt-4 text-sm text-on-surface-variant hover:bg-slate-100 py-2.5 rounded-xl transition-colors">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
  document.getElementById('cancelFormatChoice').addEventListener('click', function() { overlay.remove(); });
  document.getElementById('chooseMarkdown').addEventListener('click', function() {
    overlay.remove();
    window.location.href = 'lesson.html?session_id=' + sid;
  });
  document.getElementById('chooseSlides').addEventListener('click', function() {
    overlay.remove();
    window.location.href = 'slides.html?session_id=' + sid;
  });
}

// On load: always rebuild conversation from state when session_id exists
(async function init() {
  const chatHistory = document.getElementById('chatHistory');
  chatHistory.innerHTML = '';
  document.getElementById('suggestBtns').innerHTML = '';

  const params = new URLSearchParams(window.location.search);
  const sid = params.get('session_id');

  if (!sid) return;

  currentSessionId = sid;
  const state = await getSessionState(sid);

  // Restore active skill from state (so badges render during reconstruction)
  if (state.active_skill) {
    if (!_cachedSkills) _cachedSkills = await fetchSkills();
    _activeSkillInfo = (_cachedSkills || []).find(s => s.name === state.active_skill) || null;
  }

  // Rebuild conversation: topic → graph → diagnosis → lesson button
  if (state.topic) {
    // User message with skill badge if active
    const userBadge = _activeSkillInfo ? buildSkillBadge({..._activeSkillInfo, current_section: null}) : '';
    chatHistory.innerHTML += `
      <div class="flex justify-end">
        <div class="bg-surface-container-low px-6 py-4 rounded-3xl rounded-tr-none max-w-[85%] text-on-surface shadow-sm">
          <p class="font-body leading-relaxed">${userBadge ? `<span style="vertical-align:middle;margin-right:4px;">${userBadge}</span>` : ''}我想学习${escapeHtml(state.topic)}</p>
        </div>
      </div>`;

    if (state.graph) {
      renderKnowledgeGraph({ data: { graph: state.graph }, message: `我已经为你梳理了「${state.topic}」的知识图谱。`, session_id: sid });
    }
  }

  if (state.diagnosis_result) {
    renderDiagnosisResults(state.diagnosis_result, sid);
  }

  // No lesson card — Start Learning button on diagnosis card handles both formats

  // Render remaining chat messages
  if (state.messages && state.messages.length > 0) {
    let startIdx = 0;
    for (let i = state.messages.length - 1; i >= 0; i--) {
      const msg = state.messages[i];
      if (msg.role === 'ai') {
        const content = msg.content || '';
        if (content.includes('知识图谱') || content.includes('开始作答') ||
            content.includes('诊断完成') || content.includes('已掌握') ||
            content.length > 1000) {
          startIdx = i + 1;
          break;
        }
      }
    }

    for (let i = startIdx; i < state.messages.length; i++) {
      const msg = state.messages[i];
      if (msg.role === 'user') {
        chatHistory.innerHTML += `
          <div class="flex justify-end">
            <div class="bg-surface-container-low px-6 py-4 rounded-3xl rounded-tr-none max-w-[85%] text-on-surface shadow-sm">
              <p class="font-body leading-relaxed">${escapeHtml(msg.content)}</p>
            </div>
          </div>`;
      } else if (msg.role === 'ai') {
        const badge = buildSkillBadge(_activeSkillInfo ? {..._activeSkillInfo, current_section: 'chat'} : null);
        const msgIdx = _msgStore.length;
        _msgStore.push({ text: msg.content, raw: null });
        chatHistory.innerHTML += `
          <div class="flex gap-4 msg-wrapper">
            <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
            </div>
            <div class="flex-grow">
              ${badge}
              <div class="prose prose-slate max-w-none font-body text-on-surface-variant leading-relaxed">${safeMarkdown(msg.content)}</div>
              <div class="msg-actions">
                <button class="msg-action" data-copy-idx="${msgIdx}" title="Copy">
                  <span class="material-symbols-outlined" style="font-size:18px;">content_copy</span>
                </button>
              </div>
            </div>
          </div>`;
      }
    }
  }

  // Initialize all knowledge graph vis.js instances AFTER all innerHTML is done
  // Use setTimeout to ensure DOM has fully updated after innerHTML operations
  // 500ms ensures all async state fetches and DOM updates are complete
  setTimeout(initAllGraphs, 500);
})();
</script>

<script>
// Message store for copy/regenerate
const _msgStore = [];

// Copy + regenerate handlers (delegated)
document.addEventListener('click', function(e) {
  const copyBtn = e.target.closest('[data-copy-idx]');
  if (copyBtn) {
    const msg = _msgStore[+copyBtn.dataset.copyIdx];
    if (msg) {
      navigator.clipboard.writeText(msg.text).then(() => {
        const icon = copyBtn.querySelector('.material-symbols-outlined');
        icon.textContent = 'check';
        setTimeout(() => { icon.textContent = 'content_copy'; }, 1500);
      });
    }
    return;
  }
  const regenBtn = e.target.closest('[data-regen-idx]');
  if (regenBtn) {
    const idx = +regenBtn.dataset.regenIdx;
    const msg = _msgStore[idx];
    if (!msg || !msg.raw) return;

    // Find the content element in the same message wrapper
    const wrapper = regenBtn.closest('.msg-wrapper');
    const contentEl = wrapper.querySelector('.prose');
    if (!contentEl) return;

    // Clear and re-stream in place
    contentEl.innerHTML = '<span class="stream-cursor"></span>';
    let newText = '';

    const body = { message: msg.raw };
    if (currentSessionId) body.session_id = currentSessionId;

    streamSSE(`${API_BASE}/chat/stream`, body, {
      token(d) {
        newText += d.content;
        contentEl.innerHTML = safeMarkdown(newText) + '<span class="stream-cursor"></span>';
      },
      done(d) {
        contentEl.innerHTML = safeMarkdown(newText);
        _msgStore[idx].text = newText;
      },
      complete(d) {
        if (d.message) {
          contentEl.innerHTML = safeMarkdown(d.message);
          _msgStore[idx].text = d.message;
        }
      },
      error(d) {
        contentEl.innerHTML = `<span class="text-error">${escapeHtml(d.message || 'Regeneration failed')}</span>`;
      },
      skill() {},
      start() {},
    });
    return;
  }
});

// Close skill popup when clicking outside
document.addEventListener('click', function(e) {
  const popup = document.getElementById('skillPopup');
  const input = document.getElementById('chatInput');
  if (popup && !popup.contains(e.target) && e.target !== input) {
    popup.style.display = 'none';
  }
});

let sidebarOpen = true;
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('mainContent');
  const bottom = document.getElementById('bottomBar');
  const icon = document.getElementById('collapseIcon');
  if (sidebarOpen) {
    sidebar.style.marginLeft = '0';
    main.style.marginLeft = '16rem';
    bottom.style.left = '16rem';
    icon.textContent = 'chevron_left';
  } else {
    sidebar.style.marginLeft = '-15rem';
    main.style.marginLeft = '0';
    bottom.style.left = '0';
    icon.textContent = 'chevron_right';
  }
}
</script>
