<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LearningMAP</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'] },
    },
  },
}
</script>
<style>
:root {
  --bg: #FAF9F7;
  --bg-sidebar: #F0EDE8;
  --border: #EAE6E0;
  --border-input: #E0DDD8;
  --accent: #CF6833;
  --accent-light: #FFF3EC;
  --accent-border: #F5D5BF;
  --accent-dark: #9E4A2A;
  --text: #1a1a1a;
  --text-2: #4a4a4a;
  --text-3: #888;
  --text-4: #B0A898;
  --user-bubble: #EDE9E3;
  --error: #DC2626;
  --success: #059669;
}
* { box-sizing: border-box; }
body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); margin: 0; }

/* ── Sidebar ── */
#sidebar {
  width: 210px; height: 100vh; position: fixed; left: 0; top: 0;
  background: var(--bg-sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 16px 12px; gap: 4px;
  z-index: 40; transition: width 0.2s;
}
#sidebar.collapsed { width: 0; padding: 0; overflow: hidden; }
.sidebar-logo { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin-bottom: 8px; }
.sidebar-logo-icon {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  display: flex; align-items: center; justify-content: center;
  color: white;
}
.sidebar-logo-text { font-size: 13px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
.new-session-btn {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border: 1.5px dashed #D4CFC8; border-radius: 8px; background: transparent;
  font-size: 13px; font-weight: 500; color: var(--text-3); cursor: pointer;
  margin-bottom: 12px; transition: all .15s; width: 100%;
}
.new-session-btn:hover { background: white; border-color: #bbb; }
.sidebar-section-label {
  font-size: 10px; font-weight: 600; color: var(--text-4);
  letter-spacing: .06em; text-transform: uppercase;
  padding: 0 8px; margin: 8px 0 4px;
}
.session-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-radius: 7px; font-size: 13px; color: var(--text-3); cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .1s;
}
.session-item:hover { background: #E8E4DE; }
.session-item.active {
  background: white; color: var(--text); font-weight: 500;
  box-shadow: 0 1px 3px rgba(0,0,0,.07);
}
.session-dot { width: 6px; height: 6px; border-radius: 50%; background: #D4CFC8; flex-shrink: 0; }
.session-dot.orange { background: var(--accent); }
.sidebar-status-tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--accent-light); border: 1px solid var(--accent-border);
  color: var(--accent-dark); font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 99px; margin-left: auto; flex-shrink: 0;
}

/* ── Top Nav ── */
#topNav {
  height: 50px; position: fixed; top: 0; left: 210px; right: 0; z-index: 30;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  transition: left 0.2s;
}
body.sidebar-collapsed #topNav { left: 0; }
.topnav-left { display: flex; align-items: center; gap: 8px; }
.topnav-title { font-size: 14px; font-weight: 600; color: var(--text); }
.topnav-skill-pill {
  display: flex; align-items: center; gap: 5px;
  background: var(--accent-light); border: 1px solid var(--accent-border);
  color: var(--accent-dark); font-size: 11px; font-weight: 600;
  padding: 4px 10px; border-radius: 99px; cursor: pointer;
}
.topnav-skill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.mode-toggle {
  display: inline-flex; align-items: center; gap: 0;
  background: var(--user-bubble); border-radius: 99px;
  padding: 2px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--border-input); user-select: none;
}
.mode-toggle button {
  background: transparent; border: none; padding: 4px 12px;
  border-radius: 99px; cursor: pointer; color: var(--text-3);
  transition: background .15s, color .15s;
}
.mode-toggle button.active {
  background: var(--accent-light); color: var(--accent-dark);
}
.mode-toggle button:disabled {
  opacity: 0.5; cursor: wait;
}

/* ── Main Content ── */
#mainContent {
  margin-left: 210px; padding-top: 50px; min-height: 100vh;
  display: flex; flex-direction: column; transition: margin-left 0.2s;
}
body.sidebar-collapsed #mainContent { margin-left: 0; }

/* ── Chat Area ── */
#chatArea { flex: 1; padding: 24px 32px 120px; display: flex; flex-direction: column; gap: 20px; max-width: 760px; width: 100%; margin: 0 auto; }
.user-msg { display: flex; justify-content: flex-end; }
.user-bubble {
  background: var(--user-bubble); border-radius: 18px 18px 4px 18px;
  padding: 10px 16px; max-width: 70%; font-size: 13.5px; color: var(--text-2); line-height: 1.55;
}
.ai-msg { display: flex; gap: 12px; }
.ai-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 13px; font-weight: 700;
}
.ai-content { flex: 1; }
.ai-name { font-size: 11px; font-weight: 600; color: var(--text-4); margin-bottom: 5px; letter-spacing: .03em; text-transform: uppercase; }
.ai-text { font-size: 13.5px; color: var(--text-2); line-height: 1.65; }
.ai-text strong { color: var(--text); font-weight: 600; }

/* Knowledge graph card */
.kg-card { background: white; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-top: 8px; }
.kg-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.kg-title { font-size: 13px; font-weight: 600; color: var(--text); }
.kg-badge { font-size: 11px; color: var(--accent); background: var(--accent-light); padding: 2px 8px; border-radius: 99px; font-weight: 600; border: 1px solid var(--accent-border); }
.kg-footer { padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
.kg-legend { display: flex; gap: 12px; }
.kg-legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-3); }
.kg-legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.kg-start-btn {
  background: var(--accent); color: white;
  font-size: 12px; font-weight: 600; padding: 6px 16px;
  border-radius: 99px; border: none; cursor: pointer; transition: background .15s;
}
.kg-start-btn:hover { background: var(--accent-dark); }

/* ── Input Bar ── */
#bottomBar {
  position: fixed; bottom: 0; left: 210px; right: 0; z-index: 30;
  padding: 12px 20px 16px; background: var(--bg);
  border-top: 1px solid var(--border); transition: left 0.2s;
}
body.sidebar-collapsed #bottomBar { left: 0; }
.input-outer { max-width: 720px; margin: 0 auto; position: relative; }
.input-wrap {
  background: white; border: 1.5px solid var(--border-input); border-radius: 14px;
  padding: 10px 14px; display: flex; align-items: flex-end; gap: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}
.input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(207,104,51,.1); }
#chatInput {
  flex: 1; font-size: 13px; color: var(--text); font-family: 'Inter', sans-serif;
  border: none; outline: none; resize: none; background: transparent; min-height: 34px; max-height: 160px;
}
#chatInput::placeholder { color: var(--text-4); }
.send-btn {
  width: 34px; height: 34px; background: var(--accent); border-radius: 10px; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; color: white; transition: background .15s;
}
.send-btn:hover { background: var(--accent-dark); }
.hint-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; max-width: 720px; margin-left: auto; margin-right: auto; }

/* ── Skill popup ── */
.skill-popup {
  position: absolute; bottom: 100%; left: 0; right: 0; margin-bottom: 8px;
  max-height: 360px; overflow-y: auto; background: white;
  border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,.1); z-index: 200;
}
.skill-item { padding: 12px 16px; display: flex; align-items: flex-start; gap: 10px; }
.skill-item:hover { background: #F7F5F2; }
.skill-item:not(:last-child) { border-bottom: 1px solid var(--border); }
.skill-item-main { flex: 1; cursor: pointer; }
.skill-item-actions { display: flex; gap: 2px; flex-shrink: 0; padding-top: 2px; }
.skill-action-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: none; background: transparent; cursor: pointer; color: var(--text-4); transition: all .15s; }
.skill-action-btn:hover { background: var(--border); color: var(--text-3); }

/* ── Skill modal ── */
.skill-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; z-index: 300; }
.skill-modal { background: white; border-radius: 14px; padding: 0; max-width: 560px; width: 90%; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.skill-modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.skill-modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; color: var(--text-2); }

/* ── Prose / Markdown ── */
.prose h3 { font-weight: 700; margin: 1rem 0 0.5rem; color: var(--text); }
.prose p { margin: 0.5rem 0; }
.prose ul, .prose ol { padding-left: 1.5rem; margin: 0.5rem 0; }
.prose li { margin: 0.25rem 0; }
.prose strong { color: var(--text); }
.prose code { background: var(--bg-sidebar); padding: .1rem .35rem; border-radius: .25rem; font-size: .85em; }
.prose blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; color: var(--text-3); margin: .5rem 0; }

/* ── Message actions ── */
.msg-actions { display: flex; gap: 4px; margin-top: 6px; opacity: 0; transition: opacity .15s; }
.msg-wrapper:hover .msg-actions { opacity: 1; }
.msg-action { border: none; background: transparent; cursor: pointer; padding: 4px; color: var(--text-4); transition: color .15s; }
.msg-action:hover { color: var(--text-3); }

/* ── Streaming cursor ── */
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.stream-cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); margin-left: 2px; vertical-align: text-bottom; animation: blink .8s step-end infinite; }
.thinking-word     { transition: opacity 280ms ease; display: inline-block; }
.thinking-word.is-swapping { opacity: 0; }
.thinking-timer    { opacity: 0.55; font-variant-numeric: tabular-nums; }

/* ── Sidebar collapse button ── */
#collapseBtn {
  position: absolute; top: 50%; transform: translateY(-50%); right: -12px;
  width: 24px; height: 48px; background: white; border: 1px solid var(--border);
  border-radius: 0 6px 6px 0; display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 50; box-shadow: 1px 0 4px rgba(0,0,0,.06);
}
#collapseBtn:hover { background: var(--bg-sidebar); }

/* ── no-scrollbar ── */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

/* ── Skill badge ── */
.skill-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-light); border: 1px solid var(--accent-border); color: var(--accent-dark); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; cursor: pointer; transition: background .15s; }
.skill-badge:hover { background: var(--accent-border); }

/* ── CTA card ── */
.cta-card {
  display: flex; align-items: center; gap: 10px;
  margin-top: 8px; padding: 10px 14px;
  background: var(--accent-light); border: 1px solid var(--accent-border);
  border-radius: 12px; font-size: 13px; color: var(--accent-dark);
}
.cta-card .cta-text { flex: 1; }
.cta-btn {
  background: var(--accent); color: white; border: none;
  padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
  cursor: pointer; flex-shrink: 0;
}
.cta-btn:hover { background: var(--accent-dark); }
.cta-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* ── Hint chips ── */
.hint-chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--border); background: white; font-size: 12px; color: var(--text-3); cursor: pointer; transition: all .15s; white-space: nowrap; }
.hint-chip:hover { background: var(--bg-sidebar); border-color: var(--accent-border); color: var(--text-2); }

/* ── Hero Landing ────────────────────────────────────────────────────────── */
#heroLanding { display: none; }

body.is-fresh-landing #chatArea,
body.is-fresh-landing #reviewBanner { display: none; }

body.is-fresh-landing #heroLanding {
  display: flex;
  flex: 1;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 32px;
  width: 100%;
}

.hero-inner {
  display: flex;
  flex-direction: column;
  gap: 28px;
  width: 100%;
  max-width: 720px;
}

.hero-headline-row {
  display: flex;
  align-items: center;
  gap: 18px;
}

.hero-mark.material-symbols-outlined {
  font-size: 48px;
  color: var(--text);
  font-variation-settings: 'wght' 300, 'FILL' 0;
  flex-shrink: 0;
}

.hero-headline {
  font-family: 'EB Garamond', 'Source Serif Pro', Georgia, 'Times New Roman', serif;
  font-size: clamp(34px, 5vw, 58px);
  font-weight: 500;
  line-height: 1.1;
  letter-spacing: -0.012em;
  color: var(--text);
  margin: 0;
}

body.is-fresh-landing #bottomBar {
  position: static;
  left: auto; right: auto; bottom: auto;
  background: transparent;
  border-top: none;
  padding: 0;
  width: 100%;
}

body.is-fresh-landing #bottomBar .hint-row {
  margin-top: 12px;
  justify-content: flex-start;
}
</style>
</head>
<body>
<nav id="topNav">
  <div class="topnav-left">
    <span class="topnav-title" id="topNavTitle">LearningMAP</span>
    <div class="mode-toggle" id="modeToggle" role="group" aria-label="Session mode">
      <button type="button" id="modeToggleChat" data-mode="chat" class="active" aria-pressed="true">Chat</button>
      <button type="button" id="modeToggleLearning" data-mode="learning" aria-pressed="false">Learning</button>
    </div>
    <span id="topNavSkillPill" class="topnav-skill-pill" style="display:none;" onclick="showSkillModal(_activeSkillInfo?.name)">
      <span class="topnav-skill-dot"></span>
      <span id="topNavSkillName"></span>
    </span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;" id="topNavActions"></div>
</nav>
<aside id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon"><span class="material-symbols-outlined" style="font-size:18px;">school</span></div>
    <span class="sidebar-logo-text">LearningMAP</span>
  </div>
  <button class="new-session-btn" onclick="createNewSession()">
    <span class="material-symbols-outlined" style="font-size:16px;">add</span>
    New Chat
  </button>
  <div style="flex:1;overflow-y:auto;" id="session-list"></div>
  <button onclick="toggleSidebar()" id="collapseBtn">
    <span class="material-symbols-outlined" style="font-size:14px;color:var(--text-4);" id="collapseIcon">chevron_left</span>
  </button>
</aside>
<script src="sidebar.js?v=3"></script>
<script src="api.js?v=8"></script>
<main id="mainContent">
  <section id="heroLanding" aria-label="Start a new session">
    <div class="hero-inner">
      <div class="hero-headline-row">
        <span class="hero-mark material-symbols-outlined" aria-hidden="true">auto_stories</span>
        <h1 class="hero-headline" id="heroHeadline"></h1>
      </div>
      <!-- #bottomBar gets appended here at runtime when is-fresh-landing is active -->
    </div>
  </section>
  <div id="chatArea">
    <div id="reviewBanner" style="display:none;"></div>
    <div id="chatHistory"></div>
  </div>
</main>
<div id="bottomBar">
  <div class="input-outer">
    <div class="input-wrap">
      <textarea id="chatInput" onkeydown="handleInputKeydown(event)" oninput="handleInputChange(event)" rows="1"
        placeholder="Enter a topic to learn, or use /skill to choose a teaching method…"></textarea>
      <div id="skillPopup" class="skill-popup" style="display:none;"></div>
      <button class="send-btn" onclick="handleSend()">
        <span class="material-symbols-outlined" style="font-size:18px;">arrow_upward</span>
      </button>
    </div>
  </div>
  <div class="hint-row no-scrollbar" id="suggestBtns"></div>
</div>
<script>
let currentSessionId = getSessionId();
let messageCount = 0;
let _cachedSkills = null;
let _activeSkillInfo = null; // {name, display_name, body, current_section}
let _knowledgeSkills = null; // {knowledge_point_name: skill_text}
let _sessionMode = 'chat';   // hydrated from /state on load
let _pendingMode = null;      // chosen before session_id exists
let _chatMessages = [];         // chat-track message cache, hydrated from /state
let _learningMessages = [];     // learning-track message cache, hydrated from /state
let _learningArtifacts = null;  // {graph, diagnosis_result, lesson_content, slide_contents} cache
let _sendInFlight = false;      // SSE stream in progress — toggle disabled
const _msgStore = [];           // copy/regen store; reset by clearChatHistory on each rebuild

const THINKING_WORDS = [
  'Reasoning', 'Reviewing', 'Synthesizing', 'Reflecting',
  'Considering', 'Connecting', 'Mapping', 'Weighing',
];

function startThinkingAnimator(rootEl) {
  const wordEl  = rootEl.querySelector('.thinking-word');
  const timerEl = rootEl.querySelector('.thinking-timer');
  if (!wordEl || !timerEl) return () => {}; // defensive: nothing to animate
  const startedAt = performance.now();
  let i = Math.floor(Math.random() * THINKING_WORDS.length);
  wordEl.textContent = THINKING_WORDS[i];
  timerEl.textContent = '(0s)';

  const wordIv = setInterval(() => {
    wordEl.classList.add('is-swapping');
    setTimeout(() => {
      i = (i + 1) % THINKING_WORDS.length;
      wordEl.textContent = THINKING_WORDS[i];
      wordEl.classList.remove('is-swapping');
    }, 280);
  }, 2000);

  const timerIv = setInterval(() => {
    const s = Math.floor((performance.now() - startedAt) / 1000);
    timerEl.textContent = `(${s}s)`;
  }, 1000);

  let stopped = false;
  return function stop() {
    if (stopped) return;
    stopped = true;
    clearInterval(wordIv);
    clearInterval(timerIv);
  };
}

function _renderModeToggle(mode) {
  _sessionMode = mode;
  document.querySelectorAll('#modeToggle button').forEach(btn => {
    const isActive = btn.dataset.mode === mode;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
  });
}

async function _handleModeToggleClick(targetMode) {
  if (_sendInFlight) return;
  if (targetMode === _sessionMode) return;
  exitFreshLanding();
  const buttons = document.querySelectorAll('#modeToggle button');
  buttons.forEach(b => (b.disabled = true));
  const previous = _sessionMode;
  _renderModeToggle(targetMode);  // optimistic
  try {
    if (currentSessionId) {
      await setSessionMode(currentSessionId, targetMode);
      const fresh = await getSessionState(currentSessionId);
      _chatMessages = fresh.chat_messages || [];
      _learningMessages = fresh.messages || [];
      _learningArtifacts = {
        topic: fresh.topic,
        graph: fresh.graph,
        diagnosis_result: fresh.diagnosis_result,
        lesson_content: fresh.lesson_content,
        slide_contents: fresh.slide_contents,
      };
      renderActiveView(targetMode);
    } else {
      _pendingMode = targetMode;
      renderActiveView(targetMode);  // local-only render (empty state likely)
    }
  } catch (e) {
    _renderModeToggle(previous);  // roll back
    console.error('setSessionMode failed', e);
  } finally {
    buttons.forEach(b => (b.disabled = false));
  }
}

document.getElementById('modeToggle')?.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (btn) _handleModeToggleClick(btn.dataset.mode);
});

// Input handler: detect /skill and show popup
function handleInputKeydown(e) {
  const popup = document.getElementById('skillPopup');
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (popup.style.display !== 'none') return;
    handleSend();
  } else if (e.key === 'Escape') {
    popup.style.display = 'none';
  }
  // Auto-resize textarea
  requestAnimationFrame(() => {
    const el = e.target;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  });
}

async function handleInputChange(e) {
  // Auto-resize textarea
  const el = e.target;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';

  const val = e.target.value;
  const popup = document.getElementById('skillPopup');

  if (val.trim() === '/skill' || val.trim() === '/skill ') {
    if (!_cachedSkills) _cachedSkills = await fetchSkills();
    if (_cachedSkills.length === 0) {
      popup.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--text-3);">No teaching methods available</div>';
    } else {
      popup.innerHTML = _cachedSkills.map((s, i) => `
        <div class="skill-item">
          <div class="skill-item-main" data-skill-idx="${i}">
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="material-symbols-outlined" style="color:var(--accent);font-size:16px;">psychology</span>
              <span style="font-size:13px;font-weight:700;color:var(--text);">${escapeHtml(s.display_name)}</span>
            </div>
            <p style="font-size:11px;color:var(--text-3);margin-top:4px;">${escapeHtml(s.description)}</p>
          </div>
          <div class="skill-item-actions">
            <button class="skill-action-btn" data-info-idx="${i}" title="View details">
              <span class="material-symbols-outlined" style="font-size:16px;">info</span>
            </button>
            <button class="skill-action-btn" data-delete-idx="${i}" title="Delete">
              <span class="material-symbols-outlined" style="font-size:16px;">delete</span>
            </button>
          </div>
        </div>
      `).join('') + `
        <div class="skill-item" style="border-top:1px solid var(--border);">
          <div class="skill-item-main" data-clear-skill="1">
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="material-symbols-outlined" style="font-size:16px;color:var(--text-4);">refresh</span>
              <span style="font-size:13px;color:var(--text-3);">Reset to default (Feynman Technique)</span>
            </div>
          </div>
        </div>`;
    }
    // Bind events via delegation (no inline onclick — avoids XSS)
    popup.onclick = function(e) {
      const main = e.target.closest('[data-skill-idx]');
      const info = e.target.closest('[data-info-idx]');
      const del = e.target.closest('[data-delete-idx]');
      const clr = e.target.closest('[data-clear-skill]');
      if (info) { e.stopPropagation(); showSkillModal(_cachedSkills[+info.dataset.infoIdx]); return; }
      if (del) { e.stopPropagation(); deleteSkillFile(_cachedSkills[+del.dataset.deleteIdx].name); return; }
      if (clr) { clearSkill(); return; }
      if (main) { selectSkill(_cachedSkills[+main.dataset.skillIdx].name); return; }
    };
    popup.style.display = 'block';
  } else {
    popup.style.display = 'none';
  }
}

function formatSkillBody(body, activeSection) {
  // Pre-process: mark active section header, then render as markdown
  const processed = body.split('\n').map(line => {
    const hm = line.match(/^## (.+)/);
    if (hm && activeSection && hm[1].trim().toLowerCase().replace(/\s+/g, '_') === activeSection) {
      return `## 🔵 ${hm[1]}`;
    }
    return line;
  }).join('\n');
  return safeMarkdown(processed);
}

function showSkillModal(nameOrInfo, highlightSection) {
  let skill;
  if (typeof nameOrInfo === 'string') {
    skill = (_cachedSkills || []).find(s => s.name === nameOrInfo);
  } else {
    skill = nameOrInfo;
  }
  if (!skill) return;

  // Remove any existing modal (prevent stacking)
  document.querySelector('.skill-modal-overlay')?.remove();

  const body = formatSkillBody(skill.body || '', highlightSection || null);
  const overlay = document.createElement('div');
  overlay.className = 'skill-modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.innerHTML = `
    <div class="skill-modal">
      <div class="skill-modal-header">
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="material-symbols-outlined" style="color:var(--accent);font-size:20px;">psychology</span>
            <span style="font-size:16px;font-weight:700;color:var(--text);">${escapeHtml(skill.display_name || skill.name)}</span>
          </div>
          <p style="font-size:11px;color:var(--text-3);margin-top:4px;">${escapeHtml(skill.description || '')}</p>
        </div>
        <button class="skill-modal-close" style="padding:4px;cursor:pointer;border:none;background:transparent;border-radius:6px;">
          <span class="material-symbols-outlined" style="color:var(--text-4);">close</span>
        </button>
      </div>
      <div class="skill-modal-body prose">${body}</div>
    </div>`;

  // Close handlers
  const closeModal = () => { overlay.remove(); document.removeEventListener('keydown', escHandler); };
  const escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  overlay.querySelector('.skill-modal-close').addEventListener('click', closeModal);
  document.addEventListener('keydown', escHandler);
  document.body.appendChild(overlay);
}

function showModal(title, bodyHtml) {
  document.querySelector('.skill-modal-overlay')?.remove();
  const overlay = document.createElement('div');
  overlay.className = 'skill-modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.innerHTML = `
    <div class="skill-modal">
      <div class="skill-modal-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="material-symbols-outlined" style="color:var(--accent);font-size:20px;">lightbulb</span>
          <span style="font-size:16px;font-weight:700;color:var(--text);">${escapeHtml(title)}</span>
        </div>
        <button class="skill-modal-close" style="padding:4px;cursor:pointer;border:none;background:transparent;border-radius:6px;">
          <span class="material-symbols-outlined" style="color:var(--text-4);">close</span>
        </button>
      </div>
      <div class="skill-modal-body prose">${bodyHtml}</div>
    </div>`;
  const closeModal = () => { overlay.remove(); document.removeEventListener('keydown', escHandler); };
  const escHandler = (e) => { if (e.key === 'Escape') closeModal(); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  overlay.querySelector('.skill-modal-close').addEventListener('click', closeModal);
  document.addEventListener('keydown', escHandler);
  document.body.appendChild(overlay);
}

function deleteSkillFile(name) {
  // Skills are file-based, cannot delete via API in MVP
  alert(`Skill "${name}" is a filesystem SKILL.md — delete it manually on the server at skills/${name}/SKILL.md`);
}

async function selectSkill(name) {
  const popup = document.getElementById('skillPopup');
  const input = document.getElementById('chatInput');
  popup.style.display = 'none';

  _activeSkillInfo = (_cachedSkills || []).find(s => s.name === name) || null;
  input.value = `/skill ${name} `;
  input.focus();
}

async function clearSkill() {
  const popup = document.getElementById('skillPopup');
  const input = document.getElementById('chatInput');
  popup.style.display = 'none';
  input.value = '';

  if (currentSessionId) {
    try {
      const result = await setSkill(currentSessionId, 'feynman');
      _activeSkillInfo = (_cachedSkills || []).find(s => s.name === 'feynman') || null;
    } catch (err) {
      console.error('Reset to feynman failed', err);
    }
  } else {
    _activeSkillInfo = (_cachedSkills || []).find(s => s.name === 'feynman') || null;
  }
  input.focus();
}

function buildSkillBadge(skillInfo) {
  if (!skillInfo) return '';
  const displayName = skillInfo.display_name || skillInfo.name || '';
  if (!displayName) return '';
  // Store skill info in a global registry keyed by index to avoid inline JS
  const idx = _badgeSkillStore.length;
  _badgeSkillStore.push({...skillInfo});
  return `
    <div class="skill-badge" data-badge-idx="${idx}" style="margin-bottom:8px;">
      <span class="material-symbols-outlined" style="font-size:14px;">psychology</span>
      ${escapeHtml(displayName)}
    </div>`;
}

function buildKnowledgeSkillBadge(knowledgeSkills) {
  if (!knowledgeSkills || Object.keys(knowledgeSkills).length === 0) return '';
  const count = Object.keys(knowledgeSkills).length;
  const idx = _ksBadgeStore.length;
  _ksBadgeStore.push(knowledgeSkills);
  return `
    <div class="ks-badge" data-ks-idx="${idx}" style="margin-bottom:8px;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:9999px;font-size:12px;background:#F0FDF4;color:#15803D;cursor:pointer;">
      <span class="material-symbols-outlined" style="font-size:14px;">lightbulb</span>
      ${count} knowledge-point skill${count !== 1 ? 's' : ''}
    </div>`;
}

function buildCtaCard(additionalKwargs) {
  const cta = additionalKwargs && additionalKwargs.cta;
  if (!cta || cta.type !== 'learn_topic' || !cta.topic) return '';
  const safeTopic = escapeHtml(cta.topic);
  return `
    <div class="cta-card">
      <span class="material-symbols-outlined" style="font-size:18px;">school</span>
      <div class="cta-text">Want to study "<strong>${safeTopic}</strong>" systematically?</div>

}

function clearChatHistory() {
  document.getElementById('chatHistory').innerHTML = '';

  // Pushers (renderActiveView and the SSE done() handler) repopulate fresh.
  _msgStore.length = 0;

function appendUserMessageDOM(content) {

// ─── Hero landing (fresh-session homepage) ────────────────────────────────
let _isFreshLanding = false;

function computeHeroGreeting() {
  const h = new Date().getHours();
  if (h >= 6  && h < 11) return 'Morning — what shall we learn today?';
  if (h >= 11 && h < 17) return 'Afternoon — what shall we learn next?';
  if (h >= 17 && h < 23) return 'Evening — what shall we learn tonight?';
  return "Late night — still curious? Let's learn.";
}

function renderHeroStarterChips() {
  const chips = [
    { label: '✨ Photosynthesis',                 fill: 'Photosynthesis' },
    { label: '✨ Linear algebra basics',          fill: 'Linear algebra basics' },
    { label: '🔍 Diagnose what I already know',   fill: 'Diagnose what I already know' },
    { label: '/skill  Pick a teaching method',    fill: '/skill ' },
  ];
  const slot = document.getElementById('suggestBtns');
  slot.innerHTML = chips.map((c, i) =>
    `<button class="hint-chip" data-hero-chip="${i}">${escapeHtml(c.label)}</button>`
  ).join('');
  slot.querySelectorAll('[data-hero-chip]').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = chips[Number(btn.dataset.heroChip)];
      const input = document.getElementById('chatInput');
      input.value = c.fill;
      input.focus();
      if (c.fill.startsWith('/skill')) handleInputChange({ target: input });
    });

}

function enterFreshLanding() {
  if (_isFreshLanding) return;
  _isFreshLanding = true;
  document.body.classList.add('is-fresh-landing');
  document.getElementById('heroHeadline').textContent = computeHeroGreeting();
  const hero = document.querySelector('#heroLanding .hero-inner');
  const bar  = document.getElementById('bottomBar');
  if (bar.parentElement !== hero) hero.appendChild(bar);
  renderHeroStarterChips();
  document.getElementById('chatInput').focus();
}

function exitFreshLanding() {
  if (!_isFreshLanding) return;
  _isFreshLanding = false;
  document.body.classList.remove('is-fresh-landing');
  const bar = document.getElementById('bottomBar');
  if (bar.parentElement !== document.body) document.body.appendChild(bar);
  document.getElementById('suggestBtns').innerHTML = '';
}

function maybeEnterFreshLanding() {
  if (_chatMessages.length === 0 &&
      _learningMessages.length === 0 &&
      _learningArtifactsEmpty()) {
    enterFreshLanding();
  } else {
    exitFreshLanding();
  }
}

function renderEmptyState(mode) {
  if (_isFreshLanding) return;
  const text = mode === 'chat'
    ? "Let's start a conversation — I can chat about any topic, or recommend a subject for structured learning."
    : 'Enter a topic you\'d like to learn and start structured study.';
  document.getElementById('chatHistory').innerHTML =
    `<div style="color:var(--text-3);font-size:13px;padding:24px;text-align:center;">${escapeHtml(text)}</div>`;
}

function _learningArtifactsEmpty() {
  return !_learningArtifacts || (
    !_learningArtifacts.graph &&
    !_learningArtifacts.diagnosis_result &&
    !_learningArtifacts.lesson_content &&
    !_learningArtifacts.slide_contents
  );
}

function renderArtifactsInline(artifacts, sid) {
  // Re-use existing renderers for each artifact type.
  // renderKnowledgeGraph and renderDiagnosisResults append directly to chatHistory.
  // lesson_content / slide_contents: the "Start Learning" button on the diagnosis
  // card handles navigation, so no extra button is needed here.
  if (artifacts.graph && artifacts.topic) {
    renderKnowledgeGraph({
      data: { graph: artifacts.graph },
      message: `Here is the knowledge graph for "${artifacts.topic}".`,
      session_id: sid,
      active_skill: _activeSkillInfo,
    });
  }
  if (artifacts.diagnosis_result) {
    renderDiagnosisResults(artifacts.diagnosis_result, sid);
  }
}

function renderActiveView(mode) {
  clearChatHistory();
  const sid = currentSessionId;
  const chatHistory = document.getElementById('chatHistory');

  if (mode === 'chat') {
    if (_chatMessages.length === 0) {
      renderEmptyState('chat');
      return;
    }
    for (const msg of _chatMessages) {
      if (msg.role === 'user') {
        appendUserMessageDOM(msg.content);
      } else {
        appendAiMessageDOM(msg.content, msg.additional_kwargs || {});
      }
    }
    return;
  }

  // learning mode — mirror the existing state-rebuild logic
  const hasMessages = _learningMessages && _learningMessages.length > 0;
  if (!hasMessages && _learningArtifactsEmpty()) {
    renderEmptyState('learning');
    return;
  }

  // Render topic + artifacts (graph → diagnosis) first
  if (_learningArtifacts && _learningArtifacts.topic) {
    chatHistory.insertAdjacentHTML('beforeend', `
      <div class="user-msg">
        <div class="user-bubble">Study ${escapeHtml(_learningArtifacts.topic)}</div>
      </div>`);
  }
  if (_learningArtifacts) {
    renderArtifactsInline(_learningArtifacts, sid);
  }

  // Render remaining chat messages (same startIdx heuristic as the original loop)
  if (hasMessages) {
    let startIdx = 0;
    for (let i = _learningMessages.length - 1; i >= 0; i--) {
      const msg = _learningMessages[i];
      if (msg.role === 'ai') {
        const content = msg.content || '';
        // English markers (new sessions) + legacy Chinese markers (old sessions in DB)
        if (content.includes('knowledge graph') || content.includes('Knowledge Graph') ||
            content.includes('quiz') || content.includes('diagnosis') ||
            content.includes('mastered') ||
            content.includes('知识图谱') || content.includes('开始作答') ||
            content.includes('诊断完成') || content.includes('已掌握') ||
            content.length > 1000) {
          startIdx = i + 1;
          break;
        }
      }
    }
    for (let i = startIdx; i < _learningMessages.length; i++) {
      const msg = _learningMessages[i];
      if (msg.role === 'user') {
        appendUserMessageDOM(msg.content);
      } else if (msg.role === 'ai') {
        const badge = buildSkillBadge(_activeSkillInfo ? {..._activeSkillInfo, current_section: 'chat'} : null);
        const msgIdx = _msgStore.length;
        _msgStore.push({ text: msg.content, raw: null });
        chatHistory.insertAdjacentHTML('beforeend', `
          <div class="ai-msg msg-wrapper">
            <div class="ai-avatar">A</div>
            <div class="ai-content">
              <div class="ai-name">Merlin</div>
              ${badge}
              <div class="ai-text prose">${safeMarkdown(msg.content)}</div>
              <div class="msg-actions">
                <button class="msg-action" data-copy-idx="${msgIdx}" title="Copy">
                  <span class="material-symbols-outlined" style="font-size:18px;">content_copy</span>
                </button>
              </div>
              ${buildCtaCard(msg.additional_kwargs || {})}
            </div>
          </div>`);
      }
    }
  }

  // Reinitialise vis.js graphs that were appended — 500ms gives the DOM
  // time to paint before vis.js measures container dimensions.
  setTimeout(initAllGraphs, 500);
}

// Copy + regenerate handlers (delegated)
document.addEventListener('click', function(e) {
  const copyBtn = e.target.closest('[data-copy-idx]');
  if (copyBtn) {
    const msg = _msgStore[+copyBtn.dataset.copyIdx];
    if (msg) {
      navigator.clipboard.writeText(msg.text).then(() => {
        const icon = copyBtn.querySelector('.material-symbols-outlined');
        icon.textContent = 'check';
        setTimeout(() => { icon.textContent = 'content_copy'; }, 1500);
      });
    }
    return;
  }
  const regenBtn = e.target.closest('[data-regen-idx]');
  if (regenBtn) {
    const idx = +regenBtn.dataset.regenIdx;
    const msg = _msgStore[idx];
    if (!msg || !msg.raw) return;

    // Find the content element in the same message wrapper
    const wrapper = regenBtn.closest('.msg-wrapper');
    const contentEl = wrapper.querySelector('.prose');
    if (!contentEl) return;

    // Clear and re-stream in place
    contentEl.innerHTML = '<span class="stream-cursor"></span>';
    let newText = '';

    const body = { message: msg.raw };
    if (currentSessionId) body.session_id = currentSessionId;

    streamSSE(`${API_BASE}/chat/stream`, body, {
      token(d) {
        newText += d.content;
        contentEl.innerHTML = safeMarkdown(newText) + '<span class="stream-cursor"></span>';
      },
      done(d) {
        contentEl.innerHTML = safeMarkdown(newText);
        _msgStore[idx].text = newText;
      },
      complete(d) {
        if (d.message) {
          contentEl.innerHTML = safeMarkdown(d.message);
          _msgStore[idx].text = d.message;
        }
      },
      error(d) {
        contentEl.innerHTML = `<span style="color:var(--error);">${escapeHtml(d.message || 'Regeneration failed')}</span>`;
      },
      skill() {},
      start() {},
    });
    return;
  }
});

async function handleSend(text) {
  exitFreshLanding();
  const input = document.getElementById('chatInput');
  const rawMessage = text || input.value.trim();
  if (!rawMessage) return;
  if (_sendInFlight) return;

  // Lock send immediately — before any DOM mutations or await calls.
  _sendInFlight = true;
  document.querySelectorAll('#modeToggle button').forEach(b => (b.disabled = true));

  input.value = '';
  input.style.height = 'auto'; // reset to single line

  // Handle /skill <name> prefix: extract skill, set it, send the rest as message
  let message = rawMessage;
  const skillMatch = rawMessage.match(/^\/skill\s+(\S+)\s+([\s\S]+)$/);
  if (skillMatch) {
    const skillName = skillMatch[1];
    message = skillMatch[2].trim();

    // Ensure session exists for set-skill
    if (!currentSessionId) {
      currentSessionId = crypto.randomUUID();
      setSessionId(currentSessionId);
    }

    try {
      const skillResp = await setSkill(currentSessionId, skillName);
      if (!_cachedSkills) _cachedSkills = await fetchSkills();
      _activeSkillInfo = (_cachedSkills || []).find(s => s.name === skillName) || null;
      // Auto-resume: if a topic was pending, send it as the message
      if (skillResp && skillResp.auto_resume && skillResp.topic) {
        message = `Study ${skillResp.topic}`;
      }
    } catch (err) {
      // Skill set failed, continue without skill
    }
  }

  // Capture user text for cache update after stream completes
  const userText = rawMessage;

  const chatHistory = document.getElementById('chatHistory');

  // Show user message as-is (no skill badge — skill info only on AI replies)
  appendUserMessageDOM(rawMessage);

  // Hoisted so catch/finally can clean up the in-flight response container.
  let respEl = null;
  let stopThinking = () => {};

  try {
    messageCount++;

    // Prepare streaming response container (initial content: rotating thinking indicator)
    const responseId = 'stream-resp-' + Date.now();
    let streamText = '';
    let streamBadge = '';
    let streamMode = 'chat';
    let streamCtaTopic = null;

    chatHistory.insertAdjacentHTML('beforeend', `
      <div class="ai-msg msg-wrapper" id="${responseId}">
        <div class="ai-avatar">A</div>
        <div class="ai-content">
          <div class="ai-name">Merlin</div>
          <div class="stream-badge"></div>
          <div class="stream-content ai-text prose">
            <span class="thinking-line" style="color:var(--text-4);">
              <span class="thinking-word">Reasoning</span>…
              <span class="thinking-timer">(0s)</span>
            </span>
          </div>
        </div>
      </div>`);

    respEl = document.getElementById(responseId);
    const contentEl = respEl.querySelector('.stream-content');
    const badgeEl = respEl.querySelector('.stream-badge');
    stopThinking = startThinkingAnimator(contentEl);
    chatHistory.scrollIntoView({ behavior: 'smooth', block: 'end' });

    const body = { message };
    if (currentSessionId) body.session_id = currentSessionId;
    if (_pendingMode) body.mode = _pendingMode;

    await streamSSE(`${API_BASE}/chat/stream`, body, {
      skill(d) {
        _activeSkillInfo = d;
        if (!_cachedSkills) _cachedSkills = [];
        if (!_cachedSkills.find(s => s.name === d.name)) _cachedSkills.push(d);
        badgeEl.innerHTML = buildSkillBadge(d);
      },
      start(d) {
        if (d.session_id) {
          currentSessionId = d.session_id;
          setSessionId(currentSessionId);
          if (_pendingMode) _pendingMode = null;
        }
      },
      token(d) {
        stopThinking();
        streamText += d.content;
        contentEl.innerHTML = safeMarkdown(streamText) + '<span class="stream-cursor"></span>';
        chatHistory.scrollIntoView({ behavior: 'smooth', block: 'end' });
      },
      cta(d) {
        // Store topic; card will be appended after msg-actions in done handler
        if (d.topic) streamCtaTopic = d.topic;
      },
      done(d) {
        stopThinking();
        if (d.session_id) {
          currentSessionId = d.session_id;
          setSessionId(currentSessionId);
        }
        // Final render (remove cursor)
        contentEl.innerHTML = safeMarkdown(streamText);
        // Add message actions below text, inside the flex-grow container
        const msgIdx = _msgStore.length;
        _msgStore.push({ text: streamText, raw: message });
        contentEl.insertAdjacentHTML('afterend', `
          <div class="msg-actions">
            <button class="msg-action" data-copy-idx="${msgIdx}" title="Copy">
              <span class="material-symbols-outlined" style="font-size:18px;">content_copy</span>
            </button>
            <button class="msg-action" data-regen-idx="${msgIdx}" title="Regenerate">
              <span class="material-symbols-outlined" style="font-size:18px;">refresh</span>
            </button>
          </div>`);
        // Append CTA card after msg-actions if cta event was received
        if (streamCtaTopic) {
          const aiContent = respEl.querySelector('.ai-content');
          if (aiContent && !aiContent.querySelector('.cta-card')) {
            aiContent.insertAdjacentHTML('beforeend',
              buildCtaCard({ cta: { type: 'learn_topic', topic: streamCtaTopic } }));
          }
        }
        // Update active-track cache so a subsequent toggle re-renders correctly
        const trackList = _sessionMode === 'chat' ? _chatMessages : _learningMessages;
        trackList.push({ role: 'user', content: userText });
        trackList.push({
          role: 'ai',
          content: streamText,
          additional_kwargs: streamCtaTopic
            ? { cta: { type: 'learn_topic', topic: streamCtaTopic } }
            : {},
        });
      },
      complete(d) {
        stopThinking();
        // Non-chat mode (graph, quiz, etc.) — full response at once
        streamMode = d.mode || 'chat';
        respEl.remove();
        if (d.mode === 'graph' && d.data?.graph) {
          currentSessionId = d.session_id;
          setSessionId(currentSessionId);
          renderKnowledgeGraph({ data: d.data, message: d.message, session_id: d.session_id, active_skill: _activeSkillInfo });
          setTimeout(initAllGraphs, 500);
          // Auto-rename session with topic
          if (d.data.graph.topic && typeof renameCurrentSession === 'function') {
            renameCurrentSession(d.data.graph.topic);
          }
          // Update learning artifacts cache
          if (_learningArtifacts) {
            _learningArtifacts.graph = d.data.graph;
            _learningArtifacts.topic = d.data.graph.topic;
          }
        } else {
          chatHistory.insertAdjacentHTML('beforeend', `
            <div class="ai-msg">
              <div class="ai-avatar">A</div>
              <div class="ai-content">
                <div class="ai-name">Merlin</div>
                <div class="ai-text prose">${safeMarkdown(d.message || '')}</div>
              </div>
            </div>`);
        }
      },
      error(d) {
        stopThinking();
        contentEl.innerHTML = `<span style="color:var(--error);">${escapeHtml(d.message || 'Request failed')}</span>`;
      },
    });

    // Sync sidebar
    const sessions = JSON.parse(localStorage.getItem('openail_sessions') || '[]');
    const currentKey = localStorage.getItem('openail_current_session');
    const existing = sessions.find(s => s.id === currentKey || s.id === currentSessionId);
    if (!existing) {
      sessions.unshift({ id: currentSessionId, name: 'Untitled' });
      localStorage.setItem('openail_sessions', JSON.stringify(sessions));
    } else if (existing.id !== currentSessionId) {
      existing.id = currentSessionId;
      localStorage.setItem('openail_sessions', JSON.stringify(sessions));
    }
    localStorage.setItem('openail_current_session', currentSessionId);

    if (typeof renameCurrentSession === 'function') {
      const sessionStillUnnamed = existing ? existing.name === 'Untitled' : true;
      if (sessionStillUnnamed && messageCount >= 3) {
        renameCurrentSession(message.substring(0, 15));
      }
    }
  } catch (err) {
    stopThinking();
    respEl?.remove();
    chatHistory.insertAdjacentHTML('beforeend', `<div style="color:var(--error);font-size:13px;padding:12px;">Request failed: ${escapeHtml(err.message)}</div>`);
  } finally {
    stopThinking();
    _sendInFlight = false;
    document.querySelectorAll('#modeToggle button').forEach(b => (b.disabled = false));
  }
}

let _graphCounter = 0;

// Module-scope so both renderKnowledgeGraph and initGraph can reference them.
// Level controls SIZE only. Background color is owned by mastery.status.
const _LEVEL_STYLES = {
  core:         { size: 28 },
  prerequisite: { size: 20 },
  extension:    { size: 18 },
};
// mastery.status → {bg, border}. Light backgrounds (Tailwind 200/300)
// so the dark node label stays legible at WCAG-AA contrast on every
// status. Borders use a saturated 600-shade for visual punch.
const _MASTERY_STYLE_BY_STATUS = {
  mastered:  { bg: '#86EFAC', border: '#16A34A' },  // light green + dark green border
  weak:      { bg: '#FCD34D', border: '#D97706' },  // light amber + dark amber border
  forgotten: { bg: '#FCA5A5', border: '#DC2626' },  // light red + dark red border
  unseen:    { bg: '#E5E7EB', border: '#9CA3AF' },  // light grey + mid grey border
};
const _NO_MASTERY_STYLE = _MASTERY_STYLE_BY_STATUS.unseen;

function renderKnowledgeGraph(data) {
  const graph = data.data.graph;
  const chatHistory = document.getElementById('chatHistory');
  const graphNodes = graph.nodes || [];
  const graphEdges = graph.edges || [];
  const containerId = 'kg-container-' + (++_graphCounter);

  const levelStyles = _LEVEL_STYLES;

  const nodeCount = graphNodes.length;
  chatHistory.innerHTML += `
    <div class="ai-msg">
      <div class="ai-avatar">A</div>
      <div class="ai-content">
        <div class="ai-name">Merlin</div>
        ${buildSkillBadge(data.active_skill || _activeSkillInfo)}
        <div class="ai-text" style="margin-bottom:8px;">${escapeHtml(data.message)}</div>
        <div class="kg-card">
          <div class="kg-header">
            <span class="kg-title">${escapeHtml(graph.topic)} — Knowledge Graph</span>
            <span class="kg-badge">${nodeCount} node${nodeCount !== 1 ? 's' : ''}</span>
          </div>
          <div id="${containerId}" style="height:280px;background:#FAFAF9;"></div>
          <div class="kg-footer">
            <div class="kg-legend">
              <div class="kg-legend-item"><div class="kg-legend-dot" style="background:#86EFAC;border:1px solid #16A34A;"></div>Mastered</div>
              <div class="kg-legend-item"><div class="kg-legend-dot" style="background:#FCD34D;border:1px solid #D97706;"></div>Review</div>
              <div class="kg-legend-item"><div class="kg-legend-dot" style="background:#FCA5A5;border:1px solid #DC2626;"></div>Forgotten</div>
              <div class="kg-legend-item"><div class="kg-legend-dot" style="background:#E5E7EB;border:1px solid #9CA3AF;"></div>Unseen</div>
            </div>
            <button class="kg-start-btn" onclick="startDiagnosis('${currentSessionId}')">Start Diagnosis →</button>
          </div>
        </div>
      </div>
    </div>`;

  // Queue vis.js initialization — actual init happens via initAllGraphs() or
  // explicit setTimeout after all innerHTML operations are done
  _pendingGraphInits.push({ containerId, graphNodes, graphEdges, levelStyles });
}

const _pendingGraphInits = [];

function initGraph(containerId, graphNodes, graphEdges, levelStyles) {
    const container = document.getElementById(containerId);
    if (!container || typeof vis === 'undefined') return;
    container.innerHTML = ''; // Clear any stale content before re-init

    function _masteryTooltip(m) {
      if (!m) return '';
      const acc = (m.last_accuracy == null) ? 'not tested' : `${Math.round(m.last_accuracy * 100)}%`;
      return `\nLast accuracy: ${acc} · ${m.last_seen_at || ''} · Status: ${m.status}`;
    }

    const visNodes = new vis.DataSet(graphNodes.map(n => {
      const sizeStyle = levelStyles[n.level] || levelStyles.prerequisite;
      const isCore = n.level === 'core';
      const m = n.mastery || null;
      const cs = (m && _MASTERY_STYLE_BY_STATUS[m.status]) || _NO_MASTERY_STYLE;
      // All four palettes use light backgrounds → uniform dark label.
      return {
        id: n.id,
        label: n.name,
        title: (n.description || n.name) + _masteryTooltip(m),
        size: sizeStyle.size,
        shape: 'dot',
        color: {
          background: cs.bg,
          border: cs.border,
          highlight: { background: cs.bg, border: cs.border },
          hover: { background: cs.bg, border: cs.border },
        },
        font: {
          color: '#1a1a1a',
          size: isCore ? 14 : 12,
          face: 'Inter, sans-serif',
          bold: { color: '#1a1a1a', size: 14, face: 'Inter, sans-serif' },
        },
        borderWidth: isCore ? 3 : 2,
        shadow: { enabled: true, size: 8, color: 'rgba(0,0,0,0.1)' },
      };
    }));

    const visEdges = new vis.DataSet(graphEdges.map(e => ({
      from: e.source,
      to: e.target,
      arrows: { to: { enabled: true, scaleFactor: 0.6 } },
      color: { color: '#D4CFC8', highlight: '#CF6833', hover: '#CF6833' },
      width: 1.5,
      smooth: { type: 'continuous' },
    })));

    new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
      physics: {
        barnesHut: { gravitationalConstant: -2500, springLength: 150, springConstant: 0.04 },
        stabilization: { iterations: 100 },
      },
      interaction: {
        hover: true,
        tooltipDelay: 200,
        zoomView: true,
        dragView: true,
        zoomSpeed: 0.3,
        minZoom: 0.4,
        maxZoom: 2.5,
      },
      layout: { improvedLayout: true },
    });
}

function initAllGraphs() {
  for (const g of _pendingGraphInits) {
    initGraph(g.containerId, g.graphNodes, g.graphEdges, g.levelStyles);
  }
}

          <span class="material-symbols-outlined" style="font-size:28px;color:var(--accent);">slideshow</span>

    </div>`;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
  document.getElementById('cancelFormatChoice').addEventListener('click', function() { overlay.remove(); });
  document.getElementById('chooseMarkdown').addEventListener('click', function() {
    overlay.remove();
    window.location.href = 'lesson.html?session_id=' + sid;
  });
  document.getElementById('chooseSlides').addEventListener('click', function() {
    overlay.remove();
    window.location.href = 'slides.html?session_id=' + sid;
  });
}

// On load: always rebuild conversation from state when session_id exists
(async function init() {
  clearChatHistory();
  document.getElementById('suggestBtns').innerHTML = '';

  const params = new URLSearchParams(window.location.search);
  const sid = params.get('session_id');

  if (!sid) return;

  currentSessionId = sid;
  const state = await getSessionState(sid);

  // Restore active skill from state (so badges render during reconstruction)
  if (state.active_skill) {
    if (!_cachedSkills) _cachedSkills = await fetchSkills();
    _activeSkillInfo = (_cachedSkills || []).find(s => s.name === state.active_skill) || null;
  }
  if (state.knowledge_skills) {
    _knowledgeSkills = state.knowledge_skills;
  }

  // Populate per-track caches
  _chatMessages = state.chat_messages || [];
  _learningMessages = state.messages || [];
  _learningArtifacts = {
    topic: state.topic,
    graph: state.graph,
    diagnosis_result: state.diagnosis_result,
    lesson_content: state.lesson_content,
    slide_contents: state.slide_contents,
  };

  _renderModeToggle(state.session_mode || 'chat');
  renderActiveView(_sessionMode);
  maybeEnterFreshLanding();

  // Show review banner if backend reports has_history (review-flow PR-3)
  if (state.has_history) {
    maybeShowReviewBanner(state);
  }
})();
</script>

  document.getElementById('startReviewBtn').addEventListener('click', openReviewModal);
}

async function openReviewModal() {
  const sid = currentSessionId;
  if (!sid) return;
  renderReviewModal(`
    <div style="text-align:center;padding:40px;">
      <svg class="animate-spin" style="width:32px;height:32px;color:var(--accent);margin:0 auto 16px;display:block;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" style="opacity:0.25"></circle>
        <path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" style="opacity:0.75"></path>
      </svg>
      <div style="font-size:13px;color:var(--text-3);">Generating review questions…</div>
    </div>`);

  let result;
  try {
    result = await startReview(sid);
  } catch (e) {
    renderReviewModal(`
      <div style="padding:40px;text-align:center;">
        <div style="font-size:13px;color:#dc2626;margin-bottom:16px;">${escapeHtml('Failed to generate review. Please try again later.')}</div>
        <button onclick="closeReviewModal()" style="padding:8px 20px;border-radius:99px;border:1px solid var(--border);background:white;cursor:pointer;">Close</button>
      </div>`);
    return;
  }
  if (!result.ok) {
    renderReviewModal(`
      <div style="padding:40px;text-align:center;">
        <div style="font-size:13px;color:var(--text-3);margin-bottom:16px;">${escapeHtml(result.reason || 'No content available for review at this time.')}</div>
        <button onclick="closeReviewModal()" style="padding:8px 20px;border-radius:99px;border:1px solid var(--border);background:white;cursor:pointer;">Close</button>
      </div>`);
    return;
  }

  _reviewQuestions = result.questions;
  _reviewCurrentIdx = 0;
  _reviewAnswers = new Array(_reviewQuestions.length).fill(-1);
  _reviewSelectedOption = -1;
  renderReviewQuestion();
}

function renderReviewModal(innerHtml) {
  const root = document.getElementById('reviewModalRoot');
  root.innerHTML = `
    <div class="review-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;">
      <div style="background:white;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;">
        ${innerHtml}
      </div>
    </div>`;
  root.querySelector('.review-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeReviewModal();
  });
}

function closeReviewModal() {
  document.getElementById('reviewModalRoot').innerHTML = '';
}

function renderReviewQuestion() {
  const q = _reviewQuestions[_reviewCurrentIdx];
  const total = _reviewQuestions.length;
  const isLast = _reviewCurrentIdx === total - 1;
  const letters = ['A', 'B', 'C', 'D'];

  const optionsHtml = q.options.map((opt, idx) => `
    <button class="review-option-btn" data-idx="${idx}" style="display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;margin:8px 0;border-radius:10px;border:1px solid ${_reviewSelectedOption === idx ? 'var(--accent)' : 'var(--border)'};background:${_reviewSelectedOption === idx ? 'var(--bg-tinted)' : 'white'};cursor:pointer;text-align:left;">
      <span style="font-weight:700;color:var(--accent);">${letters[idx]}</span>
      <span style="font-size:13px;color:var(--text);">${escapeHtml(opt)}</span>
    </button>
  `).join('');

  renderReviewModal(`
    <div style="padding:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div style="font-size:11px;color:var(--text-3);">Review · Question ${_reviewCurrentIdx + 1} / ${total}</div>
        <button onclick="closeReviewModal()" style="font-size:18px;color:var(--text-3);background:none;border:none;cursor:pointer;">✕</button>
      </div>
      <div style="font-size:11px;color:var(--accent);margin-bottom:8px;">
        ${q.topic ? `<span style="color:var(--text-3);font-weight:500;">From "${escapeHtml(q.topic)}" · </span>` : ''}${escapeHtml(q.knowledge_point)}
      </div>
      <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:16px;">${escapeHtml(q.question)}</div>
      ${optionsHtml}
      <div style="display:flex;justify-content:flex-end;margin-top:16px;">
        <button id="reviewNextBtn" disabled style="padding:8px 20px;border-radius:99px;border:none;background:var(--accent);color:white;font-size:12px;font-weight:600;cursor:pointer;opacity:0.4;">
          ${isLast ? 'Submit' : 'Next →'}
        </button>
      </div>
    </div>`);

  document.querySelectorAll('.review-option-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      _reviewSelectedOption = parseInt(btn.dataset.idx, 10);
      _reviewAnswers[_reviewCurrentIdx] = _reviewSelectedOption;
      renderReviewQuestion();
    });
  });

  if (_reviewSelectedOption !== -1) {
    const nextBtn = document.getElementById('reviewNextBtn');
    nextBtn.disabled = false;
    nextBtn.style.opacity = '1';
    nextBtn.addEventListener('click', () => {
      if (isLast) {
        submitReviewFlow();
      } else {
        _reviewCurrentIdx += 1;
        _reviewSelectedOption = _reviewAnswers[_reviewCurrentIdx] ?? -1;
        renderReviewQuestion();
      }
    });
  }
}

async function submitReviewFlow() {
  const sid = currentSessionId;
  if (!sid) return;
  renderReviewModal(`
    <div style="text-align:center;padding:40px;">
      <svg class="animate-spin" style="width:32px;height:32px;color:var(--accent);margin:0 auto 16px;display:block;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" style="opacity:0.25"></circle>
        <path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" style="opacity:0.75"></path>
      </svg>
      <div style="font-size:13px;color:var(--text-3);">Scoring…</div>
    </div>`);

  let result;
  try {
    result = await submitReview(sid, _reviewAnswers);
  } catch (e) {
    renderReviewModal(`
      <div style="padding:40px;text-align:center;">
        <div style="font-size:13px;color:#dc2626;margin-bottom:16px;">${escapeHtml('Submission failed. Please try again later.')}</div>
        <button onclick="closeReviewModal()" style="padding:8px 20px;border-radius:99px;border:1px solid var(--border);background:white;cursor:pointer;">Close</button>
      </div>`);
    return;
  }

  const weakHtml = (result.weak_kps || []).map(k => `<li style="font-size:12px;color:#dc2626;">${escapeHtml(k)}</li>`).join('');
  const strongHtml = (result.strong_kps || []).map(k => `<li style="font-size:12px;color:#059669;">${escapeHtml(k)}</li>`).join('');
  const scorePct = Math.round((result.score || 0) * 100);

  renderReviewModal(`
    <div style="padding:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div style="font-size:13px;font-weight:700;color:var(--text);">Review Complete</div>
        <button onclick="closeReviewModal()" style="font-size:18px;color:var(--text-3);background:none;border:none;cursor:pointer;">✕</button>
      </div>
      <div style="text-align:center;font-size:22px;font-weight:700;color:var(--accent);margin:8px 0 16px;">${scorePct}%</div>
      <div style="display:flex;gap:16px;">
        <div style="flex:1;">
          <div style="font-size:11px;font-weight:600;color:#dc2626;margin-bottom:6px;">Still needs work</div>
          <ul style="margin:0;padding-left:16px;">${weakHtml || '<li style="font-size:12px;color:var(--text-3);">None</li>'}</ul>
        </div>
        <div style="flex:1;">
          <div style="font-size:11px;font-weight:600;color:#059669;margin-bottom:6px;">Mastered</div>
          <ul style="margin:0;padding-left:16px;">${strongHtml || '<li style="font-size:12px;color:var(--text-3);">None</li>'}</ul>
        </div>
      </div>
      <div style="margin-top:16px;padding:12px;background:var(--bg-tinted);border-radius:8px;font-size:12px;color:var(--text-3);">
        ${escapeHtml(result.focus_directive || '')}
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:16px;">
        <button onclick="closeReviewModal(); document.getElementById('reviewBanner').style.display='none';" style="padding:8px 20px;border-radius:99px;border:none;background:var(--accent);color:white;font-size:12px;font-weight:600;cursor:pointer;">
          Continue Learning
        </button>
      </div>
    </div>`);
}
</script>
</body></html>
