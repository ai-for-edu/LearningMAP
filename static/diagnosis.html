<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenAILearning - Diagnosis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "secondary": "#3c692b",
          "error": "#ba1a1a",
          "on-surface-variant": "#414751",
          "surface-container-low": "#f2f4f6",
          "surface-container": "#eceef0",
          "surface-container-high": "#e6e8ea",
          "primary": "#005da7",
          "surface": "#f7f9fb",
          "on-primary": "#ffffff",
          "on-surface": "#191c1e",
          "outline": "#717783",
          "primary-fixed": "#d4e3ff",
          "primary-container": "#2976c7",
          "surface-container-lowest": "#ffffff",
          "on-primary-container": "#fdfcff",
        },
        fontFamily: {
          "headline": ["Manrope"],
          "body": ["Inter"],
          "label": ["Inter"]
        },
      },
    },
  }
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .option-btn {
    transition: all 0.15s ease-in-out;
  }
  .option-btn:hover {
    border-color: #005da7;
    background-color: #d4e3ff;
  }
  .option-btn.selected {
    border-color: #005da7;
    background-color: #005da7;
    color: white;
  }
  .option-btn.selected .option-letter {
    background-color: white;
    color: #005da7;
  }
</style>
</head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-fixed">

<!-- Top Navigation Bar -->
<nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 flex justify-between items-center px-6 py-3">
  <div class="flex items-center gap-4">
    <span class="text-xl font-extrabold tracking-tighter text-blue-800">OpenAILearning</span>
    <span class="text-slate-300">|</span>
    <span class="font-headline font-bold text-sm text-on-surface-variant">Diagnosis Mode</span>
  </div>
  <div class="flex items-center gap-2">
    <button id="navStopBtn" onclick="stopQuiz()" class="flex items-center gap-1 text-sm text-slate-500 hover:text-error transition-colors" title="Stop generating" style="display:none;">
      <span class="material-symbols-outlined text-lg">stop_circle</span>
    </button>
    <button id="navRegenBtn" onclick="retryQuiz()" class="flex items-center gap-1 text-sm text-slate-500 hover:text-primary transition-colors" title="Regenerate" style="display:none;">
      <span class="material-symbols-outlined text-lg">refresh</span>
    </button>
    <a id="navExitBtn" href="index.html" class="flex items-center text-sm text-slate-500 hover:text-error transition-colors p-1 rounded-lg hover:bg-slate-100" title="Close">
      <span class="material-symbols-outlined text-lg">close</span>
    </a>
  </div>
</nav>

<!-- Progress Bar -->
<div class="fixed top-[53px] left-0 right-0 z-40 bg-white border-b border-slate-100 px-6 py-3">
  <div class="max-w-6xl mx-auto flex items-center gap-4">
    <span class="font-headline font-bold text-xs text-on-surface-variant uppercase tracking-widest" id="progressText">Question 1 / 10</span>
    <div class="flex-grow h-1.5 bg-slate-100 rounded-full overflow-hidden">
      <div class="h-full bg-primary rounded-full transition-all duration-300" id="progressBar" style="width: 10%"></div>
    </div>
  </div>
</div>

<!-- Main Split Layout -->
<main class="pt-[110px] pb-8 px-6 min-h-screen flex">
  <div class="max-w-6xl mx-auto w-full flex gap-8">

    <!-- Left: Question Area -->
    <div class="flex-1 flex flex-col">
      <div class="bg-white rounded-3xl border border-slate-100 p-10 flex-grow shadow-sm">
        <!-- Knowledge Point Tag -->
        <div class="mb-6">
          <span class="inline-flex items-center gap-1.5 bg-primary-fixed text-primary px-3 py-1 rounded-full text-xs font-headline font-bold" id="knowledgeTag">
            <span class="material-symbols-outlined text-sm">label</span>
            <span id="knowledgeTagText">一元一次方程</span>
          </span>
        </div>
        <!-- Question Text -->
        <p class="font-headline text-xl font-bold text-on-surface leading-relaxed mb-2" id="questionText">
          解方程：2x + 5 = 11，x 的值是多少？
        </p>
        <p class="font-body text-sm text-on-surface-variant" id="questionHint">Select one answer</p>
      </div>
    </div>

    <!-- Right: Answer Area -->
    <div class="w-[420px] flex flex-col gap-4">
      <!-- Options -->
      <div class="flex flex-col gap-3" id="optionsContainer">
        <button class="option-btn w-full flex items-start gap-4 bg-white border-2 border-slate-200 rounded-2xl p-5 text-left" onclick="selectOption(this, 0)">
          <span class="option-letter w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-headline font-bold text-sm text-slate-500 shrink-0">A</span>
          <span class="font-body text-sm leading-relaxed text-on-surface" id="optA">x = 2</span>
        </button>
        <button class="option-btn w-full flex items-start gap-4 bg-white border-2 border-slate-200 rounded-2xl p-5 text-left" onclick="selectOption(this, 1)">
          <span class="option-letter w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-headline font-bold text-sm text-slate-500 shrink-0">B</span>
          <span class="font-body text-sm leading-relaxed text-on-surface" id="optB">x = 3</span>
        </button>
        <button class="option-btn w-full flex items-start gap-4 bg-white border-2 border-slate-200 rounded-2xl p-5 text-left" onclick="selectOption(this, 2)">
          <span class="option-letter w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-headline font-bold text-sm text-slate-500 shrink-0">C</span>
          <span class="font-body text-sm leading-relaxed text-on-surface" id="optC">x = 4</span>
        </button>
        <button class="option-btn w-full flex items-start gap-4 bg-white border-2 border-slate-200 rounded-2xl p-5 text-left" onclick="selectOption(this, 3)">
          <span class="option-letter w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-headline font-bold text-sm text-slate-500 shrink-0">D</span>
          <span class="font-body text-sm leading-relaxed text-on-surface" id="optD">x = 8</span>
        </button>
      </div>

      <!-- Next Button -->
      <button class="w-full bg-primary text-white py-4 px-8 rounded-2xl font-headline font-bold text-sm shadow-sm hover:shadow-md hover:bg-primary-container transition-all disabled:opacity-40 disabled:cursor-not-allowed mt-2" id="nextBtn" disabled onclick="nextQuestion()">
        <span id="nextBtnText">Next Question</span>
        <span class="material-symbols-outlined text-lg align-middle ml-1">arrow_forward</span>
      </button>
    </div>

  </div>
</main>

<script src="api.js?v=7"></script>
<script>
let sessionId = getSessionId();
let allQuestions = [];
let currentIndex = 0;
let answers = [];
let selectedOption = -1;

function buildQuizUI() {
  document.querySelector('main').innerHTML = `
    <div class="max-w-6xl mx-auto w-full flex gap-8">
      <div class="flex-1 flex flex-col">
        <div class="bg-white rounded-3xl border border-slate-100 p-10 flex-grow shadow-sm">
          <div class="mb-6 flex items-center gap-3">
            <span class="inline-flex items-center gap-1.5 bg-primary-fixed text-primary px-3 py-1 rounded-full text-xs font-headline font-bold">
              <span class="material-symbols-outlined text-sm">label</span>
              <span id="knowledgeTagText"></span>
            </span>
            <span class="text-xs text-slate-400" id="loadingHint"></span>
          </div>
          <p class="font-headline text-xl font-bold text-on-surface leading-relaxed mb-2" id="questionText"></p>
          <p class="font-body text-sm text-on-surface-variant">Select one answer</p>
        </div>
      </div>
      <div class="w-[420px] flex flex-col gap-4">
        <div class="flex flex-col gap-3" id="optionsContainer">
          <button class="option-btn w-full flex items-start gap-4 bg-white border-2 border-slate-200 rounded-2xl p-5 text-left" onclick="selectOption(this, 0)">
            <span class="option-letter w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-headline font-bold text-sm text-slate-500 shrink-0">A</span>
            <span class="font-body text-sm leading-relaxed text-on-surface" id="optA"></span>
          </button>
          <button class="option-btn w-full flex items-start gap-4 bg-white border-2 border-slate-200 rounded-2xl p-5 text-left" onclick="selectOption(this, 1)">
            <span class="option-letter w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-headline font-bold text-sm text-slate-500 shrink-0">B</span>
            <span class="font-body text-sm leading-relaxed text-on-surface" id="optB"></span>
          </button>
          <button class="option-btn w-full flex items-start gap-4 bg-white border-2 border-slate-200 rounded-2xl p-5 text-left" onclick="selectOption(this, 2)">
            <span class="option-letter w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-headline font-bold text-sm text-slate-500 shrink-0">C</span>
            <span class="font-body text-sm leading-relaxed text-on-surface" id="optC"></span>
          </button>
          <button class="option-btn w-full flex items-start gap-4 bg-white border-2 border-slate-200 rounded-2xl p-5 text-left" onclick="selectOption(this, 3)">
            <span class="option-letter w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-headline font-bold text-sm text-slate-500 shrink-0">D</span>
            <span class="font-body text-sm leading-relaxed text-on-surface" id="optD"></span>
          </button>
        </div>
        <div class="flex gap-3 mt-2">
          <button class="flex-1 bg-surface-container-high text-on-surface-variant py-4 px-6 rounded-2xl font-headline font-bold text-sm hover:bg-surface-container-highest transition-all disabled:opacity-30 disabled:cursor-not-allowed" id="prevBtn" disabled onclick="prevQuestion()">
            <span class="material-symbols-outlined text-lg align-middle mr-1">arrow_back</span>
            <span>Previous</span>
          </button>
          <button class="flex-1 bg-primary text-white py-4 px-6 rounded-2xl font-headline font-bold text-sm shadow-sm hover:shadow-md hover:bg-primary-container transition-all disabled:opacity-40 disabled:cursor-not-allowed" id="nextBtn" disabled onclick="nextQuestion()">
            <span id="nextBtnText">Next Question</span>
            <span class="material-symbols-outlined text-lg align-middle ml-1">arrow_forward</span>
          </button>
        </div>
      </div>
    </div>`;
}

let quizFullyLoaded = false;
let _poller = null;

async function initDiagnosis() {
  if (!sessionId) {
    alert('请先从主页选择学习主题');
    window.location.href = '/';
    return;
  }

  // Check if questions already exist (returning to page)
  try {
    const state = await getSessionState(sessionId);
    if (state.questions && state.questions.length > 0) {
      allQuestions = state.questions;
      quizFullyLoaded = state.quiz_task_status !== 'running';
      buildQuizUI();
      showQuestion();
      // If still generating, poll for more
      if (!quizFullyLoaded) {
        startPolling();
      }
      return;
    }
  } catch (e) { /* continue to generate */ }

  // Show loading
  document.querySelector('main').innerHTML = `
    <div class="max-w-6xl mx-auto w-full flex flex-col items-center justify-center min-h-[60vh]">
      <svg class="animate-spin h-12 w-12 text-primary mb-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <p class="font-headline font-bold text-lg text-on-surface">Generating Questions</p>
      <p class="font-body text-sm text-on-surface-variant mt-2">AI is generating questions from the knowledge graph...</p>
    </div>`;
  document.getElementById('progressText').textContent = 'Generating...';
  document.getElementById('progressBar').style.width = '0%';

  // Trigger background generation
  try {
    await startGeneration(sessionId, 'quiz');
  } catch (err) {
    // May already be running — that's fine
  }

  // Poll for results
  startPolling();
}

function updateNavButtons() {
  const stop = document.getElementById('navStopBtn');
  const regen = document.getElementById('navRegenBtn');
  const exit = document.getElementById('navExitBtn');
  if (exit) exit.href = sessionId ? '/?session_id=' + sessionId : '/';
  if (quizFullyLoaded) {
    if (stop) stop.style.display = 'none';
    if (regen) regen.style.display = '';
  } else {
    if (stop) stop.style.display = '';
    if (regen) regen.style.display = 'none';
  }
}

function startPolling() {
  updateNavButtons();
  _poller = pollStatus(sessionId, 'quiz',
    async function onUpdate(status) {
      // Check for new questions
      try {
        const state = await getSessionState(sessionId);
        if (state.questions && state.questions.length > allQuestions.length) {
          allQuestions = state.questions;
          if (!document.getElementById('optionsContainer')) {
            buildQuizUI();
          }
          showQuestion();
          // Update loading hint
          const hint = document.getElementById('loadingHint');
          if (hint && status.progress) {
            hint.innerHTML = `<span class="animate-pulse">Generating ${status.progress}...</span>`;
          }
        }
      } catch (e) { /* ignore */ }
    },
    async function onDone(status) {
      quizFullyLoaded = true;
      updateNavButtons();
      // Final fetch
      try {
        const state = await getSessionState(sessionId);
        if (state.questions && state.questions.length > 0) {
          allQuestions = state.questions;
          if (!document.getElementById('optionsContainer')) {
            buildQuizUI();
          }
          showQuestion();
        }
      } catch (e) { /* ignore */ }
      const hint = document.getElementById('loadingHint');
      if (hint) hint.textContent = '';
      if (status.status === 'error') {
        document.querySelector('main').innerHTML = `
          <div class="max-w-2xl mx-auto w-full flex flex-col items-center justify-center min-h-[60vh] text-center">
            <span class="material-symbols-outlined text-4xl text-error mb-4">error</span>
            <p class="font-headline font-bold text-on-surface mb-2">Generation Failed</p>
            <button onclick="retryQuiz()" class="text-primary font-headline font-bold text-sm hover:underline">Retry</button>
          </div>`;
      }
    },
    1500
  );
}

async function retryQuiz() {
  allQuestions = [];
  currentIndex = 0;
  answers = [];
  quizFullyLoaded = false;
  if (_poller) _poller.stop();
  // Reset status
  try { await cancelGeneration(sessionId, 'quiz'); } catch(e) {}
  initDiagnosis();
}

async function stopQuiz() {
  try { await cancelGeneration(sessionId, 'quiz'); } catch(e) {}
  if (_poller) _poller.stop();
  quizFullyLoaded = true;
  updateNavButtons();
  const hint = document.getElementById('loadingHint');
  if (hint) hint.textContent = 'Stopped';
  showQuestion();
}

function showQuestion() {
  // If student is ahead of loaded questions, show waiting state
  if (currentIndex >= allQuestions.length) {
    document.getElementById('questionText').textContent = 'Generating next question...';
    document.getElementById('knowledgeTagText').textContent = '';
    document.querySelectorAll('.option-btn').forEach(b => { b.style.display = 'none'; });
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('nextBtnText').textContent = '等待出题...';
    // Retry when new questions arrive
    const check = setInterval(() => {
      if (currentIndex < allQuestions.length) { clearInterval(check); showQuestion(); }
    }, 300);
    return;
  }

  document.querySelectorAll('.option-btn').forEach(b => { b.style.display = ''; });

  // Show/hide stop button
  const stopBtn = document.getElementById('stopBtn');
  if (stopBtn) stopBtn.style.display = quizFullyLoaded ? 'none' : '';

  const q = allQuestions[currentIndex];
  const totalLabel = quizFullyLoaded ? allQuestions.length : allQuestions.length + '+';
  document.getElementById('progressText').textContent = `Question ${currentIndex + 1} / ${totalLabel}`;
  document.getElementById('progressBar').style.width = `${((currentIndex + 1) / allQuestions.length) * 100}%`;
  document.getElementById('knowledgeTagText').textContent = q.knowledge_point;
  document.getElementById('questionText').textContent = q.question;
  document.getElementById('optA').textContent = q.options[0];
  document.getElementById('optB').textContent = q.options[1];
  document.getElementById('optC').textContent = q.options[2];
  document.getElementById('optD').textContent = q.options[3];
  const isLast = quizFullyLoaded && currentIndex >= allQuestions.length - 1;
  document.getElementById('nextBtnText').textContent = isLast ? 'Finish' : 'Next Question';

  // Previous button
  const prevBtn = document.getElementById('prevBtn');
  if (prevBtn) prevBtn.disabled = currentIndex === 0;

  // Restore previous answer if going back
  if (currentIndex < answers.length) {
    selectedOption = answers[currentIndex];
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach((b, i) => {
      if (i === selectedOption) b.classList.add('selected');
      else b.classList.remove('selected');
    });
    document.getElementById('nextBtn').disabled = false;
  } else {
    selectedOption = -1;
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('nextBtn').disabled = true;
  }
}

function prevQuestion() {
  if (currentIndex <= 0) return;
  currentIndex--;
  showQuestion();
}

function selectOption(btn, index) {
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedOption = index;
  document.getElementById('nextBtn').disabled = false;
}

async function nextQuestion() {
  if (selectedOption === -1) return;
  // Update or push answer
  if (currentIndex < answers.length) {
    answers[currentIndex] = selectedOption;
  } else {
    answers.push(selectedOption);
  }
  currentIndex++;

  if (currentIndex < allQuestions.length || !quizFullyLoaded) {
    showQuestion();
    return;
  }

  // All done — submit answers to backend
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtnText').textContent = 'Submitting...';
  try {
    const resp = await fetch(`/api/chat/${sessionId}/submit-quiz`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers }),
    });
    if (!resp.ok) throw new Error(`API error: ${resp.status}`);

    document.querySelector('main').innerHTML = `
      <div class="max-w-2xl mx-auto w-full flex flex-col items-center justify-center min-h-[60vh] text-center">
        <span class="material-symbols-outlined text-6xl text-secondary mb-6" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        <p class="font-headline text-3xl font-extrabold text-on-surface mb-3">Diagnosis Complete</p>
        <p class="font-body text-on-surface-variant mb-8">所有题目已作答完毕，点击下方查看诊断结果。</p>
        <a href="/?session_id=${sessionId}&show=results" class="inline-block bg-primary text-white py-4 px-10 rounded-2xl font-headline font-bold text-sm shadow-md hover:shadow-lg transition-all">View Results</a>
      </div>`;
    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressText').textContent = 'Completed';
  } catch (err) {
    document.getElementById('nextBtnText').textContent = 'Finish';
    document.getElementById('nextBtn').disabled = false;
    alert('Submit failed: ' + err.message);
  }
}

initDiagnosis();
</script>

</body>
</html>
