<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenAILearning - Diagnosis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } } }
</script>
<style>
:root {
  --bg: #FAF9F7; --bg-sidebar: #F0EDE8;
  --border: #EAE6E0; --border-input: #E0DDD8;
  --accent: #CF6833; --accent-light: #FFF3EC; --accent-border: #F5D5BF; --accent-dark: #9E4A2A;
  --text: #1a1a1a; --text-2: #4a4a4a; --text-3: #888; --text-4: #B0A898;
  --error: #DC2626; --success: #059669;
}
* { box-sizing: border-box; }
body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); margin: 0; }

/* ── Sidebar ── */
#sidebar {
  width: 210px; height: 100vh; position: fixed; left: 0; top: 0;
  background: var(--bg-sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; z-index: 40;
}
.sidebar-logo { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin-bottom: 8px; }
.sidebar-logo-icon {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  display: flex; align-items: center; justify-content: center;
  color: white;
}
.sidebar-logo-text { font-size: 13px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
.new-session-btn {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border: 1.5px dashed #D4CFC8; border-radius: 8px; background: transparent;
  font-size: 13px; font-weight: 500; color: var(--text-3); cursor: pointer;
  margin-bottom: 12px; width: 100%;
}
.new-session-btn:hover { background: white; }
.session-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; font-size: 13px; color: var(--text-3); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-item:hover { background: #E8E4DE; }
.session-item.active { background: white; color: var(--text); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
.session-dot { width: 6px; height: 6px; border-radius: 50%; background: #D4CFC8; flex-shrink: 0; }
.session-dot.orange { background: var(--accent); }

/* ── Top Nav ── */
#topNav {
  height: 50px; position: fixed; top: 0; left: 210px; right: 0; z-index: 30;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
}
.topnav-left { display: flex; align-items: center; gap: 8px; }
.topnav-title { font-size: 14px; font-weight: 600; color: var(--text); }
.topnav-actions { display: flex; align-items: center; gap: 8px; }
.topnav-ghost-btn {
  display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500;
  color: var(--text-3); background: transparent; border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 99px; cursor: pointer; transition: all .15s;
  text-decoration: none;
}
.topnav-ghost-btn:hover { background: white; color: var(--text-2); }
.topnav-ghost-btn .material-symbols-outlined { font-size: 15px; }

/* ── Step Nav ── */
#stepNav {
  height: 44px; position: fixed; top: 50px; left: 210px; right: 0; z-index: 29;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 0;
}
.step-item {
  display: flex; align-items: center; gap: 6px; padding: 0 8px; height: 44px;
  font-size: 13px; font-weight: 500; color: var(--text-4); cursor: default;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.step-item.done { color: var(--accent); }
.step-item.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
.step-num {
  width: 20px; height: 20px; border-radius: 50%; background: #E8E4DE; color: var(--text-4);
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600;
}
.step-item.done .step-num { background: var(--accent); color: white; }
.step-item.active .step-num { background: var(--accent); color: white; }
.step-sep { color: #D4CFC8; font-size: 14px; padding: 0 4px; }

/* ── Main ── */
#mainContent { margin-left: 210px; padding-top: 94px; min-height: 100vh; padding-bottom: 40px; }
.content-area { max-width: 860px; margin: 0 auto; padding: 24px; }

/* ── Quiz progress bar ── */
.quiz-progress-wrap { margin-bottom: 16px; }
.quiz-progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 4px; }
.quiz-progress-fill { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); transition: width .3s; }
.quiz-progress-label { font-size: 11px; color: var(--text-4); text-align: right; }

/* ── Question card ── */
.question-card { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
.question-label { font-size: 10px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.question-text { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.55; margin-bottom: 18px; }
.option-btn {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px;
  background: white; cursor: pointer; margin-bottom: 10px; transition: all .15s; text-align: left;
}
.option-btn:hover { border-color: var(--accent); background: var(--accent-light); }
.option-btn.selected { border-color: var(--accent); background: var(--accent-light); }
.option-letter {
  width: 26px; height: 26px; border-radius: 50%; background: var(--bg-sidebar); color: var(--text-3);
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
  flex-shrink: 0;
}
.option-btn.selected .option-letter { background: var(--accent); color: white; }
.option-btn.correct { border-color: var(--success); background: #ECFDF5; }
.option-btn.correct .option-letter { background: var(--success); color: white; }
.option-btn.incorrect { border-color: var(--error); background: #FEF2F2; }
.option-btn.incorrect .option-letter { background: var(--error); color: white; }
.option-text { font-size: 13.5px; color: var(--text-2); line-height: 1.5; }
.quiz-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }
.quiz-prev-btn {
  font-size: 13px; font-weight: 500; color: var(--text-3);
  background: transparent; border: 1px solid var(--border);
  padding: 8px 18px; border-radius: 99px; cursor: pointer; transition: all .15s;
}
.quiz-prev-btn:hover { background: white; color: var(--text-2); }
.quiz-next-btn {
  font-size: 13px; font-weight: 600; color: white;
  background: var(--accent); border: none;
  padding: 8px 20px; border-radius: 99px; cursor: pointer; transition: background .15s;
}
.quiz-next-btn:hover { background: var(--accent-dark); }

/* ── Status/loading ── */
.status-card { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 40px 24px; text-align: center; }
.status-text { font-size: 14px; color: var(--text-3); }

</style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon"><span class="material-symbols-outlined" style="font-size:18px;">school</span></div>
    <span class="sidebar-logo-text">OpenAILearning</span>
  </div>
  <button class="new-session-btn" onclick="window.location.href='index.html'">
    <span class="material-symbols-outlined" style="font-size:16px;">add</span>
    New Chat
  </button>
  <div style="flex:1;overflow-y:auto;" id="session-list"></div>
</aside>

<!-- Top Nav -->
<nav id="topNav">
  <div class="topnav-left">
    <span class="topnav-title" id="topNavTitle">Diagnosis</span>
  </div>
  <div class="topnav-actions">
    <button id="navStopBtn" onclick="stopQuiz()" class="topnav-ghost-btn" style="display:none;">
      <span class="material-symbols-outlined" style="font-size:15px;">stop_circle</span>Stop
    </button>
    <button id="navRegenBtn" onclick="retryQuiz()" class="topnav-ghost-btn" style="display:none;">
      <span class="material-symbols-outlined" style="font-size:15px;">refresh</span>Retry
    </button>
    <a id="navExitBtn" href="index.html" class="topnav-ghost-btn">
      <span class="material-symbols-outlined" style="font-size:15px;">close</span>
    </a>
  </div>
</nav>

<!-- Step Nav -->
<div id="stepNav">
  <div class="step-item done" id="step1">
    <span class="step-num">✓</span>Topic
  </div>
  <span class="step-sep">›</span>
  <div class="step-item done" id="step2">
    <span class="step-num">✓</span>Knowledge Graph
  </div>
  <span class="step-sep">›</span>
  <div class="step-item active" id="step3">
    <span class="step-num">3</span>Diagnosis
  </div>
  <span class="step-sep">›</span>
  <div class="step-item" id="step4">
    <span class="step-num">4</span>Course
  </div>
</div>

<!-- Main content -->
<main id="mainContent">
  <div class="content-area" id="contentArea">
    <!-- Quiz content rendered here by JS -->
  </div>
</main>

<script src="sidebar.js?v=3"></script>
<script src="api.js?v=8"></script>
<script>
let sessionId = getSessionId();
let allQuestions = [];
let currentIndex = 0;
let answers = [];
let selectedOption = -1;

// Set exit link immediately so ✕ always returns to correct session
if (sessionId) {
  document.getElementById('navExitBtn').href = '/?session_id=' + sessionId;
}

function updateStepNav(activeStep) {
  ['step1','step2','step3','step4'].forEach((id, i) => {
    const el = document.getElementById(id);
    if (!el) return;
    const num = el.querySelector('.step-num');
    if (i + 1 < activeStep) {
      el.className = 'step-item done';
      num.textContent = '✓';
    } else if (i + 1 === activeStep) {
      el.className = 'step-item active';
      num.textContent = String(activeStep);
    } else {
      el.className = 'step-item';
      num.textContent = String(i + 1);
    }
  });
}

function buildQuizUI() {
  document.querySelector('main').innerHTML = `
    <div class="content-area">
      <div class="quiz-progress-wrap">
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quizProgressFill" style="width:10%"></div></div>
        <div class="quiz-progress-label" id="quizProgressLabel">Question 1 / ?</div>
      </div>
      <div class="question-card">
        <div class="question-label" id="knowledgeTagText"></div>
        <div class="question-text" id="questionText"></div>
        <div id="optionsContainer">
          <button class="option-btn" onclick="selectOption(this, 0)">
            <span class="option-letter">A</span>
            <span class="option-text" id="optA"></span>
          </button>
          <button class="option-btn" onclick="selectOption(this, 1)">
            <span class="option-letter">B</span>
            <span class="option-text" id="optB"></span>
          </button>
          <button class="option-btn" onclick="selectOption(this, 2)">
            <span class="option-letter">C</span>
            <span class="option-text" id="optC"></span>
          </button>
          <button class="option-btn" onclick="selectOption(this, 3)">
            <span class="option-letter">D</span>
            <span class="option-text" id="optD"></span>
          </button>
        </div>
        <div class="quiz-nav">
          <button class="quiz-prev-btn" id="prevBtn" disabled onclick="prevQuestion()">← Previous</button>
          <button class="quiz-next-btn" id="nextBtn" disabled onclick="nextQuestion()">
            <span id="nextBtnText">Next</span>
          </button>
        </div>
      </div>
    </div>`;
}

let quizFullyLoaded = false;
let _poller = null;

async function initDiagnosis() {
  if (!sessionId) {
    alert('Please select a learning topic from the home page first');
    window.location.href = '/';
    return;
  }

  updateStepNav(3);

  // Check current state (returning to page)
  let existingState = null;
  try { existingState = await getSessionState(sessionId); } catch (e) { /* continue */ }

  // Only show quiz UI when generation is fully done; otherwise show the
  // loading screen and poll until done (partial state is never rendered).
  const fullyDone =
    existingState &&
    existingState.questions &&
    existingState.questions.length > 0 &&
    existingState.quiz_task_status !== 'running';

  if (!_forceRegen && fullyDone) {
    allQuestions = existingState.questions;
    quizFullyLoaded = true;
    buildQuizUI();
    showQuestion();
    updateNavButtons();
    return;
  }

  // Show loading
  document.querySelector('main').innerHTML = `
    <div class="content-area">
      <div class="status-card">
        <svg class="animate-spin" style="width:40px;height:40px;color:var(--accent);margin:0 auto 16px;display:block;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <p style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px;">Generating Questions</p>
        <p class="status-text">AI is generating diagnostic questions based on the knowledge graph…</p>
        <p class="status-text" id="loadingHint" style="margin-top:4px;font-size:11px;color:var(--text-4);"></p>
      </div>
    </div>`;
  document.getElementById('navStopBtn').style.display = '';

  _forceRegen = false;

  // Kick off generation only if not already running in the background.
  if (!existingState || existingState.quiz_task_status !== 'running') {
    try {
      await startGeneration(sessionId, 'quiz');
    } catch (err) {
      // May already be running — that's fine
    }
  }

  // Poll for completion (UI stays on loading screen until done)
  startPolling();
}

function updateNavButtons() {
  const stop = document.getElementById('navStopBtn');
  const regen = document.getElementById('navRegenBtn');
  if (quizFullyLoaded) {
    if (stop) stop.style.display = 'none';
    if (regen) regen.style.display = '';
  } else {
    if (stop) stop.style.display = '';
    if (regen) regen.style.display = 'none';
  }
}

function startPolling() {
  updateNavButtons();
  _poller = pollStatus(sessionId, 'quiz',
    function onUpdate(status) {
      // Don't render partial questions — only update the loading-screen
      // progress hint. The quiz UI is built in onDone once everything
      // is generated.
      const hint = document.getElementById('loadingHint');
      if (hint && status.progress) {
        hint.innerHTML = `<span class="animate-pulse">Generating ${status.progress}...</span>`;
      }
    },
    async function onDone(status) {
      quizFullyLoaded = true;
      updateNavButtons();
      // Final fetch
      try {
        const state = await getSessionState(sessionId);
        if (state.questions && state.questions.length > 0) {
          allQuestions = state.questions;
          if (!document.getElementById('optionsContainer')) {
            buildQuizUI();
          }
          showQuestion();
        }
      } catch (e) { /* ignore */ }
      const hint = document.getElementById('loadingHint');
      if (hint) hint.textContent = '';
      if (status.status === 'error') {
        document.querySelector('main').innerHTML = `
          <div class="content-area">
            <div class="status-card">
              <span class="material-symbols-outlined" style="font-size:36px;color:var(--error);margin-bottom:12px;display:block;">error</span>
              <p style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:12px;">Generation Failed</p>
              <button onclick="retryQuiz()" style="font-size:13px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;text-decoration:underline;">Retry</button>
            </div>
          </div>`;
      }
    },
    1500
  );
}

async function retryQuiz() {
  allQuestions = [];
  currentIndex = 0;
  answers = [];
  quizFullyLoaded = false;
  if (_poller) _poller.stop();
  try { await cancelGeneration(sessionId, 'quiz'); } catch(e) {}
  _forceRegen = true;
  initDiagnosis();
}

let _forceRegen = false;

function stopQuiz() {
  if (_poller) _poller.stop();
  // Fire cancel in background, navigate immediately (don't wait)
  cancelGeneration(sessionId, 'quiz').catch(function(){});
  window.location.href = '/?session_id=' + sessionId;
}

function showQuestion() {
  // If student is ahead of loaded questions, show waiting state
  if (currentIndex >= allQuestions.length) {
    document.getElementById('questionText').textContent = 'Generating next question...';
    document.getElementById('knowledgeTagText').textContent = '';
    document.querySelectorAll('.option-btn').forEach(b => { b.style.display = 'none'; });
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('nextBtnText').textContent = 'Waiting for questions...';
    // Retry when new questions arrive
    const check = setInterval(() => {
      if (currentIndex < allQuestions.length) { clearInterval(check); showQuestion(); }
    }, 300);
    return;
  }

  document.querySelectorAll('.option-btn').forEach(b => { b.style.display = ''; });

  const q = allQuestions[currentIndex];
  const totalLabel = quizFullyLoaded ? allQuestions.length : allQuestions.length + '+';

  // Update new-style progress
  const fill = document.getElementById('quizProgressFill');
  const label = document.getElementById('quizProgressLabel');
  if (fill) fill.style.width = `${((currentIndex + 1) / allQuestions.length) * 100}%`;
  if (label) label.textContent = `Question ${currentIndex + 1} / ${totalLabel}`;

  document.getElementById('knowledgeTagText').textContent = q.knowledge_point;
  document.getElementById('questionText').textContent = q.question;
  document.getElementById('optA').textContent = q.options[0];
  document.getElementById('optB').textContent = q.options[1];
  document.getElementById('optC').textContent = q.options[2];
  document.getElementById('optD').textContent = q.options[3];
  const isLast = quizFullyLoaded && currentIndex >= allQuestions.length - 1;
  document.getElementById('nextBtnText').textContent = isLast ? 'Complete' : 'Next';

  // Previous button
  const prevBtn = document.getElementById('prevBtn');
  if (prevBtn) prevBtn.disabled = currentIndex === 0;

  // Restore previous answer if going back
  if (currentIndex < answers.length) {
    selectedOption = answers[currentIndex];
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach((b, i) => {
      if (i === selectedOption) b.classList.add('selected');
      else b.classList.remove('selected');
    });
    document.getElementById('nextBtn').disabled = false;
  } else {
    selectedOption = -1;
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('nextBtn').disabled = true;
  }
}

function prevQuestion() {
  if (currentIndex <= 0) return;
  currentIndex--;
  showQuestion();
}

function selectOption(btn, index) {
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedOption = index;
  document.getElementById('nextBtn').disabled = false;
}

async function nextQuestion() {
  if (selectedOption === -1) return;
  // Update or push answer
  if (currentIndex < answers.length) {
    answers[currentIndex] = selectedOption;
  } else {
    answers.push(selectedOption);
  }
  currentIndex++;

  if (currentIndex < allQuestions.length || !quizFullyLoaded) {
    showQuestion();
    return;
  }

  // All done — submit answers to backend
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtnText').textContent = 'Submitting...';
  try {
    const resp = await fetch(`/api/chat/${sessionId}/submit-quiz`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers }),
    });
    if (!resp.ok) throw new Error(`API error: ${resp.status}`);

    updateStepNav(4);
    document.querySelector('main').innerHTML = `
      <div class="content-area">
        <div class="status-card">
          <span class="material-symbols-outlined" style="font-size:48px;color:var(--success);margin-bottom:12px;display:block;font-variation-settings:'FILL' 1;">check_circle</span>
          <p style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;">Diagnosis Complete</p>
          <p class="status-text" style="margin-bottom:24px;">All questions answered. Click below to view diagnosis results.</p>
          <a href="/?session_id=${sessionId}&show=results" style="display:inline-block;background:var(--accent);color:white;padding:10px 28px;border-radius:99px;font-size:13px;font-weight:600;text-decoration:none;">View Results</a>
        </div>
      </div>`;
  } catch (err) {
    document.getElementById('nextBtnText').textContent = 'Complete';
    document.getElementById('nextBtn').disabled = false;
    alert('Submit failed: ' + err.message);
  }
}

initDiagnosis();
</script>

</body>
</html>
