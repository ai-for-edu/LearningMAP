<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenAILearning - Slides</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } } }
</script>
<style>
:root {
  --bg: #FAF9F7; --bg-sidebar: #F0EDE8;
  --border: #EAE6E0;
  --accent: #CF6833; --accent-light: #FFF3EC; --accent-border: #F5D5BF; --accent-dark: #9E4A2A;
  --text: #1a1a1a; --text-2: #4a4a4a; --text-3: #888; --text-4: #B0A898;
  --error: #DC2626;
}
* { box-sizing: border-box; }
body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); margin: 0; }

/* ── Sidebar ── */
#sidebar {
  width: 210px; height: 100vh; position: fixed; left: 0; top: 0;
  background: var(--bg-sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; z-index: 40;
}
.sidebar-logo { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin-bottom: 8px; }
.sidebar-logo-icon {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  display: flex; align-items: center; justify-content: center;
  color: white;
}
.sidebar-logo-text { font-size: 13px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
.new-session-btn {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border: 1.5px dashed #D4CFC8; border-radius: 8px; background: transparent;
  font-size: 13px; font-weight: 500; color: var(--text-3); cursor: pointer;
  margin-bottom: 12px; width: 100%;
}
.new-session-btn:hover { background: white; }
.session-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; font-size: 13px; color: var(--text-3); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-item:hover { background: #E8E4DE; }
.session-item.active { background: white; color: var(--text); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.07); }

/* ── Top Nav ── */
#topNav {
  height: 50px; position: fixed; top: 0; left: 210px; right: 0; z-index: 30;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
}
.topnav-left { display: flex; align-items: center; gap: 8px; }
.topnav-title { font-size: 14px; font-weight: 600; color: var(--text); }
.topnav-actions { display: flex; align-items: center; gap: 8px; }
.topnav-ghost-btn {
  display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500;
  color: var(--text-3); background: transparent; border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 99px; cursor: pointer; text-decoration: none;
}
.topnav-ghost-btn:hover { background: white; color: var(--text-2); }
.topnav-ghost-btn .material-symbols-outlined { font-size: 15px; }

/* ── Step Nav ── */
#stepNav {
  height: 44px; position: fixed; top: 50px; left: 210px; right: 0; z-index: 29;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 0;
}
.step-item {
  display: flex; align-items: center; gap: 6px; padding: 0 8px; height: 44px;
  font-size: 13px; font-weight: 500; color: var(--text-4); cursor: default;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.step-item.done { color: var(--accent); }
.step-item.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
.step-num {
  width: 20px; height: 20px; border-radius: 50%; background: #E8E4DE; color: var(--text-4);
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600;
}
.step-item.done .step-num { background: var(--accent); color: white; }
.step-item.active .step-num { background: var(--accent); color: white; }
.step-sep { color: #D4CFC8; font-size: 14px; padding: 0 4px; }

/* ── Slides area ── */
#mainContent {
  margin-left: 210px; margin-top: 94px; min-height: calc(100vh - 94px);
  display: flex; flex-direction: column; align-items: center; padding-bottom: 40px;
}
.slides-shell { width: 100%; max-width: 1060px; padding: 24px; }
.slide-wrapper { display: flex; justify-content: center; margin-bottom: 16px; }
.slide-canvas {
  width: 1000px; height: 562.5px; position: relative; overflow: hidden;
  border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,.12);
  background: white;
}
.slide-canvas * { box-sizing: border-box; }
.slide-nav-row { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.slide-nav-btn {
  font-size: 13px; font-weight: 500; color: var(--text-3);
  background: transparent; border: 1px solid var(--border);
  padding: 7px 18px; border-radius: 99px; cursor: pointer; transition: all .15s;
}
.slide-nav-btn:hover { background: white; color: var(--text-2); }
.slide-dot-row { display: flex; gap: 6px; align-items: center; }
.slide-dot { width: 6px; height: 6px; border-radius: 50%; background: #D4CFC8; cursor: pointer; transition: background .15s; }
.slide-dot.active { background: var(--accent); width: 8px; height: 8px; }
.slide-counter { font-size: 12px; color: var(--text-4); }

/* Status messages */
.slides-status { text-align: center; padding: 60px 20px; }
.slides-status-text { font-size: 14px; color: var(--text-3); }

/* Slide viewer inner layout */
.slide-viewer-inner { display: flex; flex-direction: column; align-items: center; }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon"><span class="material-symbols-outlined" style="font-size:18px;">school</span></div>
    <span class="sidebar-logo-text">OpenAILearning</span>
  </div>
  <button class="new-session-btn" onclick="window.location.href='index.html'">
    <span class="material-symbols-outlined" style="font-size:16px;">add</span>
    New Chat
  </button>
  <div style="flex:1;overflow-y:auto;" id="session-list"></div>
</aside>

<!-- Top Nav -->
<nav id="topNav">
  <div class="topnav-left">
    <span class="topnav-title" id="topNavTitle">Course Slides</span>
  </div>
  <div class="topnav-actions">
    <button id="navStopBtn" onclick="cancelSlides()" class="topnav-ghost-btn" style="display:none;">
      <span class="material-symbols-outlined" style="font-size:15px;">stop_circle</span>Stop
    </button>
    <button id="navRegenBtn" onclick="regenSlides()" class="topnav-ghost-btn" style="display:none;">
      <span class="material-symbols-outlined" style="font-size:15px;">refresh</span>Retry
    </button>
    <button id="navExportBtn" onclick="exportPptx()" class="topnav-ghost-btn" style="display:none;">
      <span class="material-symbols-outlined" style="font-size:15px;">download</span>Export PPTX
    </button>
    <a id="backLink" href="/" class="topnav-ghost-btn">
      <span class="material-symbols-outlined" style="font-size:15px;">close</span>
    </a>
  </div>
</nav>

<!-- Step Nav -->
<div id="stepNav">
  <div class="step-item done"><span class="step-num">✓</span>Topic</div>
  <span class="step-sep">›</span>
  <div class="step-item done"><span class="step-num">✓</span>Knowledge Graph</div>
  <span class="step-sep">›</span>
  <div class="step-item done"><span class="step-num">✓</span>Diagnosis</div>
  <span class="step-sep">›</span>
  <div class="step-item active"><span class="step-num">4</span>Lesson</div>
</div>

<!-- Main content -->
<div id="mainContent">
  <div class="slides-shell">
    <!-- Loading -->
    <div id="loadingView" class="slides-status">
      <svg class="animate-spin" style="width:48px;height:48px;color:var(--accent);margin:0 auto 16px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <div class="slides-status-text">Generating slides…</div>
      <div class="slides-status-text" style="margin-top:6px;font-size:12px;color:var(--text-4);">AI is creating slides, please wait…</div>
    </div>

    <!-- Slide Viewer (hidden until loaded) -->
    <div id="slideViewer" class="hidden slide-viewer-inner">
      <!-- Slide title -->
      <p id="slideTitle" style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:12px;text-align:center;"></p>

      <!-- Canvas wrapper for scaling -->
      <div class="slide-wrapper">
        <div id="canvasWrapper" style="position:relative;">
          <div id="slideCanvas" class="slide-canvas"></div>
        </div>
      </div>

      <!-- Controls -->
      <div class="slide-nav-row" style="margin-top:16px;">
        <button id="prevBtn" onclick="goSlide(-1)" class="slide-nav-btn" disabled>
          ← Previous
        </button>
        <span id="pageIndicator" class="slide-counter">1 / 1</span>
        <button id="nextBtn" onclick="goSlide(1)" class="slide-nav-btn">
          Next →
        </button>
      </div>

      <!-- Thumbnail strip -->
      <div id="thumbnailStrip" style="display:flex;gap:12px;margin-top:20px;overflow-x:auto;padding-bottom:8px;max-width:90vw;"></div>

      <!-- Action buttons -->
      <div style="margin-top:24px;display:flex;gap:12px;">
        <button onclick="exportPptx()" class="topnav-ghost-btn" style="padding:8px 20px;font-size:13px;">
          <span class="material-symbols-outlined" style="font-size:16px;">download</span>
          Export PPTX
        </button>
        <a id="finishBtn" href="/" class="topnav-ghost-btn" style="padding:8px 20px;font-size:13px;">
          <span class="material-symbols-outlined" style="font-size:16px;font-variation-settings:'FILL' 1;">check_circle</span>
          Finish Learning
        </a>
      </div>
    </div>
  </div>
</div>

<script src="sidebar.js?v=3"></script>
<script src="api.js?v=8"></script>
<script>
var sessionId = getSessionId();
var allSlides = [];
var currentSlideIndex = 0;

// Update back/finish links
if (sessionId) {
  document.getElementById('backLink').href = '/?session_id=' + sessionId;
  document.getElementById('finishBtn').href = '/?session_id=' + sessionId;
}

var totalSlides = 0;
var slidesFullyLoaded = false;
var _slidePoller = null;

function updateSlideNavButtons() {
  var stop = document.getElementById('navStopBtn');
  var regen = document.getElementById('navRegenBtn');
  var exportBtn = document.getElementById('navExportBtn');
  if (slidesFullyLoaded) {
    if (stop) stop.style.display = 'none';
    if (regen) regen.style.display = '';
    if (exportBtn) exportBtn.style.display = '';
  } else {
    if (stop) stop.style.display = '';
    if (regen) regen.style.display = 'none';
    if (exportBtn) exportBtn.style.display = 'none';
  }
}

async function init() {
  if (!sessionId) { window.location.href = '/'; return; }

  var forceRegen = new URLSearchParams(window.location.search).has('regen');
  var state = await getSessionState(sessionId);

  // Check if slides already fully generated (skip if forcing regen)
  // Content-first: if all slides have data, they're done regardless of task status
  var allSlidesReady = state.slide_contents && state.slide_contents.length > 0 && state.slide_contents.every(function(s) { return s !== null; });
  if (!forceRegen && allSlidesReady) {
    allSlides = state.slide_contents;
    totalSlides = allSlides.length;
    slidesFullyLoaded = true;
    showSlideViewer();
    updateSlideNavButtons();
    return;
  }

  // Partially generated (came back mid-generation)
  if (!forceRegen && state.slide_contents && state.slide_contents.length > 0) {
    allSlides = state.slide_contents;
    totalSlides = allSlides.length;
    showSlideViewer();
    updateLoadingProgress(allSlides.filter(Boolean).length, totalSlides);
    startSlidePolling();
    return;
  }

  // Nothing yet — trigger background generation
  document.getElementById('loadingView').innerHTML = `
    <div class="slides-status">
      <svg class="animate-spin" style="width:48px;height:48px;color:var(--accent);margin:0 auto 16px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <div class="slides-status-text">Generating slides…</div>
      <div class="slides-status-text" style="margin-top:6px;font-size:12px;color:var(--text-4);">Creating outline and slides…</div>
    </div>`;

  try { await startGeneration(sessionId, 'slides'); } catch(e) {}
  startSlidePolling();
}

function startSlidePolling() {
  updateSlideNavButtons();
  _slidePoller = pollStatus(sessionId, 'slides',
    async function onUpdate(status) {
      try {
        var state = await getSessionState(sessionId);
        if (state.slide_contents && state.slide_contents.length > 0) {
          var oldLen = allSlides.filter(Boolean).length;
          allSlides = state.slide_contents;
          totalSlides = allSlides.length;

          if (!document.getElementById('slideCanvas')) {
            // First slides arrived — show viewer
            showSlideViewer();
          }

          var newLen = allSlides.filter(Boolean).length;
          if (newLen > oldLen) {
            buildThumbnails();
            if (allSlides[currentSlideIndex]) showSlide(currentSlideIndex);
            // Re-highlight
            document.querySelectorAll('.thumb').forEach(function(t, i) {
              t.style.borderColor = i === currentSlideIndex ? 'var(--accent)' : 'var(--border)';
              t.style.opacity = i === currentSlideIndex ? '1' : '0.6';
            });
          }
          updateLoadingProgress(newLen, totalSlides);
        }
      } catch(e) {}
    },
    async function onDone(status) {
      slidesFullyLoaded = true;
      updateSlideNavButtons();
      var prog = document.getElementById('slideProgress');
      if (prog) prog.remove();
      // Final fetch
      try {
        var state = await getSessionState(sessionId);
        if (state.slide_contents) {
          allSlides = state.slide_contents;
          totalSlides = allSlides.length;
          if (!document.getElementById('slideCanvas')) showSlideViewer();
          else { buildThumbnails(); showSlide(currentSlideIndex); }
        }
      } catch(e) {}
    },
    2000
  );
}

function cancelSlides() {
  if (_slidePoller) _slidePoller.stop();
  cancelGeneration(sessionId, 'slides').catch(function(){});
  window.location.href = '/?session_id=' + sessionId;
}

function regenSlides() {
  if (_slidePoller) _slidePoller.stop();
  cancelGeneration(sessionId, 'slides').catch(function(){});
  window.location.href = 'slides.html?session_id=' + sessionId + '&regen=1';
}

function updateLoadingProgress(current, total) {
  var existing = document.getElementById('slideProgress');
  if (!existing) {
    var bar = document.createElement('div');
    bar.id = 'slideProgress';
    bar.style.cssText = 'position:fixed;top:53px;left:0;right:0;z-index:100;padding:4px 24px;background:white;border-bottom:1px solid var(--text-4);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);';
    bar.innerHTML = '<span>Generating...</span><div style="flex:1;height:4px;background:var(--text-4);border-radius:4px;overflow:hidden"><div id="slideProgressBar" style="height:100%;background:var(--accent);border-radius:4px;transition:width 0.3s"></div></div><span id="slideProgressText"></span>';
    document.body.appendChild(bar);
  }
  var pct = total > 0 ? Math.round((current / total) * 100) : 0;
  var pbar = document.getElementById('slideProgressBar');
  if (pbar) pbar.style.width = pct + '%';
  var ptxt = document.getElementById('slideProgressText');
  if (ptxt) ptxt.textContent = current + '/' + total;
}

function updateThumbnail(index) {
  // Simply rebuild all thumbnails — simpler and more reliable
  buildThumbnails();
  // Re-highlight current
  var thumbs = document.querySelectorAll('.thumb');
  thumbs.forEach(function(t, i) {
    t.style.borderColor = i === currentSlideIndex ? 'var(--accent)' : 'var(--border)';
    t.style.opacity = i === currentSlideIndex ? '1' : '0.6';
  });
}

function showSlideViewer() {
  document.getElementById('loadingView').classList.add('hidden');
  document.getElementById('slideViewer').classList.remove('hidden');
  buildThumbnails();
  showSlide(0);
  scaleCanvas();
  window.addEventListener('resize', scaleCanvas);
  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === ' ') goSlide(1);
    if (e.key === 'ArrowLeft') goSlide(-1);
  });
}

function scaleCanvas() {
  var wrapper = document.getElementById('canvasWrapper');
  var maxW = Math.min(window.innerWidth - 48, 1000);
  var maxH = window.innerHeight - 280;
  var scale = Math.min(maxW / 1000, maxH / 562.5, 1);
  wrapper.style.width = (1000 * scale) + 'px';
  wrapper.style.height = (562.5 * scale) + 'px';
  var canvas = document.getElementById('slideCanvas');
  canvas.style.transform = 'scale(' + scale + ')';
  canvas.style.transformOrigin = 'top left';
}

function showSlide(index) {
  currentSlideIndex = index;
  var slide = allSlides[index];
  var canvas = document.getElementById('slideCanvas');

  if (!slide) {
    // Slide not generated yet — show spinner
    canvas.innerHTML = '';
    canvas.style.background = '#f8fafc';
    canvas.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">' +
      '<svg class="animate-spin" style="width:40px;height:40px;color:var(--accent);" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>' +
      '<span style="font-size:14px;color:var(--text-3);">Slide ' + (index + 1) + ' generating…</span></div>';
  } else {
    renderSlide(canvas, slide);
  }

  // Update controls
  var totalLabel = slidesFullyLoaded ? allSlides.length : allSlides.length + '';
  document.getElementById('pageIndicator').textContent = (index + 1) + ' / ' + totalLabel;
  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextBtn').disabled = index === allSlides.length - 1;

  // Update thumbnail highlight
  document.querySelectorAll('.thumb').forEach(function(t, i) {
    t.style.borderColor = i === index ? 'var(--accent)' : 'var(--border)';
    t.style.opacity = i === index ? '1' : '0.6';
  });
}

function goSlide(delta) {
  var next = currentSlideIndex + delta;
  if (next >= 0 && next < allSlides.length) showSlide(next);
}

function buildThumbnails() {
  var strip = document.getElementById('thumbnailStrip');
  strip.innerHTML = '';
  allSlides.forEach(function(slide, i) {
    var thumb = document.createElement('button');
    thumb.className = 'thumb flex-shrink-0 rounded-lg border-2 overflow-hidden bg-white';
    thumb.style.width = '120px';
    thumb.style.height = '67.5px';
    thumb.style.borderColor = 'var(--border)';
    thumb.style.opacity = '0.6';
    thumb.style.position = 'relative';
    thumb.onclick = function() { showSlide(i); };

    // Spinner for unloaded slides
    if (!slide) {
      thumb.innerHTML = '<div class="thumb-spinner" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f8fafc;"><svg class="animate-spin" style="width:16px;height:16px;color:#94a3b8;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg></div>';
      strip.appendChild(thumb);
      return;
    }

    // Mini render
    var mini = document.createElement('div');
    mini.style.width = '1000px';
    mini.style.height = '562.5px';
    mini.style.position = 'relative';
    mini.style.transform = 'scale(0.12)';
    mini.style.transformOrigin = 'top left';
    mini.style.pointerEvents = 'none';
    if (slide && slide.background && slide.background.color) {
      mini.style.background = slide.background.color;
    }
    // Only render text and shape elements for thumbnails (lightweight)
    if (slide && slide.elements) {
      for (var j = 0; j < slide.elements.length; j++) {
        var el = slide.elements[j];
        if (el.type === 'text') {
          var d = document.createElement('div');
          d.style.position = 'absolute';
          d.style.left = el.left + 'px';
          d.style.top = el.top + 'px';
          d.style.width = el.width + 'px';
          d.style.height = el.height + 'px';
          d.style.padding = '10px';
          d.style.color = el.defaultColor || '#333';
          d.style.overflow = 'hidden';
          d.innerHTML = (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(el.content || '') : '';
          mini.appendChild(d);
        } else if (el.type === 'shape') {
          var d2 = document.createElement('div');
          d2.style.position = 'absolute';
          d2.style.left = el.left + 'px';
          d2.style.top = el.top + 'px';
          d2.style.width = el.width + 'px';
          d2.style.height = el.height + 'px';
          d2.style.backgroundColor = el.fill || '#5b9bd5';
          mini.appendChild(d2);
        }
      }
    }
    thumb.appendChild(mini);

    // Page number overlay
    var num = document.createElement('span');
    num.style.cssText = 'position:absolute;bottom:0;right:0;background:rgba(0,0,0,0.5);color:white;font-size:8px;padding:2px 4px;border-radius:4px 0 0 0;';
    num.textContent = i + 1;
    thumb.appendChild(num);

    strip.appendChild(thumb);
  });
}

// Main render function
function renderSlide(container, slideData) {
  container.innerHTML = '';
  if (!slideData) {
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-3);">This slide failed to generate</div>';
    return;
  }

  var bg = slideData.background;
  container.style.background = (bg && bg.color) ? bg.color : '#ffffff';

  for (var idx = 0; idx < (slideData.elements || []).length; idx++) {
    var el = slideData.elements[idx];
    var div = document.createElement('div');
    div.style.position = 'absolute';
    div.style.left = el.left + 'px';
    div.style.top = el.top + 'px';
    div.style.width = el.width + 'px';
    div.style.height = el.height + 'px';
    if (el.rotate) div.style.transform = 'rotate(' + el.rotate + 'deg)';

    switch (el.type) {
      case 'text':
        div.style.padding = '10px';
        div.style.lineHeight = String(el.lineHeight || 1.5);
        div.style.color = el.defaultColor || '#333';
        div.style.fontFamily = el.defaultFontName || 'Inter, "Microsoft YaHei", sans-serif';
        if (el.fill) div.style.backgroundColor = el.fill;
        if (el.opacity !== undefined && el.opacity !== 1) div.style.opacity = el.opacity;
        div.innerHTML = (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(el.content) : el.content;
        break;

      case 'latex':
        div.style.display = 'flex';
        div.style.alignItems = 'center';
        div.style.justifyContent = el.align || 'center';
        div.style.color = el.color || '#000';
        try {
          if (typeof katex !== 'undefined') {
            div.innerHTML = katex.renderToString(el.latex, {
              throwOnError: false, displayMode: true, output: 'html'
            });
          } else {
            div.textContent = el.latex;
          }
        } catch (e) {
          div.textContent = el.latex;
        }
        break;

      case 'shape':
        var ns = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(ns, 'svg');
        var vb = el.viewBox || [1, 1];
        svg.setAttribute('viewBox', '0 0 ' + vb[0] + ' ' + vb[1]);
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.style.width = '100%';
        svg.style.height = '100%';
        var p = document.createElementNS(ns, 'path');
        p.setAttribute('d', el.path);
        p.setAttribute('fill', el.fill || '#5b9bd5');
        svg.appendChild(p);
        div.appendChild(svg);
        break;

      case 'line':
        var lns = 'http://www.w3.org/2000/svg';
        var s = el.start || [0, 0];
        var e = el.end || [100, 0];
        var lsvg = document.createElementNS(lns, 'svg');
        lsvg.style.overflow = 'visible';
        lsvg.style.position = 'absolute';
        lsvg.style.left = '0';
        lsvg.style.top = '0';
        lsvg.style.width = '100%';
        lsvg.style.height = '100%';

        if (el.points && (el.points[0] === 'arrow' || el.points[1] === 'arrow')) {
          var defs = document.createElementNS(lns, 'defs');
          var marker = document.createElementNS(lns, 'marker');
          marker.setAttribute('id', 'arr-' + el.id);
          marker.setAttribute('viewBox', '0 0 10 10');
          marker.setAttribute('refX', '10');
          marker.setAttribute('refY', '5');
          marker.setAttribute('markerWidth', '6');
          marker.setAttribute('markerHeight', '6');
          marker.setAttribute('orient', 'auto-start-reverse');
          var ap = document.createElementNS(lns, 'path');
          ap.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z');
          ap.setAttribute('fill', el.color || '#333');
          marker.appendChild(ap);
          defs.appendChild(marker);
          lsvg.appendChild(defs);
        }

        var ln = document.createElementNS(lns, 'line');
        ln.setAttribute('x1', s[0]);
        ln.setAttribute('y1', s[1]);
        ln.setAttribute('x2', e[0]);
        ln.setAttribute('y2', e[1]);
        ln.setAttribute('stroke', el.color || '#333');
        ln.setAttribute('stroke-width', el.width || 2);
        if (el.style === 'dashed') ln.setAttribute('stroke-dasharray', '8,4');
        if (el.style === 'dotted') ln.setAttribute('stroke-dasharray', '2,4');
        if (el.points && el.points[1] === 'arrow') ln.setAttribute('marker-end', 'url(#arr-' + el.id + ')');
        if (el.points && el.points[0] === 'arrow') ln.setAttribute('marker-start', 'url(#arr-' + el.id + ')');
        lsvg.appendChild(ln);
        div.appendChild(lsvg);
        break;

      case 'chart':
        if (typeof echarts !== 'undefined') {
          var chartDiv = document.createElement('div');
          chartDiv.style.width = '100%';
          chartDiv.style.height = '100%';
          div.appendChild(chartDiv);
          setTimeout(function() {
            var chart = echarts.init(chartDiv, null, { renderer: 'svg' });
            var option = buildChartOption(el);
            if (option) chart.setOption(option, true);
          }, 100);
        } else {
          div.textContent = '[Chart: ' + (el.chartType || 'bar') + ']';
          div.style.display = 'flex';
          div.style.alignItems = 'center';
          div.style.justifyContent = 'center';
          div.style.background = '#f0f0f0';
          div.style.color = '#999';
        }
        break;

      case 'table':
        var table = document.createElement('table');
        table.style.width = '100%';
        table.style.height = '100%';
        table.style.borderCollapse = 'collapse';
        table.style.tableLayout = 'fixed';
        var outline = el.outline || {};
        var borderStyle = outline.width ? (outline.width + 'px ' + (outline.style || 'solid') + ' ' + (outline.color || '#eeece1')) : '1px solid #ddd';
        var colWidths = el.colWidths || [];
        // Build hidden cells set
        var hiddenCells = {};
        if (el.data) {
          for (var ri = 0; ri < el.data.length; ri++) {
            for (var ci = 0; ci < el.data[ri].length; ci++) {
              var cell = el.data[ri][ci];
              if (cell.colspan > 1 || cell.rowspan > 1) {
                for (var rr = ri; rr < ri + cell.rowspan; rr++) {
                  for (var cc = (rr === ri ? ci + 1 : ci); cc < ci + cell.colspan; cc++) {
                    hiddenCells[rr + '_' + cc] = true;
                  }
                }
              }
            }
          }
        }
        // Render rows
        var tbody = document.createElement('tbody');
        if (el.data) {
          for (var ri2 = 0; ri2 < el.data.length; ri2++) {
            var tr = document.createElement('tr');
            for (var ci2 = 0; ci2 < el.data[ri2].length; ci2++) {
              if (hiddenCells[ri2 + '_' + ci2]) continue;
              var td = document.createElement('td');
              var cellData = el.data[ri2][ci2];
              td.style.border = borderStyle;
              td.style.padding = '5px';
              td.style.verticalAlign = 'middle';
              td.style.wordBreak = 'break-word';
              td.style.fontSize = '14px';
              if (cellData.colspan > 1) td.colSpan = cellData.colspan;
              if (cellData.rowspan > 1) td.rowSpan = cellData.rowspan;
              if (cellData.style) {
                if (cellData.style.bold) td.style.fontWeight = 'bold';
                if (cellData.style.em) td.style.fontStyle = 'italic';
                if (cellData.style.color) td.style.color = cellData.style.color;
                if (cellData.style.backcolor) td.style.backgroundColor = cellData.style.backcolor;
                if (cellData.style.fontsize) td.style.fontSize = cellData.style.fontsize;
                if (cellData.style.align) td.style.textAlign = cellData.style.align;
              }
              td.innerHTML = (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize((cellData.text || '').replace(/\n/g, '<br/>')) : escapeHtml(cellData.text || '');
              tr.appendChild(td);
            }
            tbody.appendChild(tr);
          }
        }
        table.appendChild(tbody);
        div.appendChild(table);
        break;
    }

    container.appendChild(div);
  }
}

function buildChartOption(el) {
  var d = el.data || {};
  var labels = d.labels || [];
  var legends = d.legends || [];
  var series = d.series || [];
  var colors = el.themeColors || ['#5b9bd5','#ed7d31','#a5a5a5','#ffc000','#4472c4'];
  var textColor = el.textColor || '#333';
  var t = el.chartType || 'bar';

  var legend = series.length > 1 || t === 'pie' || t === 'ring'
    ? { top: 'bottom', textStyle: { color: textColor } } : undefined;

  if (t === 'bar') {
    return { color: colors, legend: legend,
      xAxis: { type: 'category', data: labels, axisLabel: { color: textColor } },
      yAxis: { type: 'value', axisLabel: { color: textColor } },
      series: series.map(function(s, i) { return { data: s, name: legends[i]||'', type: 'bar', label: { show: true }, itemStyle: { borderRadius: [2,2,0,0] } }; }) };
  }
  if (t === 'column') {
    return { color: colors, legend: legend,
      yAxis: { type: 'category', data: labels },
      xAxis: { type: 'value' },
      series: series.map(function(s, i) { return { data: s, name: legends[i]||'', type: 'bar' }; }) };
  }
  if (t === 'line') {
    return { color: colors, legend: legend,
      xAxis: { type: 'category', data: labels },
      yAxis: { type: 'value' },
      series: series.map(function(s, i) { return { data: s, name: legends[i]||'', type: 'line', smooth: el.options?.lineSmooth, label: { show: true } }; }) };
  }
  if (t === 'pie' || t === 'ring') {
    return { color: colors, legend: { top: 'bottom', textStyle: { color: textColor } },
      series: [{ type: 'pie', radius: t === 'ring' ? ['40%','70%'] : '70%',
        data: (series[0]||[]).map(function(v, i) { return { value: v, name: labels[i] }; }),
        emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.5)' } } }] };
  }
  if (t === 'area') {
    return { color: colors, legend: legend,
      xAxis: { type: 'category', boundaryGap: false, data: labels },
      yAxis: { type: 'value' },
      series: series.map(function(s, i) { return { data: s, name: legends[i]||'', type: 'line', areaStyle: {} }; }) };
  }
  if (t === 'radar') {
    return { color: colors, legend: legend,
      radar: { indicator: labels.map(function(l) { return { name: l }; }) },
      series: [{ type: 'radar', data: series.map(function(s, i) { return { value: s, name: legends[i]||'' }; }) }] };
  }
  if (t === 'scatter') {
    var sd = [];
    for (var i = 0; i < (series[0]||[]).length; i++) { sd.push([series[0][i], series[1] ? series[1][i] : series[0][i]]); }
    return { color: colors, xAxis: {}, yAxis: {}, series: [{ type: 'scatter', symbolSize: 12, data: sd }] };
  }
  return null;
}

function exportPptx() {
  if (!sessionId) return;
  window.open('/api/chat/' + sessionId + '/export-pptx', '_blank');
}

init();
</script>
